<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐸 呱呱打青蛙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Zen+Kaku+Gothic+New:wght@700&display=swap');

:root {
–bg: #0a0a1a;
–grid: #111130;
–hole: #050510;
–accent: #00ffaa;
–danger: #ff4466;
–warn: #ffcc00;
–glow: rgba(0,255,170,0.4);
}

- { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: var(–bg);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-family: ‘Press Start 2P’, monospace;
overflow: hidden;
user-select: none;
}

/* Scanline overlay */
body::after {
content: ‘’;
position: fixed;
inset: 0;
background: repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(0,0,0,0.08) 2px,
rgba(0,0,0,0.08) 4px
);
pointer-events: none;
z-index: 999;
}

/* Starfield */
.stars {
position: fixed;
inset: 0;
pointer-events: none;
overflow: hidden;
z-index: 0;
}
.star {
position: absolute;
border-radius: 50%;
background: white;
animation: twinkle linear infinite;
}

@keyframes twinkle {
0%,100% { opacity: 0.2; transform: scale(1); }
50% { opacity: 1; transform: scale(1.4); }
}

.wrapper {
position: relative;
z-index: 1;
display: flex;
flex-direction: column;
align-items: center;
gap: 18px;
}

h1 {
font-size: clamp(16px, 4vw, 28px);
color: var(–accent);
text-shadow: 0 0 20px var(–accent), 0 0 40px var(–glow);
letter-spacing: 2px;
animation: flicker 3s infinite;
}
@keyframes flicker {
0%,95%,100% { opacity: 1; }
96% { opacity: 0.6; }
97% { opacity: 1; }
98% { opacity: 0.4; }
}

.hud {
display: flex;
gap: 32px;
align-items: center;
}
.hud-item {
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
}
.hud-label {
font-size: 8px;
color: #556;
letter-spacing: 2px;
}
.hud-val {
font-size: clamp(14px, 3vw, 20px);
color: var(–warn);
text-shadow: 0 0 12px rgba(255,204,0,0.6);
min-width: 60px;
text-align: center;
}
#timerVal {
color: var(–accent);
text-shadow: 0 0 12px var(–glow);
transition: color 0.3s;
}
#timerVal.urgent { color: var(–danger); text-shadow: 0 0 12px rgba(255,68,102,0.6); animation: pulse 0.4s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

.grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 14px;
padding: 24px;
background: var(–grid);
border: 2px solid #223;
border-radius: 12px;
box-shadow: 0 0 40px rgba(0,255,170,0.08), inset 0 0 30px rgba(0,0,0,0.5);
}

.hole {
width: clamp(70px, 14vw, 100px);
height: clamp(70px, 14vw, 100px);
background: var(–hole);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: clamp(28px, 6vw, 44px);
cursor: pointer;
position: relative;
border: 2px solid #1a1a40;
box-shadow: inset 0 4px 12px rgba(0,0,0,0.8), 0 0 0 1px #0d0d20;
transition: transform 0.1s;
overflow: hidden;
}
.hole::before {
content: ‘’;
position: absolute;
inset: 0;
border-radius: 50%;
background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.04), transparent 60%);
pointer-events: none;
}

.frog {
position: absolute;
bottom: -100%;
transition: bottom 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
filter: drop-shadow(0 -4px 8px rgba(0,255,100,0.5));
line-height: 1;
}
.frog.up { bottom: 5%; }
.frog.bad { filter: drop-shadow(0 -4px 8px rgba(255,80,80,0.7)); }

.hole:active { transform: scale(0.92); }

/* Hit flash */
.hole.hit::after {
content: ‘’;
position: absolute;
inset: 0;
border-radius: 50%;
background: rgba(0,255,170,0.45);
animation: hitFlash 0.3s forwards;
}
.hole.hit-bad::after {
background: rgba(255,68,102,0.45);
}
@keyframes hitFlash { to { opacity: 0; transform: scale(1.3); } }

/* Score popup */
.popup {
position: fixed;
font-size: 14px;
font-family: ‘Press Start 2P’, monospace;
pointer-events: none;
z-index: 100;
animation: floatUp 0.8s forwards;
}
.popup.good { color: var(–accent); text-shadow: 0 0 8px var(–accent); }
.popup.bad  { color: var(–danger); text-shadow: 0 0 8px var(–danger); }
@keyframes floatUp {
0%   { opacity: 1; transform: translateY(0) scale(1); }
100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
}

/* Overlay */
.overlay {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.88);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 24px;
z-index: 200;
backdrop-filter: blur(4px);
}
.overlay h2 {
font-size: clamp(18px, 5vw, 32px);
color: var(–accent);
text-shadow: 0 0 30px var(–glow);
text-align: center;
}
.overlay p {
font-size: 10px;
color: #556;
letter-spacing: 2px;
text-align: center;
line-height: 2;
}
.final-score {
font-size: clamp(24px, 6vw, 48px);
color: var(–warn);
text-shadow: 0 0 20px rgba(255,204,0,0.7);
}

.btn {
padding: 14px 32px;
background: transparent;
border: 2px solid var(–accent);
color: var(–accent);
font-family: ‘Press Start 2P’, monospace;
font-size: 12px;
cursor: pointer;
letter-spacing: 2px;
text-shadow: 0 0 10px var(–accent);
box-shadow: 0 0 20px rgba(0,255,170,0.2), inset 0 0 20px rgba(0,255,170,0.05);
transition: all 0.2s;
border-radius: 4px;
}
.btn:hover {
background: rgba(0,255,170,0.12);
box-shadow: 0 0 30px rgba(0,255,170,0.4), inset 0 0 20px rgba(0,255,170,0.1);
transform: scale(1.04);
}

.legend {
display: flex;
gap: 24px;
font-size: 8px;
color: #445;
}
.legend span { display: flex; align-items: center; gap: 8px; }

/* Timer bar */
.timer-bar-wrap {
width: 100%;
max-width: 500px;
height: 6px;
background: #111;
border-radius: 3px;
overflow: hidden;
}
.timer-bar {
height: 100%;
background: linear-gradient(90deg, var(–accent), var(–warn));
transition: width 0.2s linear, background 0.5s;
border-radius: 3px;
}
.timer-bar.low { background: linear-gradient(90deg, var(–danger), #ff8844); }
</style>

</head>
<body>

<div class="stars" id="stars"></div>

<!-- Start overlay -->

<div class="overlay" id="startOverlay">
  <h2>🐸 呱呱打青蛙</h2>
  <p>打綠色青蛙 +10 分<br>打紅色💀青蛙 −15 分<br>時間30秒，快點打！</p>
  <button class="btn" id="startBtn">► 開 始 遊 戲</button>
</div>

<!-- Game over overlay -->

<div class="overlay" id="endOverlay" style="display:none">
  <h2 id="endTitle">⏰ 時間到！</h2>
  <div class="final-score" id="finalScore">000</div>
  <p id="endMsg"></p>
  <button class="btn" id="restartBtn">► 再 玩 一 次</button>
</div>

<div class="wrapper">
  <h1>🐸 呱呱打青蛙</h1>

  <div class="hud">
    <div class="hud-item">
      <span class="hud-label">SCORE</span>
      <span class="hud-val" id="scoreVal">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">TIME</span>
      <span class="hud-val" id="timerVal">30</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">BEST</span>
      <span class="hud-val" id="bestVal">0</span>
    </div>
  </div>

  <div class="timer-bar-wrap">
    <div class="timer-bar" id="timerBar" style="width:100%"></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="legend">
    <span>🐸 +10 分</span>
    <span>☠️ −15 分</span>
  </div>
</div>

<script>
  // Starfield
  const starsCont = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 1;
    s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s`;
    starsCont.appendChild(s);
  }

  const TOTAL = 30;
  const HOLES = 12;
  let score = 0, best = parseInt(localStorage.getItem('frogBest') || '0');
  let timeLeft = TOTAL;
  let running = false;
  let holes = [], activeHoles = {}, timers = {};

  // Build grid
  const grid = document.getElementById('grid');
  for (let i = 0; i < HOLES; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    hole.dataset.idx = i;
    const frog = document.createElement('span');
    frog.className = 'frog';
    hole.appendChild(frog);
    hole.addEventListener('click', () => whack(i, hole));
    grid.appendChild(hole);
    holes.push(hole);
  }

  document.getElementById('bestVal').textContent = best;

  function setScore(v) {
    score = Math.max(0, v);
    document.getElementById('scoreVal').textContent = score;
  }

  function showPopup(x, y, text, type) {
    const p = document.createElement('div');
    p.className = `popup ${type}`;
    p.textContent = text;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }

  function whack(idx, hole) {
    if (!running || !activeHoles[idx]) return;
    const info = activeHoles[idx];
    clearTimeout(info.timeout);
    retractFrog(idx, hole);

    const rect = hole.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    if (info.bad) {
      setScore(score - 15);
      showPopup(cx - 20, cy - 20, '-15', 'bad');
      hole.classList.add('hit', 'hit-bad');
    } else {
      setScore(score + 10);
      showPopup(cx - 20, cy - 20, '+10', 'good');
      hole.classList.add('hit');
    }
    setTimeout(() => hole.classList.remove('hit', 'hit-bad'), 350);
  }

  function spawnFrog() {
    if (!running) return;

    // Find free hole
    const free = [];
    for (let i = 0; i < HOLES; i++) if (!activeHoles[i]) free.push(i);
    if (!free.length) return;

    const idx = free[Math.floor(Math.random() * free.length)];
    const hole = holes[idx];
    const frog = hole.querySelector('.frog');
    const bad = Math.random() < 0.25;

    frog.textContent = bad ? '☠️' : '🐸';
    frog.className = 'frog up' + (bad ? ' bad' : '');

    const stayTime = 900 + Math.random() * 600;
    const timeout = setTimeout(() => retractFrog(idx, hole), stayTime);

    activeHoles[idx] = { timeout, bad };

    // Next spawn
    const nextSpawn = Math.max(300, 700 - (TOTAL - timeLeft) * 12);
    timers.spawn = setTimeout(spawnFrog, nextSpawn);
  }

  function retractFrog(idx, hole) {
    const frog = hole.querySelector('.frog');
    frog.className = 'frog';
    delete activeHoles[idx];
  }

  function startGame() {
    score = 0;
    timeLeft = TOTAL;
    running = true;
    activeHoles = {};
    holes.forEach(h => { h.querySelector('.frog').className = 'frog'; });
    document.getElementById('scoreVal').textContent = '0';
    document.getElementById('timerVal').textContent = TOTAL;
    document.getElementById('timerVal').classList.remove('urgent');
    document.getElementById('timerBar').style.width = '100%';
    document.getElementById('timerBar').classList.remove('low');

    spawnFrog();
    timers.countdown = setInterval(tick, 1000);
  }

  function tick() {
    timeLeft--;
    document.getElementById('timerVal').textContent = timeLeft;
    document.getElementById('timerBar').style.width = (timeLeft / TOTAL * 100) + '%';

    if (timeLeft <= 8) {
      document.getElementById('timerVal').classList.add('urgent');
      document.getElementById('timerBar').classList.add('low');
    }

    if (timeLeft <= 0) endGame();
  }

  function endGame() {
    running = false;
    clearInterval(timers.countdown);
    clearTimeout(timers.spawn);
    Object.values(activeHoles).forEach(info => clearTimeout(info.timeout));
    holes.forEach(h => { h.querySelector('.frog').className = 'frog'; });
    activeHoles = {};

    if (score > best) {
      best = score;
      localStorage.setItem('frogBest', best);
      document.getElementById('bestVal').textContent = best;
    }

    const msgs = [
      [200, '🏆 青蛙殺手！', '你打青蛙的技術超神！'],
      [100, '💪 好厲害！', '繼續練習，可以更高！'],
      [50,  '😅 還不錯嘛', '多打幾場就更棒了～'],
      [0,   '🐸 青蛙笑了', '哥們，青蛙都沒被打到...'],
    ];
    const [, title, msg] = msgs.find(([t]) => score >= t);

    document.getElementById('endTitle').textContent = title;
    document.getElementById('finalScore').textContent = score + ' 分';
    document.getElementById('endMsg').textContent = msg + (score >= best && score > 0 ? '\n🌟 新紀錄！' : '');
    document.getElementById('endOverlay').style.display = 'flex';
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startOverlay').style.display = 'none';
    startGame();
  });
  document.getElementById('restartBtn').addEventListener('click', () => {
    document.getElementById('endOverlay').style.display = 'none';
    startGame();
  });
</script>

</body>
</html>
