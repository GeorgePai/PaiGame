<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Shadow Cards</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#e8e4d8;font-family:Georgia,serif;overflow:hidden;height:100vh;touch-action:none}
#root{width:100vw;height:100vh;display:flex;flex-direction:column}
button{font-family:Georgia,serif;cursor:pointer}

/* ── CARD ── */
.card{width:82px;height:112px;background:#f4f0e8;border:1px solid #222;border-radius:6px;position:relative;overflow:hidden;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.55)}
.card.sm{width:68px;height:94px}
.card.sel{border:2px solid #ffd700!important;box-shadow:0 0 18px rgba(255,215,0,.75)!important}
.card.playable{border:2px solid rgba(55,148,255,.92)!important;box-shadow:0 0 22px rgba(40,130,255,.66)!important;animation:pBlue 1.8s ease-in-out infinite}
.card.faded{opacity:.22;filter:grayscale(70%);pointer-events:none}
.cname{position:absolute;top:27px;left:2px;right:2px;text-align:center;font-size:8px;color:#111;font-weight:bold;line-height:1.1}
.card.sm .cname{top:17px;font-size:7px}
.csym{position:absolute;top:36%;left:0;right:0;text-align:center;font-size:24px;color:#1a1a1a}
.card.sm .csym{font-size:18px}
.cdesc{position:absolute;bottom:6px;left:2px;right:2px;text-align:center;font-size:6.5px;color:#555;line-height:1.3}

/* ── CARD BACK ── */
.cardback{width:68px;height:94px;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* ── MINION ── */
.minion{width:68px;height:88px;background:#f4f0e8;border:1px solid #444;border-radius:6px;position:relative;cursor:pointer;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.minion.can{border:2px solid rgba(50,148,255,.88)!important;box-shadow:0 0 18px rgba(40,130,255,.52)!important;animation:pBlue 1.8s ease-in-out infinite}
.minion.atk-sel{background:#1a1a1a;border:2px solid #ffd700!important;box-shadow:0 0 16px rgba(255,215,0,.65)!important;animation:none!important}
.minion.glow{border:2px dashed #c83030!important;box-shadow:0 0 10px rgba(200,50,50,.4)!important}
.minion.sick{opacity:.58}
.minion.lunging{animation:lunge .38s cubic-bezier(.4,0,.6,1) forwards!important;z-index:50}
.minion.dying{animation:deathBurst .44s ease-out forwards!important;pointer-events:none}
.minion.new-summon{animation:minionIn .42s cubic-bezier(.15,1.4,.6,1) both}
.minion .mn{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:7px;font-weight:bold;color:#111;padding:0 3px;line-height:1.25}
.minion.atk-sel .mn,.minion.atk-sel .ms{color:#aaa}
.minion .ms{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:20px;color:#222}

/* ── HERO PORTRAIT ── */
.hport{position:relative;flex-shrink:0;transition:filter .15s;border-radius:50%}
.hport.tgt{filter:drop-shadow(0 0 11px rgba(200,48,48,.8));cursor:pointer}
.hport.drop-hi{filter:drop-shadow(0 0 9px rgba(80,140,255,.7))!important}
.hport.drop-ready{filter:drop-shadow(0 0 18px rgba(255,148,42,.95))!important;animation:rdyPulse .48s ease-in-out infinite}

/* ── ANIMATIONS ── */
@keyframes pBlue{0%,100%{box-shadow:0 0 10px rgba(40,130,255,.26),0 2px 6px rgba(0,0,0,.4)}50%{box-shadow:0 0 28px rgba(40,130,255,.72),0 2px 6px rgba(0,0,0,.4)}}
@keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes flyIn{0%{transform:translateX(280px) scale(.15) rotate(18deg);opacity:0}55%{transform:translateX(-8px) scale(1.08) rotate(-1.5deg);opacity:1}100%{transform:translateX(0) scale(1) rotate(0);opacity:1}}
@keyframes lunge{0%{transform:translate(0,0) scale(1)}40%{transform:translate(var(--lx,0px),var(--ly,0px)) scale(1.15)}75%{transform:translate(calc(var(--lx,0px)*.12),calc(var(--ly,0px)*.12)) scale(1.04)}100%{transform:translate(0,0) scale(1)}}
@keyframes deathBurst{0%{transform:scale(1);opacity:1;filter:none}28%{transform:scale(1.6) rotate(10deg);opacity:.95;filter:brightness(3.5)}65%{transform:scale(.4) rotate(25deg);opacity:.4;filter:brightness(1.5)}100%{transform:scale(0) rotate(30deg);opacity:0}}
@keyframes minionIn{0%{transform:scale(0) translateY(-32px) rotate(-8deg);opacity:0}60%{transform:scale(1.12) translateY(3px);opacity:1}85%{transform:scale(.97) translateY(-1px)}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes dmgFloat{0%{transform:translateY(0) scale(1.2);opacity:1}55%{opacity:.85}100%{transform:translateY(-70px) scale(.7);opacity:0}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.88)}10%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
@keyframes slotIn{0%{width:0;opacity:0}100%{width:68px;opacity:1}}
@keyframes endPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 22px rgba(40,130,255,.68),0 0 8px rgba(40,130,255,.35)}}
@keyframes rdyPulse{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes marchDash{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
/* Marching arrow on SVG path */
.arrow-march{stroke-dasharray:14 10;animation:marchDash .55s linear infinite}

.card-fw{animation:floatCard 2.2s ease-in-out infinite;animation-delay:var(--fd,0s)}
/* flyIn plays first with forwards fill, then floatCard takes over — no transform conflict */
.card-fw.new-card{animation:flyIn .72s cubic-bezier(.2,1.2,.6,1) forwards, floatCard 2.2s ease-in-out infinite;animation-delay:0s,.72s}
.minion.lunging{animation:lunge .62s cubic-bezier(.25,0,.6,1) forwards!important;z-index:50}
.minion.dying{animation:deathBurst .68s ease-out forwards!important;pointer-events:none}
.minion.new-summon{animation:minionIn .58s cubic-bezier(.15,1.35,.6,1) both}
.hs{position:absolute;bottom:0;cursor:grab;user-select:none;-webkit-user-select:none}
.hs:active{cursor:grabbing}
.hs.src-ghost>.card-fw{opacity:.12;filter:grayscale(90%);pointer-events:none!important}

/* ── DRAG ── */
#drag-ghost{position:fixed;pointer-events:none;z-index:999;transform:translate(-50%,-65%) rotate(-6deg);opacity:.9}
#deck-ghost{position:fixed;pointer-events:none;z-index:800;transform:translate(-50%,-60%) rotate(-5deg);opacity:.9}
.board-slot-ghost{width:68px;height:88px;border:2px dashed rgba(50,140,255,.38);border-radius:6px;flex-shrink:0;background:rgba(50,130,255,.06);animation:slotIn .18s ease-out}

/* ── DROP HI (enemy minions + hero) ── */
.em.drop-hi .minion{outline:2px solid rgba(80,140,255,.45);outline-offset:2px;box-shadow:0 0 8px rgba(80,140,255,.28)!important}
/* READY: orange glow – same treatment for minion and hero */
.em.drop-ready .minion{
  border:2px solid rgba(255,148,42,.95)!important;
  box-shadow:0 0 20px rgba(255,148,42,.7),0 0 6px rgba(255,148,42,.4) inset!important;
  animation:rdyPulse .48s ease-in-out infinite;
  outline:none;
}

/* ── LAYOUT ── */
.topbar,.botbar{flex-shrink:0;padding:5px 14px;display:flex;align-items:center;gap:10px;background:#0d0d0d}
.topbar{border-bottom:1px solid #111}
.botbar{border-top:1px solid #111}
/* AI section mirrors player section */
.ai-hand-wrap{flex-shrink:0;height:108px;display:flex;justify-content:center;align-items:flex-start;padding-top:6px;background:#090909;border-bottom:1px solid #1a1a1a;overflow:visible}
.hero-row{flex-shrink:0;height:82px;display:flex;align-items:center;justify-content:center;gap:14px;position:relative}
.hero-row.top{background:#0a0a0a;border-bottom:1px solid #1a1a1a}
.hero-row.bot{background:#0a0a0a;border-top:1px solid #1a1a1a}
.boards{flex:1;display:flex;flex-direction:column;min-height:0;background:#0c0c0c;position:relative}
.brow{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 8px;min-height:64px}
.center-div{height:1px;background:#181818;flex-shrink:0}
.hand-wrap{flex-shrink:0;height:114px;background:#090909;border-top:1px solid #1a1a1a;overflow:visible;display:flex;justify-content:center;align-items:flex-end;padding-bottom:2px}
/* Hint BELOW hand-wrap, as separate bar (not inside) */
.hand-hint-bar{flex-shrink:0;height:14px;background:#090909;display:flex;align-items:center;justify-content:center;border-top:1px solid #0f0f0f}
.hand-hint{font-size:8px;color:#252525;letter-spacing:2px;font-family:monospace}

/* ── LOG ── */
.gamelog-wrap{position:absolute;right:8px;top:4px;bottom:4px;width:148px;z-index:10}
.log-btn{width:100%;padding:4px 0;background:#0a0a0a;border:1px solid #1a1a1a;color:#555;font-size:9px;letter-spacing:2px;cursor:pointer;margin-bottom:3px}
.log-btn:hover{color:#888}
.gamelog{height:calc(100% - 26px);background:rgba(0,0,0,.78);border:1px solid #111;padding:6px;overflow-y:auto;font-family:monospace;font-size:9px;display:flex;flex-direction:column;gap:2px}
.gl{border-bottom:1px solid #0a0a0a;padding-bottom:2px;color:#3a3a3a}
.gl.lx{color:#686868}

/* ── TOAST ── */
#sc-toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(4,4,4,.96);border:1px solid rgba(255,255,255,.08);padding:8px 22px;border-radius:2px;font-size:13px;z-index:1000;pointer-events:none;letter-spacing:1px;white-space:nowrap;animation:toastIn 2.1s ease-out forwards}
#sc-toast.ok{color:#78e878;border-color:rgba(80,200,80,.3)}
#sc-toast.warn{color:#e8e4d8}
#sc-toast.err{color:#ff7060;border-color:rgba(255,70,60,.3)}
#sc-toast.ai{color:#bb99ff;border-color:rgba(140,80,255,.22)}
.float-dmg{position:fixed;pointer-events:none;z-index:600;font-family:Georgia,serif;font-weight:bold;text-shadow:0 1px 8px rgba(0,0,0,.9);animation:dmgFloat .96s ease-out forwards}
.end-hint{animation:endPulse 1.5s ease-in-out infinite}
/* invalid drag: red border + glow */
.card.invalid-drag{border:2px solid rgba(255,60,60,.9)!important;box-shadow:0 0 20px rgba(255,50,50,.65),0 0 6px rgba(255,50,50,.35) inset!important;animation:none!important}
.minion.invalid-drag{border:2px solid rgba(255,60,60,.9)!important;box-shadow:0 0 18px rgba(255,50,50,.62),0 0 5px rgba(255,50,50,.3) inset!important;animation:none!important}

/* ── ZOOM ── */
#zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;z-index:900;cursor:pointer}
#zoom-overlay .card{transform:scale(2.6);pointer-events:none}

/* ── DECK ── */
.dscreen{min-height:100vh;background:#070707;display:flex;flex-direction:column}
.dhead{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid #111;background:#0a0a0a;gap:14px}
.dbody{display:flex;flex:1;overflow:hidden}
.pool{flex:1;overflow-y:auto;padding:16px;background:#080808}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px}
.pc{position:relative;cursor:pointer;border-radius:6px;transition:transform .1s}
.pc:hover{transform:translateY(-2px)}
.pc.maxed{cursor:default}
.pc.maxed:hover{transform:none}
.dlist{width:195px;border-left:1px solid #111;padding:14px;overflow-y:auto;background:#090909}
.di{display:flex;align-items:center;margin-bottom:6px;gap:6px;cursor:grab;padding:4px 3px;border-radius:2px;user-select:none}
.di:hover{background:rgba(255,255,255,.03)}
.di:active{cursor:grabbing}

/* ── MENU ── */
.mbg{min-height:100vh;background:#070707;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.deco{position:absolute;inset:0;opacity:.04;pointer-events:none}
.go{position:absolute;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
</style>
</head>
<body><div id="root"></div>
<script>
// ── DATA ──────────────────────────────
const CARDS=[
  {id:"m01",name:"暗影精靈",cost:1,type:"minion",atk:1,hp:2,sym:"◈"},
  {id:"m02",name:"黑暗斥候",cost:2,type:"minion",atk:2,hp:2,sym:"◉"},
  {id:"m03",name:"虛空幻影",cost:2,type:"minion",atk:3,hp:1,sym:"◐"},
  {id:"m04",name:"骨弓射手",cost:3,type:"minion",atk:2,hp:3,sym:"◎"},
  {id:"m05",name:"符文劍客",cost:3,type:"minion",atk:3,hp:2,sym:"⬡"},
  {id:"m06",name:"虛空行者",cost:3,type:"minion",atk:2,hp:4,sym:"◆"},
  {id:"m07",name:"虛空騎士",cost:4,type:"minion",atk:3,hp:4,sym:"◇"},
  {id:"m08",name:"死亡守衛",cost:4,type:"minion",atk:2,hp:6,sym:"⬟"},
  {id:"m09",name:"石甲魔像",cost:5,type:"minion",atk:4,hp:5,sym:"⬠"},
  {id:"m10",name:"暗影法師",cost:5,type:"minion",atk:4,hp:4,sym:"◑"},
  {id:"m11",name:"死神使者",cost:6,type:"minion",atk:5,hp:4,sym:"◓"},
  {id:"m12",name:"黑暗元素",cost:6,type:"minion",atk:5,hp:6,sym:"◒"},
  {id:"m13",name:"暗影巨龍",cost:7,type:"minion",atk:6,hp:5,sym:"◭"},
  {id:"m14",name:"古代巨神",cost:8,type:"minion",atk:7,hp:8,sym:"◬"},
  {id:"s01",name:"暗影箭",  cost:1,type:"spell",effect:"dmg",  val:2,sym:"✦",desc:"造成2點傷害"},
  {id:"s02",name:"黑暗儀式",cost:2,type:"spell",effect:"draw", val:2,sym:"✧",desc:"抽2張牌"},
  {id:"s03",name:"黑暗護盾",cost:2,type:"spell",effect:"heal", val:8,sym:"✩",desc:"恢復8點生命"},
  {id:"s04",name:"虛空爆破",cost:3,type:"spell",effect:"dmg",  val:4,sym:"✪",desc:"造成4點傷害"},
  {id:"s05",name:"吸魂術",  cost:4,type:"spell",effect:"drain",val:5,sym:"✫",desc:"吸取5點生命"},
  {id:"s06",name:"混沌衝擊",cost:5,type:"spell",effect:"dmg",  val:7,sym:"✬",desc:"造成7點傷害"},
];
const getDef=id=>CARDS.find(c=>c.id===id);
const DEF_DECK=["m01","m01","s01","s01","m02","m02","m03","m03","s02","s03","m04","m04","s04","m05","m05","m07","m07","m08","s05","m06","m06","m09","m09","m10","m11","m12","s06","m13","m14","m14"];

// ── GAME LOGIC ─────────────────────────
let _u=0;const uid=()=>++_u;
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const mk=def=>({...def,uid:uid(),curHp:def.hp||0,sick:true,attacked:false});
const alog=(s,m)=>({...s,log:[m,...s.log.slice(0,29)]});
const chk=s=>{if(s.player.hp<=0&&s.ai.hp<=0)return{...s,over:"draw"};if(s.player.hp<=0)return{...s,over:"lose"};if(s.ai.hp<=0)return{...s,over:"win"};return s;};
const draw1=(s,who)=>{const p=s[who];if(!p.deck.length){return chk(alog({...s,[who]:{...p,hp:p.hp-5}},"💀"+(who==="player"?"你":"AI")+"牌庫空-5HP"));}const[d,...rest]=p.deck;if(p.hand.length>=10)return alog({...s,[who]:{...p,deck:rest}},d.name+"燒毀");return who==="player"?alog({...s,[who]:{...p,deck:rest,hand:[...p.hand,d]},lastDraw:d.uid},"🃏抽："+d.name):{...s,[who]:{...p,deck:rest,hand:[...p.hand,d]},aiNewCard:true};};
const startT=(s0,who)=>{const p=s0[who],nm=Math.min(10,p.maxMana+1);let s={...s0,[who]:{...p,maxMana:nm,mana:nm,board:p.board.map(m=>({...m,sick:false,attacked:false}))},turn:who,mode:"default",selCard:null,selAtk:null,lastDraw:null,aiNewCard:false};s=draw1(s,who);if(!s.over)s=alog(s,"━━"+(who==="player"?"你的回合":"電腦回合")+"━━");return s;};
const playM=(s0,hi,who)=>{const p=s0[who],c=p.hand[hi];if(!c||c.type!=="minion"||p.mana<c.cost||p.board.length>=7)return s0;const mn={...c,uid:uid(),curHp:c.hp,sick:true,attacked:false};return alog({...s0,[who]:{...p,mana:p.mana-c.cost,hand:p.hand.filter((_,i)=>i!==hi),board:[...p.board,mn]}},"⚔️"+(who==="player"?"你":"AI")+"召："+c.name);};
const castS=(s0,hi,who,tw,ti)=>{const p=s0[who],c=p.hand[hi];if(!c||c.type!=="spell"||p.mana<c.cost)return s0;let s={...s0,[who]:{...p,mana:p.mana-c.cost,hand:p.hand.filter((_,i)=>i!==hi)}};const{effect:ef,val:v}=c;if(ef==="dmg"){if(ti===-1){s={...s,[tw]:{...s[tw],hp:s[tw].hp-v}};s=alog(s,"✨"+c.name+"→英雄-"+v);}else{const h=s[tw].board[ti];s={...s,[tw]:{...s[tw],board:s[tw].board.map((m,i)=>i===ti?{...m,curHp:m.curHp-v}:m).filter(m=>m.curHp>0)}};s=alog(s,"✨"+c.name+"→"+h.name+"-"+v);}}else if(ef==="heal"){s={...s,[who]:{...s[who],hp:Math.min(50,s[who].hp+v)}};s=alog(s,"💚"+c.name+"+"+v);}else if(ef==="draw"){s=alog(s,"📚"+c.name+"抽"+v);for(let i=0;i<v;i++){s=draw1(s,who);if(s.over)break;}}else if(ef==="drain"){let d=v;if(ti===-1){s={...s,[tw]:{...s[tw],hp:s[tw].hp-v}};}else{d=Math.min(v,s[tw].board[ti].curHp);s={...s,[tw]:{...s[tw],board:s[tw].board.map((m,i)=>i===ti?{...m,curHp:m.curHp-v}:m).filter(m=>m.curHp>0)}};}s={...s,[who]:{...s[who],hp:Math.min(50,s[who].hp+d)}};s=alog(s,"🔮吸"+d);}return chk(s);};
const atkF=(s0,who,ai,tw,ti)=>{const a=s0[who].board[ai];if(!a||a.sick||a.attacked)return s0;if(ti===-1){let s={...s0,[who]:{...s0[who],board:s0[who].board.map((m,i)=>i===ai?{...m,attacked:true}:m)},[tw]:{...s0[tw],hp:s0[tw].hp-a.atk}};return chk(alog(s,"⚔️"+a.name+"→英雄-"+a.atk));}const d=s0[tw].board[ti];let s={...s0,[who]:{...s0[who],board:s0[who].board.map((m,i)=>i===ai?{...m,attacked:true,curHp:a.curHp-d.atk}:m).filter(m=>m.curHp>0)},[tw]:{...s0[tw],board:s0[tw].board.map((m,i)=>i===ti?{...m,curHp:d.curHp-a.atk}:m).filter(m=>m.curHp>0)}};return chk(alog(s,"⚔️"+a.name+"("+a.atk+")vs"+d.name+"("+d.atk+")"));};
const newGame=pdeck=>{const pd=shuf(pdeck).map(id=>mk(getDef(id))),ad=shuf(DEF_DECK).map(id=>mk(getDef(id)));const ph=pd.splice(0,2),ah=ad.splice(0,2);let s={player:{hp:50,mana:0,maxMana:0,deck:pd,hand:ph,board:[]},ai:{hp:50,mana:0,maxMana:0,deck:ad,hand:ah,board:[]},turn:"player",mode:"default",selCard:null,selAtk:null,log:["遊戲開始！你先手。"],over:null,lastDraw:null,aiNewCard:false};return startT(s,"player");};

// ── AI SCRIPT SYSTEM ─────────────────
function computeAiScript(s){
  const script=[];let sim={...s};
  let played=true;
  while(played&&!sim.over){
    played=false;const ai=sim.ai,opts=ai.hand.map((c,i)=>({c,i})).filter(({c})=>c.cost<=ai.mana);
    if(!opts.length)break;
    const mo=opts.filter(({c})=>c.type==="minion"&&ai.board.length<7).sort((a,b)=>b.c.cost-a.c.cost);
    const so=opts.filter(({c})=>c.type==="spell").sort((a,b)=>b.c.cost-a.c.cost);
    const pk=mo[0]||so[0];if(!pk)break;
    const sb=sim;let newSumUid=null,spellTarget=null;
    if(pk.c.type==="minion"){sim=playM(sim,pk.i,"ai");const added=sim.ai.board.find(m=>!sb.ai.board.find(b=>b.uid===m.uid));if(added)newSumUid=added.uid;}

function executeAiScript(script,idx,onDone){

  if(step.type==="play"){

          render();

        return;
      }
    }
    // non-minion or fallback
    GAME=step.sa;
    if(step.newSumUid){newSummonUid=step.newSumUid;setTimeout(()=>{newSummonUid=null;},500);}
    render();
    if(step.spellTarget){const{ti,val}=step.spellTarget;setTimeout(()=>{const el=ti===-1?document.getElementById("ph"):(document.querySelector(`.om[data-oi="${ti}"] .minion`)||document.querySelector(`.om[data-oi="${ti}"]`));if(el){const r=el.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,val);}},160);}

        if(atkDies&&atkEl)atkEl.classList.add("dying");if(defDies&&defEl)defEl.classList.add("dying");
      },()=>{GAME=step.sa;render();setTimeout(next,300);});
    },60);

  const maxB=Math.max(1,...costBuckets);
  const barColors=["#3a7acc","#3a7acc","#3a7acc","#3a7acc","#5a3a8a","#5a3a8a","#8a2a2a","#8a2a2a","#4a1a1a"];
  let chartBars="";

      <div style="font-size:7px;color:#444;font-family:monospace">${costBuckets[i]||""}</div>

  }
  const avgCost=tot>0?(deckEdit.reduce((s,id)=>s+(getDef(id)?.cost||0),0)/tot).toFixed(1):"—";
  const chart=`<div style="margin-top:10px;padding:8px 4px 4px;background:#0a0a0a;border:1px solid #151515;border-radius:3px">
    <div style="display:flex;gap:1px;align-items:flex-end">${chartBars}</div>
    <div style="text-align:center;margin-top:5px;font-size:8px;color:#383838;font-family:monospace;letter-spacing:1px">平均費用 <span style="color:#555">${avgCost}</span></div>
  </div>`;

  // Fix 5: deck list with separators between items
  let li=grp.map(({id,n,c})=>`<div class="di" data-id="${id}" style="border-bottom:1px solid #161616">
    <span style="color:#3a3a3a;font-family:monospace;font-size:10px;width:14px;flex-shrink:0">${c.cost}</span>
    <span style="color:#d0ccc0;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</span>
    <span style="color:#3a3a3a;font-family:monospace;font-size:10px">×${n}</span>
  </div>`).join("");
  if(!grp.length)li=`<div style="color:#222;font-size:11px;text-align:center;margin-top:50px">牌組為空</div>`;
  if(tot>0&&tot<30)li+=`<div style="margin-top:10px;font-size:10px;color:#444;text-align:center;letter-spacing:1px">還需 ${30-tot} 張</div>`;

  R().innerHTML=`<div class="dscreen"><div class="dhead">
    <button id="dbk" style="background:none;border:1px solid #222;color:#777;padding:6px 14px;font-size:11px">← 返回</button>
    <span style="font-size:16px;letter-spacing:4px;color:#ccc">我的卡牌</span>
    <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
      <span style="font-size:12px;font-family:monospace;color:${tot===30?"#7d7":"#666"}">${tot}/30</span>
      <button id="dsv" style="padding:7px 16px;background:${tot===30?"#ede9dc":"#111"};color:${tot===30?"#000":"#444"};border:none;font-size:11px;letter-spacing:2px">儲存牌組</button>
    </div>
  </div><div class="dbody">
    <div class="pool"><div style="font-size:9px;color:#3a3a3a;letter-spacing:3px;margin-bottom:12px">點擊加入 · 長按查看</div><div class="pgrid">${pi}</div></div>
    <div class="dlist" id="dlist">
      <div style="display:flex;align-items:center;margin-bottom:8px;gap:6px">
        <div style="font-size:9px;color:#3a3a3a;letter-spacing:2px;flex:1">當前牌組 <span style="color:#2a2a2a;font-size:8px">↩ 拖出移除</span></div>
        <button id="dclr" style="padding:3px 8px;background:none;border:1px solid #2a1a1a;color:#5a2a2a;font-size:9px;letter-spacing:1px;border-radius:2px">清空</button>
      </div>
      ${li}${chart}
    </div>
  </div></div>`;
  document.getElementById("dbk").onclick=()=>{SCR="menu";render();};
  document.getElementById("dsv").onclick=()=>{if(tot===30){DECK=[...deckEdit];SCR="menu";render();}};
  // Fix 2: clear all button
  document.getElementById("dclr").onclick=()=>{if(deckEdit.length===0)return;deckEdit=[];buildDeck();};
  // Pool card interactions
  document.querySelectorAll(".pc[data-id]").forEach(card=>{
    const id=card.dataset.id;let lpT=null,lpW=false;
    const startLP=()=>{lpW=false;lpT=setTimeout(()=>{lpT=null;lpW=true;showZoomCard(getDef(id));},500);};
    const endLP=()=>{if(lpT){clearTimeout(lpT);lpT=null;}};
    card.addEventListener("mousedown",(e)=>{if(e.button===0)startLP();});
    card.addEventListener("touchstart",startLP,{passive:true});
    card.addEventListener("mouseup",endLP);card.addEventListener("touchend",endLP);card.addEventListener("mouseleave",endLP);
    card.addEventListener("click",()=>{
      if(lpW){lpW=false;return;}
      if(cnt(id)>=2)return;
      if(tot>=30){toast("牌組已達30張上限！","err");return;}
      flyCardToDeck(card);
      setTimeout(()=>{deckEdit=[...deckEdit,id];buildDeck();},300);
    });
  });
  // Deck list drag to remove
  document.querySelectorAll(".di[data-id]").forEach(item=>{
    const id=item.dataset.id;
    const startDrag=(e)=>{
      e.preventDefault();
      const p=pt(e);deckDrag={active:true,id,ghost:null,sx:p.x,sy:p.y,moved:false};
      document.addEventListener("mousemove",deckDragMv,{passive:false});document.addEventListener("mouseup",deckDragUp);
      document.addEventListener("touchmove",deckDragMv,{passive:false});document.addEventListener("touchend",deckDragUp);
    };
    item.addEventListener("mousedown",startDrag);item.addEventListener("touchstart",startDrag,{passive:false});
  });
}

// ── DRAG SYSTEM ───────────────────────
function pt(e,ch){const s=(ch&&e.changedTouches)?e.changedTouches:e.touches;if(s&&s.length)return{x:s[0].clientX,y:s[0].clientY};return{x:e.clientX,y:e.clientY};}
function clearLP(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}}
function addDragListeners(){
  if(listenersAdded)return;listenersAdded=true;
  document.addEventListener("mousemove",onMove,{passive:false});document.addEventListener("mouseup",onUp);
  document.addEventListener("touchmove",onMove,{passive:false});document.addEventListener("touchend",onUp);
  document.addEventListener("mousedown",onDown);document.addEventListener("touchstart",onDown,{passive:false});
}
function onDown(e){
  if(SCR!=="battle"||!GAME||GAME.over||animLock)return;
  const hs=e.target.closest(".hs"),om=e.target.closest(".om");if(!hs&&!om)return;
  e.preventDefault();const p=pt(e);
  if(hs){if(GAME.turn!=="player")return;const idx=+hs.dataset.hi;drag={active:true,type:"hand",cardIdx:idx,boardIdx:-1,startX:p.x,startY:p.y,dragging:false,ghost:null,insertSlot:null,srcEl:hs,wasLP:false};lpTimer=setTimeout(()=>{lpTimer=null;if(!drag.dragging){drag.wasLP=true;showZoom(idx);}},500);}
  else{if(GAME.turn!=="player")return;drag={active:true,type:"board",cardIdx:-1,boardIdx:+om.dataset.oi,startX:p.x,startY:p.y,dragging:false,ghost:null,insertSlot:null,srcEl:null,wasLP:false};}
}
function onMove(e){
  if(!drag.active)return;e.preventDefault();const p=pt(e),ddx=p.x-drag.startX,ddy=p.y-drag.startY;
  if(!drag.dragging&&Math.sqrt(ddx*ddx+ddy*ddy)>10){
    clearLP();const g=GAME;if(!g)return;
    if(drag.type==="hand"){
      const card=g.player.hand[drag.cardIdx];if(!card)return;
      drag.dragging=true;
      const invalid=card.cost>g.player.mana||(card.type==="minion"&&g.player.board.length>=7);
      drag.invalid=invalid;
      if(drag.srcEl)drag.srcEl.classList.add("src-ghost");
      const ghost=document.createElement("div");ghost.id="drag-ghost";
      ghost.innerHTML=hCard(card,false,false,false,!invalid&&card.cost<=g.player.mana);
      document.body.appendChild(ghost);drag.ghost=ghost;
      // Red glow on ghost if invalid
      if(invalid){const gc=ghost.querySelector(".card");if(gc)gc.classList.add("invalid-drag");}
      if(!invalid&&card.type!=="minion"&&(card.effect==="dmg"||card.effect==="drain")){
        document.querySelectorAll(".em").forEach(el=>el.classList.add("drop-hi"));
        const ah=document.getElementById("ah");if(ah)ah.classList.add("drop-hi");
      }
    } else if(drag.type==="board"){
      const m=g.player.board[drag.boardIdx];
      const invalid=!m||m.sick||m.attacked;
      if(!m){drag.active=false;return;}
      drag.dragging=true;drag.invalid=invalid;
      const ghost=document.createElement("div");ghost.id="drag-ghost";
      ghost.style.cssText="position:fixed;pointer-events:none;z-index:999;transform:translate(-50%,-60%) rotate(-4deg);opacity:.9";
      ghost.innerHTML=hMinion(m,false,false,false);
      document.body.appendChild(ghost);drag.ghost=ghost;
      if(invalid){const gm=ghost.querySelector(".minion");if(gm)gm.classList.add("invalid-drag");}
      else{document.querySelectorAll(".em").forEach(el=>el.classList.add("drop-hi"));const ah=document.getElementById("ah");if(ah)ah.classList.add("drop-hi");}
    }
  }
  if(!drag.dragging)return;if(drag.ghost){drag.ghost.style.left=p.x+"px";drag.ghost.style.top=p.y+"px";}
  const card=drag.type==="hand"?(GAME&&GAME.player.hand[drag.cardIdx]):null;
  if(drag.type==="hand"&&card&&card.type==="minion"){const slot=getSlot(p.x);if(slot!==drag.insertSlot){drag.insertSlot=slot;updateSlots(slot);}}
  else updateProxArrow(p.x,p.y);
}
function onUp(e){
  if(!drag.active)return;clearLP();
  const{type,dragging:wd,cardIdx:sc,boardIdx:sb,insertSlot:ss,wasLP,srcEl,invalid}=drag;
  const zOpen=!!document.getElementById("zoom-overlay");
  if(srcEl)srcEl.classList.remove("src-ghost");
  if(drag.ghost){drag.ghost.remove();drag.ghost=null;}
  clearDropHi();hideArrow();updateSlots(null);hideZoom();
  const p=pt(e,true);drag={active:false,type:"none",cardIdx:-1,boardIdx:-1,startX:0,startY:0,dragging:false,ghost:null,insertSlot:null,srcEl:null,wasLP:false,invalid:false};
  if(type==="hand"){
    const card=GAME&&GAME.player.hand[sc];
    if(!wd&&!zOpen&&!wasLP){if(card&&card.cost>GAME.player.mana){toast("魔力不足！","err");}else act({t:"HC",i:sc});}
    else if(wd){
      if(invalid||card&&card.cost>GAME.player.mana){toast("魔力不足！","err");return;}
      if(card&&card.type==="minion"&&GAME.player.board.length>=7){toast("戰場已滿！","err");return;}
      if(card&&card.type!=="minion"){const cl=closestTarget(p.x,p.y);if(cl&&cl.dist<READY*1.4){const em=cl.el.closest(".em"),isH=cl.el.id==="ah";if(em){GAME={...GAME,selCard:sc,mode:"targeting"};act({t:"EM",i:+em.dataset.ei});return;}if(isH){GAME={...GAME,selCard:sc,mode:"targeting"};act({t:"EH"});return;}}}
      const el=document.elementFromPoint(p.x,p.y);if(el)handDrop(sc,ss,el);
    }
  }else if(type==="board"){
    if(!wd){act({t:"OM",i:sb});}
    else{
      if(invalid){
        // Show specific reason for invalid board drag
        const m=GAME&&GAME.player.board[sb];
        if(m&&m.sick)toast("此隨從下回合才能攻擊","err");
        else if(m&&m.attacked)toast("此隨從本回合已行動","warn");
        return;
      }
      const cl=closestTarget(p.x,p.y);if(cl&&cl.dist<READY*1.4){const em=cl.el.closest(".em"),isH=cl.el.id==="ah";if(em){act({t:"BOARD_ATK",bi:sb,tw:"ai",ti:+em.dataset.ei});return;}if(isH){act({t:"BOARD_ATK",bi:sb,tw:"ai",ti:-1});return;}}
      const el=document.elementFromPoint(p.x,p.y);if(el){const em=el.closest(".em"),ah=el.closest("#ah");if(em)act({t:"BOARD_ATK",bi:sb,tw:"ai",ti:+em.dataset.ei});else if(ah)act({t:"BOARD_ATK",bi:sb,tw:"ai",ti:-1});}
    }
  }
}
function clearDropHi(){document.querySelectorAll(".drop-hi,.drop-ready").forEach(e=>e.classList.remove("drop-hi","drop-ready"));}
function getSlot(cx){const pb=document.getElementById("pb");if(!pb||!GAME)return 0;const oms=Array.from(pb.querySelectorAll(".om"));let slot=oms.length;for(let i=0;i<oms.length;i++){const r=oms[i].getBoundingClientRect();if(cx<r.left+r.width/2){slot=i;break;}}return slot;}
function updateSlots(ins){
  const pb=document.getElementById("pb");if(!pb||!GAME)return;const pl=GAME.player;let h="";
  if(!pl.board.length){h=ins!=null?`<div class="board-slot-ghost"></div>`:`<div style="color:#181818;font-size:10px;letter-spacing:3px">YOUR FIELD</div>`;}
  else{for(let i=0;i<=pl.board.length;i++){if(ins===i)h+=`<div class="board-slot-ghost"></div>`;if(i<pl.board.length){const m=pl.board[i];h+=`<div class="om" data-oi="${i}">${hMinion(m,GAME.selAtk===i,false,m.uid===newSummonUid)}</div>`;}}}
  pb.innerHTML=h;
}

// ── PROXIMITY ARROW ───────────────────
const PROX=140,READY=78;
function updateProxArrow(fx,fy){
  const ts=[];
  if(drag.type==="hand"){const card=GAME&&GAME.player.hand[drag.cardIdx];if(!card||card.type==="minion")return;}
  document.querySelectorAll(".em").forEach(em=>{const r=em.getBoundingClientRect();ts.push({el:em,x:r.left+r.width/2,y:r.top+r.height/2});});
  const ah=document.getElementById("ah");if(ah){const r=ah.getBoundingClientRect();ts.push({el:ah,x:r.left+r.width/2,y:r.top+r.height/2});}
  document.querySelectorAll(".drop-ready").forEach(e=>e.classList.remove("drop-ready"));
  // Fix 4: only ONE closest target arrow
  ts.forEach(t=>{t.dist=Math.sqrt((t.x-fx)**2+(t.y-fy)**2);});
  const best=ts.filter(t=>t.dist<PROX).sort((a,b)=>a.dist-b.dist)[0];
  if(!best){hideArrow();return;}
  if(!arrowEl){arrowEl=document.createElement("div");arrowEl.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:997";document.body.appendChild(arrowEl);}
  const{x:tx,y:ty,dist}=best,rdy=dist<READY;
  if(rdy)best.el.classList.add("drop-ready");
  const col=rdy?"rgba(255,168,48,1)":"rgba(195,78,14,.92)";
  const colFade=rdy?"rgba(255,148,38,.28)":"rgba(145,55,8,.2)";
  // Slightly curved path
  const cx=(fx+tx)/2-((ty-fy)*.14),cy=(fy+ty)/2+((tx-fx)*.14);
  // Fix 5: thicker stroke (6px), smaller proportional arrowhead (8x6), marching-dash animation
  const gid="garw";
  arrowEl.innerHTML=`<svg width="100%" height="100%" overflow="visible" style="position:absolute;inset:0">
    <defs>
      <linearGradient id="${gid}" x1="${fx}" y1="${fy}" x2="${tx}" y2="${ty}" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="${colFade}"/>
        <stop offset="100%" stop-color="${col}"/>
      </linearGradient>
      <marker id="arh" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0,8 3,0 6" fill="${col}"/>
      </marker>
    </defs>
    <path class="arrow-march" d="M${fx},${fy} Q${cx},${cy} ${tx},${ty}"
      stroke="url(#${gid})" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#arh)"/>
    ${rdy?`<circle cx="${tx}" cy="${ty}" r="24" fill="rgba(255,148,38,.1)" stroke="${col}" stroke-width="1.6"/>`:""}
  </svg>`;
}
function hideArrow(){document.querySelectorAll(".drop-ready").forEach(e=>e.classList.remove("drop-ready"));if(arrowEl){arrowEl.remove();arrowEl=null;}}
function closestTarget(fx,fy){const ts=[];document.querySelectorAll(".em").forEach(em=>{const r=em.getBoundingClientRect();ts.push({el:em,x:r.left+r.width/2,y:r.top+r.height/2});});const ah=document.getElementById("ah");if(ah){const r=ah.getBoundingClientRect();ts.push({el:ah,x:r.left+r.width/2,y:r.top+r.height/2});}let best=null,md=Infinity;ts.forEach(t=>{const d=Math.sqrt((t.x-fx)**2+(t.y-fy)**2);if(d<md){md=d;best={...t,dist:d};}});return best;}
function handDrop(ci,ins,el){if(!GAME||GAME.turn!=="player")return;const card=GAME.player.hand[ci];if(!card||card.cost>GAME.player.mana)return;if(card.type==="minion"){if(el.closest("#pb")||el.closest(".board-slot-ghost"))act({t:"HC_AT",i:ci,slot:ins!=null?ins:GAME.player.board.length});}else if(card.effect==="heal"||card.effect==="draw"){act({t:"HC",i:ci});}else{const em=el.closest(".em"),ah=el.closest("#ah");if(em){GAME={...GAME,selCard:ci,mode:"targeting"};act({t:"EM",i:+em.dataset.ei});}else if(ah){GAME={...GAME,selCard:ci,mode:"targeting"};act({t:"EH"});}}}

// ── PLAYER ATTACK ANIMATION ───────────
function doPlayerAtk(bi,tw,ti){
  if(!GAME||animLock)return;const g=GAME,atk=g.player.board[bi];if(!atk)return;
  const ns={...atkF(g,"player",bi,tw,ti),selAtk:null,mode:"default"};
  const def=ti!==-1?g.ai.board[ti]:null,defDmg=atk.atk,atkDmg=def?def.atk:0;
  const defDies=ti!==-1?!ns.ai.board.find(m=>m.uid===(def&&def.uid)):false,atkDies=!ns.player.board.find(m=>m.uid===atk.uid);
  const atkEl=document.querySelector(`.om[data-oi="${bi}"] .minion`);
  const defEl=ti===-1?document.getElementById("ah"):(document.querySelector(`.em[data-ei="${ti}"] .minion`)||document.querySelector(`.em[data-ei="${ti}"]`));
  animLock=true;
  lungeAtk(atkEl,defEl,()=>{
    if(defEl){const r=defEl.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,defDmg);}
    if(atkEl&&atkDmg>0){const r=atkEl.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,atkDmg);}
    if(defDies&&defEl)defEl.classList.add("dying");if(atkDies&&atkEl)atkEl.classList.add("dying");
  },()=>{animLock=false;GAME=ns;render();});
}

// ── DISPATCH ──────────────────────────
function act(a){
  if(!GAME||GAME.over||GAME.turn!=="player"||animLock)return;const g=GAME;
  if(a.t==="HC"){
    const c=g.player.hand[a.i];if(!c)return;if(c.cost>g.player.mana){toast("魔力不足！","err");return;}
    if(c.type==="minion"){if(g.player.board.length>=7){toast("戰場已滿！","err");return;}const mn={...c,uid:uid(),curHp:c.hp,sick:true,attacked:false};const nb=[...g.player.board,mn];GAME={...alog({...g,player:{...g.player,mana:g.player.mana-c.cost,hand:g.player.hand.filter((_,i)=>i!==a.i),board:nb}},`⚔️你召：${c.name}`),selCard:null,selAtk:null,mode:"default"};newSummonUid=mn.uid;setTimeout(()=>{newSummonUid=null;},500);}
    else if(c.effect==="heal"||c.effect==="draw"){GAME={...castS(g,a.i,"player","player",-1),selCard:null,selAtk:null,mode:"default"};}
    else{GAME=g.selCard===a.i?{...g,selCard:null,mode:"default"}:{...g,selCard:a.i,mode:"targeting",selAtk:null};}
  }else if(a.t==="OM"){
    if(g.mode==="targeting"){GAME={...g,selCard:null,mode:"default"};}
    else{const m=g.player.board[a.i];if(!m)return;if(m.sick){toast("召喚後本回合不能攻擊","warn");return;}if(m.attacked){toast("此隨從本回合已行動","warn");return;}GAME=g.selAtk===a.i?{...g,selAtk:null,mode:"default"}:{...g,selAtk:a.i,mode:"attacking",selCard:null};}
  }else if(a.t==="EM"){
    if(g.mode==="targeting"&&g.selCard!=null){const card=g.player.hand[g.selCard];const ns={...castS(g,g.selCard,"player","ai",a.i),selCard:null,selAtk:null,mode:"default"};if(card&&(card.effect==="dmg"||card.effect==="drain")){const t=document.querySelector(`.em[data-ei="${a.i}"] .minion`)||document.querySelector(`.em[data-ei="${a.i}"]`);if(t){const r=t.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,card.val);}}GAME=ns;}
    else if(g.mode==="attacking"&&g.selAtk!=null){doPlayerAtk(g.selAtk,"ai",a.i);return;}
  }else if(a.t==="EH"){
    if(g.mode==="targeting"&&g.selCard!=null){const card=g.player.hand[g.selCard];const ns={...castS(g,g.selCard,"player","ai",-1),selCard:null,selAtk:null,mode:"default"};if(card&&(card.effect==="dmg"||card.effect==="drain")){const ah=document.getElementById("ah");if(ah){const r=ah.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,card.val);}}GAME=ns;}
    else if(g.mode==="attacking"&&g.selAtk!=null){doPlayerAtk(g.selAtk,"ai",-1);return;}
  }else if(a.t==="HC_AT"){
    const c=g.player.hand[a.i];if(!c)return;if(c.cost>g.player.mana){toast("魔力不足！","err");return;}if(c.type!=="minion")return;if(g.player.board.length>=7){toast("戰場已滿！","err");return;}
    const slot=Math.min(Math.max(0,a.slot??g.player.board.length),g.player.board.length);const mn={...c,uid:uid(),curHp:c.hp,sick:true,attacked:false};const board=[...g.player.board];board.splice(slot,0,mn);
    GAME={...alog({...g,player:{...g.player,mana:g.player.mana-c.cost,hand:g.player.hand.filter((_,i)=>i!==a.i),board}},`⚔️你召：${c.name}`),selCard:null,selAtk:null,mode:"default"};
    newSummonUid=mn.uid;setTimeout(()=>{newSummonUid=null;},500);
  }else if(a.t==="BOARD_ATK"){
    const m=g.player.board[a.bi];if(m&&m.sick){toast("召喚後本回合不能攻擊","warn");return;}if(m&&m.attacked){toast("此隨從本回合已行動","warn");return;}doPlayerAtk(a.bi,a.tw,a.ti);return;
  }else if(a.t==="CL"){GAME={...g,selCard:null,selAtk:null,mode:"default"};
  }else if(a.t==="ET"){toast("對方回合","ai");GAME=startT({...g,selCard:null,selAtk:null,mode:"default"},"ai");}
  render();
}

// ── ROUTER ────────────────────────────
const R=()=>document.getElementById("root");
let _lastTurn=null;
function render(){
  if(SCR==="menu")showMenu();
  else if(SCR==="deck")showDeck();
  else if(SCR==="battle"&&GAME)showBattle();
  if(GAME&&!GAME.over&&GAME.turn==="player"&&_lastTurn!=="player"){setTimeout(()=>toast("你的回合！","ok"),90);}
  _lastTurn=GAME?.turn??null;
  if(GAME&&(GAME.lastDraw||GAME.aiNewCard)){setTimeout(()=>{if(GAME)GAME={...GAME,lastDraw:null,aiNewCard:false};},580);}
}
try{render();}catch(e){R().innerHTML=`<div style="color:#f66;padding:30px;font-family:monospace;background:#111;min-height:100vh"><b>ERROR:</b><br><br>${e.stack.replace(/\n/g,"<br>")}</div>`;}
</script>
</body>
