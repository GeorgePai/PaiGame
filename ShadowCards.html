<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Shadow Cards</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:#070707;color:#e8e4d8;font-family:Georgia,serif;overflow:hidden;height:100vh;touch-action:none}
#root{width:100vw;height:100vh;display:flex;flex-direction:column}
button{font-family:Georgia,serif;cursor:pointer;position:relative;transition:transform .08s,box-shadow .08s,filter .08s;box-shadow:0 3px 0 rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.4);border-radius:3px}
button:active{transform:translateY(2px)!important;box-shadow:0 1px 0 rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.3)!important;filter:brightness(.88)}

/* ── CARD ── */
.card{width:82px;height:112px;background:#f4f0e8;border:1px solid #222;border-radius:6px;position:relative;overflow:hidden;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.55)}
.card.sm{width:68px;height:94px}
.card.sel{border:2px solid #ffd700!important;box-shadow:0 0 18px rgba(255,215,0,.75)!important}
.card.playable{border:1px solid rgba(30,120,255,.6)!important;box-shadow:0 0 28px rgba(0,100,255,.9),0 0 10px rgba(30,120,255,.75),0 0 4px rgba(80,160,255,.5)!important;animation:pBlue 1.8s ease-in-out infinite}
.card.faded{opacity:.22;filter:grayscale(70%);pointer-events:none}
.cname{position:absolute;top:26px;left:2px;right:2px;text-align:center;font-size:8px;color:#111;font-weight:bold;line-height:1.1}
.card.sm .cname{top:17px;font-size:7px}
.csym{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:24px;color:#1a1a1a}
.card.sm .csym{font-size:18px}
.cdesc{position:absolute;bottom:6px;left:2px;right:2px;text-align:center;font-size:6.5px;color:#555;line-height:1.3}

/* ── CARD BACK ── */
.cardback{width:68px;height:94px;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* ── MINION ── */
.minion{width:68px;height:88px;background:#f4f0e8;border:1px solid #444;border-radius:6px;position:relative;cursor:pointer;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.minion.can{border:1px solid rgba(30,120,255,.55)!important;box-shadow:0 0 26px rgba(0,100,255,.88),0 0 9px rgba(30,120,255,.7),0 0 3px rgba(80,160,255,.45)!important;animation:pBlue 1.8s ease-in-out infinite}
.minion.atk-sel{background:#1a1a1a;border:2px solid #ffd700!important;box-shadow:0 0 16px rgba(255,215,0,.65)!important;animation:none!important}
.minion.glow{border:2px dashed #c83030!important;box-shadow:0 0 10px rgba(200,50,50,.4)!important}
.minion.sick{opacity:.62}
.minion.lunging{animation:lunge .62s cubic-bezier(.25,0,.6,1) forwards!important;z-index:500!important;isolation:isolate;position:relative}
.minion.dying{animation:deathBurst 1.8s linear forwards!important;pointer-events:none}
.minion.new-summon{animation:minionIn .58s cubic-bezier(.15,1.35,.6,1) both}
.minion .mn{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:7px;font-weight:bold;color:#111;padding:0 3px;line-height:1.1}
.minion.atk-sel .mn,.minion.atk-sel .ms{color:#aaa}
.minion .ms{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:20px;color:#222}

/* ── HERO PORTRAIT ── */
.hport{position:relative;flex-shrink:0;transition:filter .15s;border-radius:50%}
.hport.tgt{filter:drop-shadow(0 0 11px rgba(200,48,48,.8));cursor:pointer}
.hport.drop-hi,.hp-bar-row.drop-hi{filter:drop-shadow(0 0 9px rgba(80,140,255,.7))!important}
.hport.drop-ready,.hp-bar-row.drop-ready{filter:drop-shadow(0 0 18px rgba(255,148,42,.95))!important;animation:rdyPulse .48s ease-in-out infinite}

/* ── ANIMATIONS ── */
@keyframes pBlue{0%,100%{box-shadow:0 0 8px rgba(20,100,210,.22),0 2px 6px rgba(0,0,0,.4)}50%{box-shadow:0 0 18px rgba(20,100,210,.6),0 2px 6px rgba(0,0,0,.4)}}
@keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes flyIn{0%{transform:translateX(320px) scale(.12) rotate(20deg);opacity:0}60%{transform:translateX(-6px) scale(1.06) rotate(-1deg);opacity:1}100%{transform:translateX(0) scale(1) rotate(0);opacity:1}}
@keyframes hpFlash{0%{filter:brightness(1)}30%{filter:brightness(2.5) saturate(1.4)}100%{filter:brightness(1)}}
@keyframes hpShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-5px)}36%{transform:translateX(5px)}54%{transform:translateX(-4px)}72%{transform:translateX(3px)}88%{transform:translateX(-2px)}}
@keyframes lunge{0%{transform:translate(0,0) scale(1)}40%{transform:translate(var(--lx,0px),var(--ly,0px)) scale(1.15)}75%{transform:translate(calc(var(--lx,0px)*.12),calc(var(--ly,0px)*.12)) scale(1.04)}100%{transform:translate(0,0) scale(1)}}
@keyframes deathBurst{
  0%  {transform:translateX(0);opacity:1}
  7%  {transform:translateX(-4px);opacity:1}
  14% {transform:translateX(4px);opacity:1}
  20% {transform:translateX(-4px);opacity:1}
  26% {transform:translateX(3px);opacity:1}
  31% {transform:translateX(-3px);opacity:1}
  36% {transform:translateX(3px);opacity:1}
  40% {transform:translateX(-2px);opacity:1}
  44% {transform:translateX(2px);opacity:1}
  47% {transform:translateX(-2px);opacity:1}
  50% {transform:translateX(2px);opacity:1}
  52% {transform:translateX(-1px);opacity:1}
  54% {transform:translateX(0);opacity:1}
  58% {opacity:.85}
  68% {opacity:.6}
  80% {opacity:.32}
  92% {opacity:.1}
  100%{opacity:0}
}
@keyframes minionIn{0%{transform:scale(0) translateY(-32px) rotate(-8deg);opacity:0}60%{transform:scale(1.12) translateY(3px);opacity:1}85%{transform:scale(.97) translateY(-1px)}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes dmgFloat{0%{transform:translateY(0) scale(1.2);opacity:1}55%{opacity:.85}100%{transform:translateY(-70px) scale(.7);opacity:0}}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.88)}10%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}
@keyframes slotIn{0%{width:0;opacity:0}100%{width:68px;opacity:1}}
@keyframes endPulse{0%,100%{box-shadow:none}50%{box-shadow:0 0 28px rgba(160,60,255,.85),0 0 12px rgba(180,80,255,.5),0 0 4px rgba(220,140,255,.3)}}
@keyframes rdyPulse{0%,100%{opacity:.78}50%{opacity:1}}
@keyframes marchDash{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
/* Marching arrow on SVG path */
.arrow-march{stroke-dasharray:14 10;animation:marchDash .55s linear infinite}

.card-fw{animation:floatCard 2.2s ease-in-out infinite;animation-delay:var(--fd,0s)}
/* flyIn with staggered delay --dd for sequential draw animation */
.card-fw.new-card{animation:flyIn .95s cubic-bezier(.15,1.1,.5,1) forwards, floatCard 2.2s ease-in-out infinite;animation-delay:var(--dd,0s),calc(var(--dd,0s) + .95s)}
.minion.lunging{animation:lunge .62s cubic-bezier(.25,0,.6,1) forwards!important;z-index:500!important;isolation:isolate;position:relative}
.minion.dying{animation:deathBurst 1.8s linear forwards!important;pointer-events:none}
.minion.new-summon{animation:minionIn .58s cubic-bezier(.15,1.35,.6,1) both}
/* Draw: existing cards slide smoothly when hand size changes */
.hs{position:absolute;bottom:0;cursor:grab;user-select:none;-webkit-user-select:none;transition:left .28s cubic-bezier(.3,1,.5,1),transform .15s}
.hs:active{cursor:grabbing}
.hs.src-ghost>.card-fw{opacity:.12;filter:grayscale(90%);pointer-events:none!important}
.hs.draw-pending{visibility:hidden;pointer-events:none}
/* flyIn keyframe no longer used on .card-fw — we use JS ghost instead */

/* ── DRAG ── */
#drag-ghost{position:fixed;pointer-events:none;z-index:999;transform:translate(-50%,-65%) rotate(-6deg);opacity:.9}
#deck-ghost{position:fixed;pointer-events:none;z-index:800;transform:translate(-50%,-60%) rotate(-5deg);opacity:.9}
.board-slot-ghost{width:68px;height:88px;border:2px dashed rgba(50,140,255,.38);border-radius:6px;flex-shrink:0;background:rgba(50,130,255,.06);animation:slotIn .18s ease-out}

/* ── DROP HI (enemy minions + hero) ── */
.em,.om{position:relative}
.em.lunging-parent,.om.lunging-parent{z-index:200;isolation:isolate}
/* READY: orange glow – same treatment for minion and hero */
.em.drop-ready .minion{
  border:2px solid rgba(255,148,42,.95)!important;
  box-shadow:0 0 20px rgba(255,148,42,.7),0 0 6px rgba(255,148,42,.4) inset!important;
  animation:rdyPulse .48s ease-in-out infinite;
  outline:none;
}

/* ── LAYOUT ── */
.topbar,.botbar{flex-shrink:0;padding:5px 14px;display:flex;align-items:center;gap:10px;background:#0d0d0d}
.topbar{border-bottom:1px solid #111}
.botbar{border-top:1px solid #111}
/* ── HERO HP BAR ── */
.hp-bar-row{flex-shrink:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;position:relative}
.hp-bar-row.top{background:#0a0a0a;border-bottom:1px solid #1a1a1a}
.hp-bar-row.bot{background:#0a0a0a;border-top:1px solid #1a1a1a;border-bottom:3px solid #050505}
.hp-bar-track{flex:1;height:12px;background:linear-gradient(180deg,#0a0a0a 0%,#1a1a1a 40%,#111 100%);border-radius:6px;overflow:hidden;position:relative;border:1px solid #000;box-shadow:0 2px 6px rgba(0,0,0,.8) inset,0 1px 0 rgba(255,255,255,.06)}
.hp-bar-lag{position:absolute;left:0;top:0;height:100%;background:linear-gradient(180deg,rgba(255,190,60,.9) 0%,rgba(210,120,10,.85) 50%,rgba(160,80,0,.7) 100%);border-radius:4px;box-shadow:0 0 6px rgba(255,150,20,.4) inset}
.hp-bar-fill{position:absolute;left:0;top:0;height:100%;border-radius:4px;transition:width .55s cubic-bezier(.25,.8,.25,1);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 -1px 0 rgba(0,0,0,.35) inset}
.hp-bar-fill.hit{animation:hpFlash .5s ease-out}
.hp-bar-row.shake{animation:hpShake .45s ease-out}
.ai-hand-wrap{flex-shrink:0;height:108px;display:flex;justify-content:center;align-items:flex-start;padding-top:6px;background:#090909;border-bottom:1px solid #1a1a1a;overflow:visible}
.boards{flex:1;display:flex;flex-direction:column;min-height:0;background:#0c0c0c;position:relative;overflow:visible;z-index:1}
.brow{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 8px;min-height:64px;overflow:visible;position:relative}
.center-div{height:1px;background:#181818;flex-shrink:0;position:relative;z-index:0}
.hand-wrap{flex-shrink:0;height:114px;background:#090909;border-top:1px solid #1a1a1a;overflow:visible;display:flex;justify-content:center;align-items:flex-end;padding-bottom:2px}
/* Hint BELOW hand-wrap, as separate bar (not inside) */
.hand-hint-bar{flex-shrink:0;height:14px;background:#090909;display:flex;align-items:center;justify-content:center;border-top:1px solid #0f0f0f}
.hand-hint{font-size:8px;color:#b8a830;letter-spacing:2px;font-family:monospace}

/* ── LOG ── */
.gamelog-wrap{position:absolute;right:8px;top:4px;bottom:4px;width:148px;z-index:10}
.log-btn{width:100%;padding:4px 0;background:#0a0a0a;border:1px solid #1a1a1a;color:#555;font-size:9px;letter-spacing:2px;cursor:pointer;margin-bottom:3px}
.log-btn:hover{color:#888}
.gamelog{height:calc(100% - 26px);background:rgba(0,0,0,.78);border:1px solid #111;padding:6px;overflow-y:auto;font-family:monospace;font-size:9px;display:flex;flex-direction:column;gap:2px}
.gl{border-bottom:1px solid #0a0a0a;padding-bottom:2px;color:#3a3a3a}
.gl.lx{color:#686868}

/* ── TOAST: battlefield center, safe margins ── */
#sc-toast{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);background:rgba(4,4,4,.96);border:1px solid rgba(255,255,255,.08);padding:7px 18px;border-radius:2px;font-size:13px;z-index:1000;pointer-events:none;letter-spacing:1px;white-space:nowrap;animation:toastIn 2.1s ease-out forwards;max-width:calc(100vw - 32px);box-sizing:border-box}
#sc-toast.ok{color:#78e878;border-color:rgba(80,200,80,.3)}
#sc-toast.warn{color:#e8e4d8}
#sc-toast.err{color:#ff7060;border-color:rgba(255,70,60,.3)}
#sc-toast.ai{color:#bb99ff;border-color:rgba(140,80,255,.22)}
.float-dmg{position:fixed;pointer-events:none;z-index:600;font-family:Georgia,serif;font-weight:bold;text-shadow:0 1px 8px rgba(0,0,0,.9);animation:dmgFloat .96s ease-out forwards}
.end-hint{animation:endPulse 1.5s ease-in-out infinite}
/* invalid drag: red border + glow */
.card.invalid-drag{border:2px solid rgba(255,60,60,.9)!important;box-shadow:0 0 20px rgba(255,50,50,.65),0 0 6px rgba(255,50,50,.35) inset!important;animation:none!important}
.minion.invalid-drag{border:2px solid rgba(255,60,60,.9)!important;box-shadow:0 0 18px rgba(255,50,50,.62),0 0 5px rgba(255,50,50,.3) inset!important;animation:none!important}

/* ── ZOOM ── */
#zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;z-index:900;cursor:pointer}
#zoom-overlay .card{pointer-events:none;animation:zoomFloat 2.2s ease-in-out infinite}
@keyframes zoomFloat{0%,100%{transform:scale(2.6) translateY(0)}50%{transform:scale(2.6) translateY(-8px)}}

/* ── DECK ── */
.dscreen{min-height:100vh;background:#070707;display:flex;flex-direction:column}
.dhead{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid #111;background:#0a0a0a;gap:14px}
.dbody{display:flex;flex:1;overflow:hidden}
.pool{flex:1;overflow-y:auto;padding:16px;background:#080808}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:12px}
.pc{position:relative;cursor:pointer;border-radius:6px;transition:transform .1s}
.pc:hover{transform:translateY(-2px)}
.pc.maxed{cursor:default}
.pc.maxed:hover{transform:none}
.dlist{width:195px;border-left:1px solid #111;background:#090909;display:flex;flex-direction:column;overflow:hidden}
.dlist-head{padding:14px 14px 0;flex-shrink:0;border-bottom:1px solid #2a2a1a}
.dlist-body{flex:1;overflow-y:auto;padding:0 14px 14px}
.di{display:flex;align-items:center;margin-bottom:6px;gap:6px;cursor:grab;padding:4px 3px;border-radius:2px;user-select:none}
.di:hover{background:rgba(255,255,255,.03)}
.di:active{cursor:grabbing}

/* ── MENU ── */
.mbg{min-height:100vh;background:#070707;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.deco{position:absolute;inset:0;opacity:.04;pointer-events:none}
.go{position:absolute;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
/* ── MOBILE COMPACT (short/narrow screens) ── */
@media (max-height: 760px) {
  .topbar,.botbar{padding:3px 10px;gap:6px}
  .ai-hand-wrap{height:72px;padding-top:2px}
  .hand-wrap{height:96px}
  .hand-hint-bar{display:none}
}
@media (max-height: 680px) {
  .ai-hand-wrap{height:58px}
  .hand-wrap{height:86px}
  .brow{padding:2px 6px;gap:4px}
}
/* prevent board minions overflowing on narrow screens */
.brow{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body><div id="root"></div>
<script>
// ══════════════════════════════════════════════════════
// ██████╗ SHADOW CARDS AUDIO ENGINE
// ══════════════════════════════════════════════════════
const Audio={
  ctx:null,masterGain:null,bgmGain:null,sfxGain:null,
  bgmPlaying:false,bgmNodes:[],_nextBeat:0,_schedAhead:.12,_schedInterval:null,
  _beatLen:.0,_seq:[],_seqIdx:0,_started:false,

  init(){
    if(this.ctx)return;
    this.ctx=new(window.AudioContext||window.webkitAudioContext)();
    this.masterGain=this.ctx.createGain();this.masterGain.gain.value=.7;
    this.bgmGain=this.ctx.createGain();this.bgmGain.gain.value=.28;
    this.sfxGain=this.ctx.createGain();this.sfxGain.gain.value=.85;
    this.bgmGain.connect(this.masterGain);
    this.sfxGain.connect(this.masterGain);
    this.masterGain.connect(this.ctx.destination);
  },

  // ── Utility ──────────────────────────────────────────
  _osc(type,freq,start,dur,vol=.5,dest=null){
    const g=dest||this.sfxGain;
    const o=this.ctx.createOscillator();
    const a=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,start);
    a.gain.setValueAtTime(0,start);
    a.gain.linearRampToValueAtTime(vol,start+.004);
    a.gain.exponentialRampToValueAtTime(.0001,start+dur);
    o.connect(a);a.connect(g);
    o.start(start);o.stop(start+dur+.01);
    return o;
  },
  _noise(start,dur,vol=.3,lpFreq=800,hpFreq=200){
    const len=Math.ceil(this.ctx.sampleRate*dur)+100;
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=this.ctx.createBufferSource();src.buffer=buf;
    const lp=this.ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=lpFreq;
    const hp=this.ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=hpFreq;
    const a=this.ctx.createGain();
    a.gain.setValueAtTime(vol,start);
    a.gain.exponentialRampToValueAtTime(.0001,start+dur);
    src.connect(hp);hp.connect(lp);lp.connect(a);a.connect(this.sfxGain);
    src.start(start);src.stop(start+dur+.02);
  },
  _rev(src,mix=.25){
    // Simple convolution reverb approximation with delay
    const d=this.ctx.createDelay(.08);d.delayTime.value=.06;
    const g=this.ctx.createGain();g.gain.value=mix;
    src.connect(d);d.connect(g);g.connect(this.sfxGain);
  },

  // ══ SOUND EFFECTS ════════════════════════════════════
  sfxClick(){
    if(!this.ctx)return;const t=this.ctx.currentTime;
    this._osc("sine",1200,t,.04,.18);
    this._osc("sine",800,t+.02,.03,.1);
  },
  sfxCardFlip(){
    // Paper rustle: burst of filtered noise + high transient
    if(!this.ctx)return;const t=this.ctx.currentTime;
    this._noise(t,.055,.45,3200,600);
    this._noise(t+.02,.04,.28,5000,2000);
    this._osc("triangle",2400,t,.015,.12);
  },
  sfxCardDraw(){
    // Swoosh + soft paper land
    if(!this.ctx)return;const t=this.ctx.currentTime;
    this._noise(t,.09,.35,1200,80);
    const o=this.ctx.createOscillator();const a=this.ctx.createGain();
    o.type="sine";o.frequency.setValueAtTime(600,t);
    o.frequency.exponentialRampToValueAtTime(200,t+.1);
    a.gain.setValueAtTime(.25,t);a.gain.exponentialRampToValueAtTime(.001,t+.12);
    o.connect(a);a.connect(this.sfxGain);o.start(t);o.stop(t+.14);
    this._noise(t+.08,.04,.3,800,200);
  },
  sfxCardAddDeck(){
    // Light wooden thud + paper slip
    if(!this.ctx)return;const t=this.ctx.currentTime;
    this._osc("sine",180,t,.08,.35);
    this._osc("triangle",320,t,.05,.2);
    this._noise(t,.03,.4,1600,400);
  },
  sfxMinionSummon(){
    // Rising pop + sparkle
    if(!this.ctx)return;const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator();const a=this.ctx.createGain();
    o.type="sawtooth";
    o.frequency.setValueAtTime(120,t);
    o.frequency.exponentialRampToValueAtTime(480,t+.12);
    a.gain.setValueAtTime(.3,t);a.gain.exponentialRampToValueAtTime(.001,t+.22);
    const f=this.ctx.createBiquadFilter();f.type="bandpass";f.frequency.value=800;f.Q.value=2;
    o.connect(f);f.connect(a);a.connect(this.sfxGain);o.start(t);o.stop(t+.25);
    [0,.04,.08].forEach((d,i)=>this._osc("sine",[1200,1600,2000][i],t+d,.08,.12));
  },
  sfxMinionAttack(){
    // Impact thud + crack
    if(!this.ctx)return;const t=this.ctx.currentTime;
    this._osc("sawtooth",80,t,.12,.55);
    this._osc("square",160,t,.05,.4);
    this._noise(t,.06,.5,2500,300);
    this._osc("sine",400,t+.03,.04,.3);
  },
  sfxSpellCast(){
    // Magical shimmer: rising sweep + sparkles
    if(!this.ctx)return;const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator();const a=this.ctx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(300,t);
    o.frequency.exponentialRampToValueAtTime(1200,t+.3);
    a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(.4,t+.05);
    a.gain.exponentialRampToValueAtTime(.001,t+.38);

    render();

  }else if(step.type==="atk"){

    GAME=step.sb;render();

      });
    },80);
  }
}

// Play death animation on a body-fixed clone so render() doesn't kill it mid-animation
function playDeathAnim(el){
  if(!el)return;
  Audio.sfxMinionDeath();
  const r=el.getBoundingClientRect();
  const clone=el.cloneNode(true);
  clone.className="minion";
  clone.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;pointer-events:none;z-index:8000;`;
  clone.querySelectorAll("*").forEach(c=>{c.style.animation="none";c.style.transition="none";});
  document.body.appendChild(clone);
  el.style.opacity="0";el.style.pointerEvents="none";

  const shakeDur=480, fadeDur=1500;
  const start=performance.now();
  function tick(now){
    const t=now-start;
    if(t<shakeDur){
      // Smooth sine-wave shake: amplitude decays as shake progresses
      const progress=t/shakeDur;
      const decay=1-progress; // amplitude shrinks to 0
      const freq=18; // oscillations per second
      const amp=5*decay;
      const x=amp*Math.sin(freq*progress*Math.PI*2);
      clone.style.transform=`translateX(${x.toFixed(2)}px)`;
      requestAnimationFrame(tick);
    }else{
      // Shake done — fade out with rAF
      clone.style.transform="translateX(0)";
      const fadeStart=now;
      function fade(fn){
        const ft=fn-fadeStart;
        const op=Math.max(0,1-ft/fadeDur);
        clone.style.opacity=op;
        if(op>0)requestAnimationFrame(fade);
        else clone.remove();
      }
      requestAnimationFrame(fade);
    }
  }
  requestAnimationFrame(tick);
}

// Detect minions killed by spell and trigger death animations before render
// Returns true if any deaths occurred (caller should delay render by 1800ms)
function spellDeathAnims(prevState, nextState){
  let anyDied=false;
  if(prevState.ai&&nextState.ai){
    prevState.ai.board.forEach((m,i)=>{
      if(!nextState.ai.board.find(n=>n.uid===m.uid)){
        const el=document.querySelector(`.em[data-ei="${i}"] .minion`)||document.querySelector(`.em[data-ei="${i}"]`);
        if(el){playDeathAnim(el);anyDied=true;}
      }
    });
  }
  if(prevState.player&&nextState.player){
    prevState.player.board.forEach((m,i)=>{
      if(!nextState.player.board.find(n=>n.uid===m.uid)){
        const el=document.querySelector(`.om[data-oi="${i}"] .minion`)||document.querySelector(`.om[data-oi="${i}"]`);
        if(el){playDeathAnim(el);anyDied=true;}
      }
    });
  }
  return anyDied;
}

function lungeAtk(atkEl,defEl,onImpact,onDone){
  if(!atkEl||!defEl){onImpact();setTimeout(onDone,0);return;}
  Audio.sfxMinionAttack();
  const ar=atkEl.getBoundingClientRect(),dr=defEl.getBoundingClientRect();
  const dx=((dr.left+dr.width/2)-(ar.left+ar.width/2))*.78;
  const dy=((dr.top+dr.height/2)-(ar.top+ar.height/2))*.78;

  // Clone the minion and attach to body as fixed — bypasses ALL z-index/stacking issues
  const clone=atkEl.cloneNode(true);
  clone.style.cssText=`position:fixed;left:${ar.left}px;top:${ar.top}px;width:${ar.width}px;height:${ar.height}px;pointer-events:none;z-index:9000;transition:transform .22s cubic-bezier(.25,0,.4,1),opacity .08s .2s`;
  document.body.appendChild(clone);

  // Hide original
  atkEl.style.opacity="0";

  // Kick off lunge forward
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    clone.style.transform=`translate(${dx}px,${dy}px) scale(1.05)`;
  }));

  setTimeout(()=>{
    // Impact — show damage, play recoil
    onImpact();
    clone.style.transition="transform .32s cubic-bezier(.2,1.2,.5,1)";
    clone.style.transform="translate(0,0) scale(1)";
    setTimeout(()=>{
      clone.remove();
      // Only restore opacity if NOT being handled by playDeathAnim
      // playDeathAnim sets pointerEvents:none as a marker
      if(atkEl.style.pointerEvents!=="none")atkEl.style.opacity="";
      onDone();
    },340);
  },240);
}

// Hexagon with highlight top-face and shadow bottom-face
const svgHex=(v,fill,w,h,fs)=>{
  const pts=`${w/2},0 ${w},${h*.27} ${w},${h*.73} ${w/2},${h} 0,${h*.73} 0,${h*.27}`;
  const hi=`${w/2},0 ${w},${h*.27} ${w*.62},${h*.42} ${w*.38},${h*.42}`;

  return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;top:2px;left:2px;overflow:visible"><polygon points="${pts}" fill="${fill}"/><polygon points="${hi}" fill="rgba(255,255,255,.26)"/><polygon points="${sh}" fill="rgba(0,0,0,.2)"/><polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width=".7"/><text x="${w/2}" y="${h*.5}" dominant-baseline="central" text-anchor="middle" fill="#e8f4ff" font-size="${fs}" font-family="monospace" font-weight="bold">${v}</text></svg>`;};

const svgTri=(v,fill,w,h,fs)=>{
  const hi=`${w/2},1 ${w-1},${h-1} ${w/2},${h*.62}`;
  return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;bottom:2px;left:2px;overflow:visible"><polygon points="${w/2},1 ${w-1},${h-1} 1,${h-1}" fill="${fill}"/><polygon points="${hi}" fill="rgba(255,255,255,.2)"/><line x1="${w/2}" y1="1" x2="1" y2="${h-1}" stroke="rgba(255,255,255,.14)" stroke-width=".7"/><text x="${w/2}" y="${h*.68}" dominant-baseline="central" text-anchor="middle" fill="#fff" font-size="${fs}" font-family="monospace" font-weight="bold">${v}</text></svg>`;};
// Teardrop with highlight edge
const svgDrop=(v,fill,tf,w,h,fs)=>{const cy=h*.56,r=w/2-1;
  return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;bottom:2px;right:2px;overflow:visible"><path d="M${w/2},1 Q${w-1},${h*.28} ${w-1},${cy} A${r},${r} 0 0,1 1,${cy} Q1,${h*.28} ${w/2},1 Z" fill="${fill}"/><path d="M${w/2},1 Q${w-1},${h*.28} ${w*.72},${cy*.52}" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.1" stroke-linecap="round"/><text x="${w/2}" y="${cy}" dominant-baseline="central" text-anchor="middle" fill="${tf}" font-size="${fs}" font-family="monospace" font-weight="bold">${v}</text></svg>`;};

  const n=hand.length,ds=Math.min(n*4.5,36),step=n>1?ds/(n-1):0,cw=82,ov=n>7?18:n>5?26:36,tw=cw+(n-1)*ov;
  let sl="";hand.forEach((c,i)=>{const ang=n>1?(i-(n-1)/2)*step:0,isSel=selIdx===i,cp=c.cost<=mana;
    const isPending=(lastDraws||[]).includes(c.uid);
    const fd=floatDelay(i).toFixed(3);
    sl+=`<div class="hs${isPending?" draw-pending":""}" data-hi="${i}" data-uid="${c.uid}" style="left:${i*ov}px;transform-origin:bottom center;transform:rotate(${ang}deg) translateY(${isSel?-24:0}px);z-index:${isSel?60:i}"><div class="card-fw" style="--fd:-${fd}s">${hCard(c,isSel,false,false,cp&&!isSel)}</div></div>`;});
  return`<div style="position:relative;width:${tw}px;height:120px">${sl}</div>`;};
const hAIFan=(n,aiNew)=>{if(!n)return"";
  const ds=Math.min(n*4.5,36),step=n>1?ds/(n-1):0,ov=n>7?18:n>5?22:30,tw=68+(n-1)*ov,pad=40;
  let sl="";for(let i=0;i<n;i++){const ang=n>1?(i-(n-1)/2)*step:0,isNew=aiNew&&i===n-1,fd=floatDelay(i+20).toFixed(3);
    sl+=`<div style="position:absolute;left:${i*ov+pad}px;top:0;transform-origin:top center;transform:rotate(${ang}deg);z-index:${i}"><div class="card-fw${isNew?" new-card":""}" style="--fd:-${fd}s">${hBack()}</div></div>`;}
  return`<div style="position:relative;width:${tw+pad*2}px;height:78px">${sl}</div>`;};

// ── DECK DRAG (list→pool to remove) ──────────────────────
function deckDragMv(e){
  if(!deckDrag.active)return;e.preventDefault?.();
  const p=pt(e);
  if(!deckDrag.moved&&Math.hypot(p.x-deckDrag.sx,p.y-deckDrag.sy)>8){
    deckDrag.moved=true;
    const g=document.createElement("div");g.id="deck-ghost";
    g.innerHTML=hCard(getDef(deckDrag.id),false,false,true,false);
    document.body.appendChild(g);deckDrag.ghost=g;
  }
  if(deckDrag.ghost){const p2=pt(e);deckDrag.ghost.style.left=p2.x+"px";deckDrag.ghost.style.top=p2.y+"px";}
}
function deckDragUp(e){
  if(!deckDrag.active)return;
  const p=pt(e,true);
  if(deckDrag.ghost){deckDrag.ghost.remove();deckDrag.ghost=null;}
  const{moved,id}=deckDrag;
  deckDrag={active:false,id:null,ghost:null,sx:0,sy:0,moved:false};
  document.removeEventListener("mousemove",deckDragMv);document.removeEventListener("mouseup",deckDragUp);
  document.removeEventListener("touchmove",deckDragMv);document.removeEventListener("touchend",deckDragUp);
  if(moved){
    const pool=document.querySelector(".pool");
    if(pool){const r=pool.getBoundingClientRect();if(p.x>=r.left&&p.x<=r.right&&p.y>=r.top&&p.y<=r.bottom){const idx=deckEdit.lastIndexOf(id);if(idx>=0){deckEdit=deckEdit.filter((_,i)=>i!==idx);buildDeck();}}}
  }
}

// Update lag bars after render — if HP dropped, delay lag bar to create trailing effect
function updateLagBars(){
  if(!GAME)return;
  ['player','ai'].forEach(who=>{
    const id=who==="player"?"ph":"ah";
    const curHp=GAME[who].hp;
    const fillEl=document.getElementById("fill-"+id);
    const lagEl=document.getElementById("lag-"+id);
    if(!fillEl)return;

    if(lagHp[who]>curHp){
      const oldPct=Math.max(0,lagHp[who]/50*100);
      const newPct=Math.max(0,curHp/50*100);
      // Snap red bar to old, then animate to new
      fillEl.style.transition="none";
      fillEl.style.width=oldPct+"%";
      void fillEl.offsetWidth;
      fillEl.style.transition="width .6s cubic-bezier(.25,.8,.25,1)";
      fillEl.style.width=newPct+"%";
      // Lag bar: hold then catch up
      if(lagEl){
        lagEl.style.transition="none";
        lagEl.style.width=oldPct+"%";
        void lagEl.offsetWidth;
        setTimeout(()=>{
          const l=document.getElementById("lag-"+id);
          if(l){l.style.transition="width 1.2s cubic-bezier(.1,.5,.3,1)";l.style.width=newPct+"%";}
        },420);
      }
      // Shake in sync with bar animation (not delayed)
      shakeHpBar(who);
      lagHp[who]=curHp;
    }else if(lagHp[who]!==curHp){
      const newPct=Math.max(0,curHp/50*100);
      fillEl.style.transition="width .4s ease-out";
      fillEl.style.width=newPct+"%";
      if(lagEl){lagEl.style.transition="none";lagEl.style.width=newPct+"%";}
      lagHp[who]=curHp;
    }
  });
}
function showDeck(){deckEdit=[...DECK];buildDeck();}
function buildDeck(){

  const grp=[...deckEdit].sort((a,b)=>getDef(a).cost-getDef(b).cost).reduce((acc,id)=>{const l=acc[acc.length-1];if(l&&l.id===id)l.n++;else acc.push({id,n:1,c:getDef(id)});return acc;},[]);

  let pi="";CARDS.forEach(c=>{

      :n===1?`<div style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,.82);border-radius:3px;padding:1px 5px;font-size:10px;color:#44aaff;font-family:monospace;font-weight:bold;pointer-events:none">×1</div>`:""
    pi+=`<div class="pc${maxed?" maxed":""}" data-id="${c.id}" title="${c.name}" style="position:relative;display:inline-block">${hCard(c,false,false,true,false)}${badge}</div>`;
  });

  // Inline hex gem (no position:absolute)
  const hexGem=(v,sz=14)=>{
    const w=sz,h=Math.round(sz*1.15);
    const pts=`${w/2},0 ${w},${h*.27} ${w},${h*.73} ${w/2},${h} 0,${h*.73} 0,${h*.27}`;
    const hi=`${w/2},0 ${w},${h*.27} ${w*.62},${h*.42} ${w*.38},${h*.42}`;
    const sh=`${w*.38},${h*.58} ${w*.62},${h*.58} ${w},${h*.73} ${w/2},${h} 0,${h*.73}`;
    const fs=Math.round(sz*.48);
    const lbl=v==="8+"?"8+":String(v);
    return`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="overflow:visible;display:block"><polygon points="${pts}" fill="#7c3aed"/><polygon points="${hi}" fill="rgba(255,255,255,.26)"/><polygon points="${sh}" fill="rgba(0,0,0,.2)"/><polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width=".7"/><text x="${w/2}" y="${h*.5}" dominant-baseline="central" text-anchor="middle" fill="#e8f4ff" font-size="${fs}" font-family="monospace" font-weight="bold">${lbl}</text></svg>`;
  };

  const costBuckets=Array(9).fill(0);
  deckEdit.forEach(id=>{const c=getDef(id);if(c)costBuckets[Math.min(8,c.cost)]++;});
  const maxB=Math.max(1,...costBuckets);
  const barColors=["#3a7acc","#3a7acc","#3a7acc","#3a7acc","#5a3a8a","#5a3a8a","#8a2a2a","#8a2a2a","#4a1a1a"];
  // Fix 2: store target heights; render bars at height:0 first, animate via rAF after DOM insert
  const targetHeights=[];
  let chartBars="";
  for(let i=1;i<=8;i++){
    const th=Math.round((costBuckets[i]/maxB)*36);
    targetHeights.push({h:th,hasCards:costBuckets[i]>0});
    const lbl=i===8?"8+":i;
    chartBars+=`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1">
      <div style="font-size:7px;color:#a89030;font-family:monospace;min-height:10px">${costBuckets[i]||""}</div>
      <div style="width:100%;background:#0e0e0e;border-radius:1px;height:36px;display:flex;align-items:flex-end">
        <div class="cbar" style="width:100%;height:0px;background:${barColors[i]};border-radius:1px 1px 0 0;transition:height .38s cubic-bezier(.2,1,.4,1)"></div>
      </div>
      <div style="display:flex;justify-content:center;margin-top:2px">${hexGem(lbl,13)}</div>
    </div>`;
  }
  const avgCost=tot>0?(deckEdit.reduce((s,id)=>s+(getDef(id)?.cost||0),0)/tot).toFixed(1):"—";
  const chart=`<div style="margin-top:10px;padding:8px 4px 4px;background:#0a0a0a;border:1px solid #151515;border-radius:3px">
    <div style="display:flex;gap:1px;align-items:flex-end">${chartBars}</div>
    <div style="text-align:center;margin-top:7px;font-size:8px;color:#a89030;font-family:monospace;letter-spacing:1px">平均費用 <span style="color:#d4c840">${avgCost}</span></div>
  </div>`;

  let li=grp.map(({id,n,c})=>`<div class="di" data-id="${id}" style="border-bottom:1px solid #161616">
    <div style="flex-shrink:0;width:16px;display:flex;align-items:center;justify-content:center">${hexGem(c.cost,14)}</div>
    <span style="color:${c.type==="spell"?"#58d878":"#e8e4d0"};font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:4px">${c.name}</span>
    <span style="color:#a89030;font-family:monospace;font-size:10px">×${n}</span>
  </div>`).join("");
  if(!grp.length)li=`<div style="color:#666;font-size:11px;text-align:center;margin-top:50px">牌組為空</div>`;
  if(tot>0&&tot<30)li+=`<div style="margin-top:10px;font-size:10px;color:#d4c840;text-align:center;letter-spacing:1px">還需 ${30-tot} 張</div>`;

  R().innerHTML=`<div class="dscreen"><div class="dhead">
    <button id="dbk" style="background:none;border:1px solid #222;color:#777;padding:6px 14px;font-size:11px">← 返回</button>
    <span style="font-size:16px;letter-spacing:4px;color:#ccc">我的卡牌</span>
    <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
      <span style="font-size:12px;font-family:monospace;color:${tot===30?"#7d7":"#d4c840"}">${tot}/30</span>
      <button id="dsv" style="padding:7px 16px;background:${tot===30?"#ede9dc":"#111"};color:${tot===30?"#000":"#444"};border:none;font-size:11px;letter-spacing:2px">儲存牌組</button>
    </div>
  </div><div class="dbody">
    <div class="pool"><div style="font-size:9px;color:#d4c840;letter-spacing:2px;margin-bottom:12px">卡牌庫 ← 點擊加入牌組 · 長按查看</div><div class="pgrid">${pi}</div></div>
    <div class="dlist" id="dlist">
      <div class="dlist-head">
        <div style="display:flex;align-items:center;margin-bottom:6px;gap:6px">
          <div style="font-size:9px;color:#d4c840;letter-spacing:2px;flex:1">當前牌組 <span style="color:#a89830;font-size:8px">← 橫滑移除 · 長按查看</span></div>
          <button id="dclr" style="padding:3px 8px;background:none;border:1px solid #2a1a1a;color:#c06040;font-size:9px;letter-spacing:1px;border-radius:2px">清空</button>
        </div>
        ${chart}
      </div>
      <div class="dlist-body"><div style="margin-top:8px">${li}</div></div>
    </div>
  </div></div>`;

  // Fix 3: restore pool scroll after DOM rebuild
  const poolEl=document.querySelector(".pool");
  if(poolEl)poolEl.scrollTop=savedScroll;

  // Selective bar animation: only animate changed bars, others stay put
  const prev=_prevBarH;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const bars=document.querySelectorAll(".cbar");
    bars.forEach((bar,idx)=>{
      const newH=targetHeights[idx]?.h??0;
      const oldH=prev?prev[idx]:0;
      if(oldH===newH){
        // No change — snap to correct height, no transition
        bar.style.transition="none";
        bar.style.height=newH+"px";
      }else{
        // Changed — animate smoothly
        bar.style.transition="none";
        bar.style.height=oldH+"px";
        // Force layout then animate
        bar.offsetHeight; // eslint-disable-line
        bar.style.transition="height .42s cubic-bezier(.2,1,.4,1)";
        bar.style.height=newH+"px";
      }
    });
  }));
  _prevBarH=targetHeights.map(t=>t?.h??0);

  document.getElementById("dbk").onclick=()=>{_prevBarH=null;Audio.sfxClick();SCR="menu";render();};
  document.getElementById("dsv").onclick=()=>{if(tot===30){Audio.sfxClick();DECK=[...deckEdit];SCR="menu";render();}};
  document.getElementById("dclr").onclick=()=>{if(deckEdit.length===0)return;Audio.sfxClick();deckEdit=[];buildDeck();};

  // Pool card interactions
  document.querySelectorAll(".pc[data-id]").forEach(card=>{
    const id=card.dataset.id;let lpT=null,lpW=false;
    const startLP=()=>{
      lpW=false;
      lpT=setTimeout(()=>{
        lpT=null;lpW=true;
        showZoomCard(getDef(id));
        // Zoom overlay now covers the card — listen on document for the release
        document.addEventListener("mouseup",hideZoom,{once:true});
        document.addEventListener("touchend",hideZoom,{once:true});
      },500);
    };
    const cancelLP=()=>{if(lpT){clearTimeout(lpT);lpT=null;}};
    card.addEventListener("mousedown",(e)=>{if(e.button===0)startLP();});
    card.addEventListener("touchstart",startLP,{passive:true});
    card.addEventListener("mouseup",cancelLP);
    card.addEventListener("touchend",cancelLP);
    card.addEventListener("mouseleave",cancelLP);
    card.addEventListener("click",()=>{
      if(lpW){lpW=false;return;}
      if(cnt(id)>=2)return;
      if(tot>=30){toast("牌組已達30張上限！","err");return;}
      Audio.sfxCardAddDeck();
      flyCardToDeck(card);

    });
  });

  // Deck list: long-press zoom + scroll-safe horizontal drag to remove
  document.querySelectorAll(".di[data-id]").forEach(item=>{
    const id=item.dataset.id;
    let diLpT=null,diLpW=false;
    const diStartLP=()=>{diLpW=false;diLpT=setTimeout(()=>{
      diLpT=null;diLpW=true;
      showZoomCard(getDef(id));
      document.addEventListener("mouseup",hideZoom,{once:true});
      document.addEventListener("touchend",hideZoom,{once:true});
    },500);};
    const diCancelLP=()=>{if(diLpT){clearTimeout(diLpT);diLpT=null;}};
    const diReleaseLP=()=>{diCancelLP();hideZoom();};
    // Mouse: long-press detection + drag
    item.addEventListener("mousedown",(e)=>{
      diStartLP();
      const p=pt(e);
      deckDrag={active:true,id,ghost:null,sx:p.x,sy:p.y,moved:false};
      document.addEventListener("mousemove",deckDragMv,{passive:false});
      document.addEventListener("mouseup",deckDragUp);
      document.addEventListener("mouseup",diReleaseLP,{once:true});
    });
    item.addEventListener("mouseleave",diCancelLP);
    // Touch: long-press + direction-aware drag
    item.addEventListener("touchstart",(e)=>{
      diStartLP();
      const p=pt(e);
      item._tStart={x:p.x,y:p.y,id,decided:false};
    },{passive:true});
    item.addEventListener("touchmove",(e)=>{
      const ts=item._tStart;if(!ts||ts.decided)return;
      const p=pt(e);
      const dx=Math.abs(p.x-ts.x),dy=Math.abs(p.y-ts.y);
      if(dx<6&&dy<6)return;
      ts.decided=true;
      diCancelLP(); // cancel long-press on any move
      if(dy>dx){item._tStart=null;}
      else{
        e.preventDefault();
        deckDrag={active:true,id:ts.id,ghost:null,sx:ts.x,sy:ts.y,moved:false};
        item._tStart=null;
        document.addEventListener("touchmove",deckDragMv,{passive:false});
        document.addEventListener("touchend",deckDragUp);
      }
    },{passive:false});
    item.addEventListener("touchend",()=>{item._tStart=null;diReleaseLP();});
  });
}

// ── DRAG SYSTEM ───────────────────────
function pt(e,ch){const s=(ch&&e.changedTouches)?e.changedTouches:e.touches;if(s&&s.length)return{x:s[0].clientX,y:s[0].clientY};return{x:e.clientX,y:e.clientY};}
function clearLP(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}}
function addDragListeners(){
  if(listenersAdded)return;listenersAdded=true;
  document.addEventListener("mousemove",onMove,{passive:false});document.addEventListener("mouseup",onUp);
  document.addEventListener("touchmove",onMove,{passive:false});document.addEventListener("touchend",onUp);
  document.addEventListener("mousedown",onDown);document.addEventListener("touchstart",onDown,{passive:false});
}
function onDown(e){
  if(SCR!=="battle"||!GAME||GAME.over||animLock)return;
  const hs=e.target.closest(".hs"),om=e.target.closest(".om"),em=e.target.closest(".em");
  if(!hs&&!om&&!em)return;
  e.preventDefault();const p=pt(e);
  if(hs){
    if(GAME.turn!=="player")return;
    // Use each card's layout left offset (no rotation effect) + fan container position
    // to find which card strip contains the touch. Reliable across all rotations.
    const hw=document.querySelector(".hand-wrap");
    let idx=+hs.dataset.hi; // fallback
    if(hw){
      const allHs=Array.from(hw.querySelectorAll(".hs"));
      const fanContainer=allHs[0]?.parentElement;
      if(fanContainer){
        const fanLeft=fanContainer.getBoundingClientRect().left;
        let bestIdx=0;
        for(const hsEl of allHs){
          const leftOffset=parseFloat(hsEl.style.left)||0;
          if(p.x>=fanLeft+leftOffset) bestIdx=+hsEl.dataset.hi;
        }
        idx=bestIdx;
      }
    }
    const srcEl=hw?hw.querySelectorAll(".hs")[idx]:hs;
    drag={active:true,type:"hand",cardIdx:idx,boardIdx:-1,startX:p.x,startY:p.y,dragging:false,ghost:null,insertSlot:null,srcEl:srcEl||hs,wasLP:false};
    lpTimer=setTimeout(()=>{lpTimer=null;if(!drag.dragging){drag.wasLP=true;showZoom(idx);}},500);
  } else if(om){
    if(GAME.turn!=="player")return;
    const bi=+om.dataset.oi;
    drag={active:true,type:"board",cardIdx:-1,boardIdx:bi,startX:p.x,startY:p.y,dragging:false,ghost:null,insertSlot:null,srcEl:null,wasLP:false};
    // Fix 8: long-press player board card → zoom
    lpTimer=setTimeout(()=>{lpTimer=null;if(!drag.dragging){drag.wasLP=true;const m=GAME.player.board[bi];if(m)showZoomMinion(m);}},500);
  } else if(em){
    // Fix 8: long-press enemy board card → zoom (no drag)
    const bi=+em.dataset.ei;
    lpTimer=setTimeout(()=>{lpTimer=null;const m=GAME.ai.board[bi];if(m)showZoomMinion(m);},500);
  }
}
function onMove(e){
  if(!drag.active)return;e.preventDefault();const p=pt(e),ddx=p.x-drag.startX,ddy=p.y-drag.startY;
  const dist=Math.sqrt(ddx*ddx+ddy*ddy);
  // Fix 1: minion needs 50px drag distance, spells need 22px, board attacks need 10px
  const dragCard=drag.type==="hand"?(GAME&&GAME.player.hand[drag.cardIdx]):null;
  const threshold=drag.type==="board"?10:dragCard&&dragCard.type!=="minion"?22:50;
  // Fix 1: use smaller threshold when zoom is showing (20px feels natural for swipe)
  const swipeThreshold=drag.wasLP?20:threshold;
  if(!drag.dragging&&dist>swipeThreshold){
    if(drag.wasLP){
      const adx=Math.abs(p.x-drag.startX),ady=Math.abs(p.y-drag.startY);
      if(adx>ady){
        // Horizontal swipe → find which hand card the finger is currently over
        const hand=GAME&&GAME.player.hand;
        if(hand&&hand.length>1){
          const hw=document.querySelector(".hand-wrap");
          if(hw){
            const allHs=Array.from(hw.querySelectorAll(".hs"));
            // Find the card whose left-edge strip contains the finger x
            let hoverIdx=zoomCardIdx;
            let bestIdx=0;
            for(const hsEl of allHs){
              const leftOffset=parseFloat(hsEl.style.left)||0;
              const fanLeft=hsEl.parentElement?.getBoundingClientRect().left||0;
              if(p.x>=fanLeft+leftOffset) bestIdx=+hsEl.dataset.hi;
            }
            hoverIdx=bestIdx;
            if(hoverIdx!==zoomCardIdx)showZoom(hoverIdx);
          }
        }
        return;
      } else {
        // Vertical (upward) → close zoom and start drag normally
        hideZoom();
        drag.wasLP=false;
        // fall through to normal drag start below
      }
    }
    clearLP();const g=GAME;if(!g)return;
    if(drag.type==="hand"){
      const card=g.player.hand[drag.cardIdx];if(!card)return;
      drag.dragging=true;
      const invalid=card.cost>g.player.mana||(card.type==="minion"&&g.player.board.length>=7);
      drag.invalid=invalid;
      if(drag.srcEl)drag.srcEl.classList.add("src-ghost");
      const ghost=document.createElement("div");ghost.id="drag-ghost";
      ghost.innerHTML=hCard(card,false,false,false,!invalid&&card.cost<=g.player.mana);
      document.body.appendChild(ghost);drag.ghost=ghost;
      // Red glow on ghost if invalid
      if(invalid){const gc=ghost.querySelector(".card");if(gc)gc.classList.add("invalid-drag");}
      if(!invalid&&card.type!=="minion"&&(card.effect==="dmg"||card.effect==="drain")){
        document.querySelectorAll(".em").forEach(el=>el.classList.add("drop-hi"));
        const ah=document.getElementById("ah");if(ah)ah.classList.add("drop-hi");
      }
    } else if(drag.type==="board"){
      const m=g.player.board[drag.boardIdx];
      const invalid=!m||m.sick||m.attacked;
      if(!m){drag.active=false;return;}
      drag.dragging=true;drag.invalid=invalid;
      const ghost=document.createElement("div");ghost.id="drag-ghost";
      ghost.style.cssText="position:fixed;pointer-events:none;z-index:999;transform:translate(-50%,-60%) rotate(-4deg);opacity:.9";
      ghost.innerHTML=hMinion(m,false,false,false);
      document.body.appendChild(ghost);drag.ghost=ghost;
      if(invalid){const gm=ghost.querySelector(".minion");if(gm)gm.classList.add("invalid-drag");}
      else{document.querySelectorAll(".em").forEach(el=>el.classList.add("drop-hi"));const ah=document.getElementById("ah");if(ah)ah.classList.add("drop-hi");}
    }
  }
  if(!drag.dragging)return;if(drag.ghost){drag.ghost.style.left=p.x+"px";drag.ghost.style.top=p.y+"px";}
  const card=drag.type==="hand"?(GAME&&GAME.player.hand[drag.cardIdx]):null;
  if(drag.type==="hand"&&card&&card.type==="minion"){
    const slot=getSlot(p.x);if(slot!==drag.insertSlot){drag.insertSlot=slot;updateSlots(slot);}
    // Fix 2+3: orange glow on ghost + battlefield indicator when above hand-wrap
    const hwEl=document.querySelector(".hand-wrap");
    const onBoard=hwEl&&p.y<hwEl.getBoundingClientRect().top;
    const gh=document.getElementById("drag-ghost");
    if(gh){gh.style.filter=onBoard?"drop-shadow(0 0 18px rgba(255,148,30,.95)) drop-shadow(0 0 8px rgba(255,148,30,.6))":"";}
    let ri=document.getElementById("cast-ready-ring");
    if(onBoard){
      if(!ri){ri=document.createElement("div");ri.id="cast-ready-ring";ri.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:990;background:rgba(255,148,30,.12);border:2px solid rgba(255,148,30,.75);border-radius:8px;padding:5px 20px;font-size:12px;color:#ffb040;font-family:monospace;letter-spacing:2px;box-shadow:0 0 22px rgba(255,148,30,.45)";ri.textContent="✦ 放開召喚";document.body.appendChild(ri);}
    }else{if(ri)ri.remove();}
  }
  else{
    // Fix: draw/heal spells have no target — don't show proximity arrow
    if(!(card&&(card.effect==="draw"||card.effect==="heal"))) updateProxArrow(p.x,p.y);
    // Fix 2+3: orange glow + battlefield indicator for draw/heal spells when dragged 80px up
    if(card&&(card.effect==="draw"||card.effect==="heal")){
      const vertDist=drag.startY-p.y;
      const gh=document.getElementById("drag-ghost");
      if(gh){gh.style.filter=vertDist>=80?"drop-shadow(0 0 18px rgba(255,148,30,.95)) drop-shadow(0 0 8px rgba(255,148,30,.6))":" ";}
      let ri=document.getElementById("cast-ready-ring");
      if(vertDist>=80){
        if(!ri){ri=document.createElement("div");ri.id="cast-ready-ring";ri.style.cssText="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:990;background:rgba(255,148,30,.12);border:2px solid rgba(255,148,30,.75);border-radius:8px;padding:5px 20px;font-size:12px;color:#ffb040;font-family:monospace;letter-spacing:2px;box-shadow:0 0 22px rgba(255,148,30,.45)";ri.textContent="✦ 放開施放";document.body.appendChild(ri);}
      }else{if(ri)ri.remove();}
    }
    // Fix 2: orange glow on ghost for targeted spells (dmg/drain) when near a target
    if(card&&(card.effect==="dmg"||card.effect==="drain")){
      const cl=closestTarget(p.x,p.y);
      const gh=document.getElementById("drag-ghost");
      if(gh){gh.style.filter=cl&&cl.dist<READY*1.4?"drop-shadow(0 0 18px rgba(255,148,30,.95)) drop-shadow(0 0 8px rgba(255,148,30,.6))":" ";}
    }
  }
}
function onUp(e){
  if(!drag.active)return;clearLP();
  const{type,dragging:wd,cardIdx:sc,boardIdx:sb,insertSlot:ss,wasLP,srcEl,invalid}=drag;
  const zOpen=!!document.getElementById("zoom-overlay");
  if(srcEl)srcEl.classList.remove("src-ghost");
  if(drag.ghost){drag.ghost.remove();drag.ghost=null;}
  clearDropHi();hideArrow();updateSlots(null);hideZoom();
  document.getElementById("cast-ready-ring")?.remove();
  const p=pt(e,true);
  const savedStartY=drag.startY; // save before reset!
  drag={active:false,type:"none",cardIdx:-1,boardIdx:-1,startX:0,startY:0,dragging:false,ghost:null,insertSlot:null,srcEl:null,wasLP:false,invalid:false};
  if(type==="hand"){
    const card=GAME&&GAME.player.hand[sc];
    if(!wd&&!zOpen&&!wasLP){if(card&&card.cost>GAME.player.mana){toast("魔力不足！","err");}else act({t:"HC",i:sc});}
    else if(wd){
      if(invalid||card&&card.cost>GAME.player.mana){toast("魔力不足！","err");return;}
      if(card&&card.type==="minion"&&GAME.player.board.length>=7){toast("戰場已滿！","err");return;}
      if(card&&card.type==="minion"){
        // Fix 1: only summon if released above hand-wrap (i.e. on the board area)
        const hwEl=document.querySelector(".hand-wrap");
        if(hwEl){const hr=hwEl.getBoundingClientRect();if(p.y>=hr.top){return;}} // still in hand area — cancel
        const slot=ss!=null?ss:GAME.player.board.length;
        act({t:"HC_AT",i:sc,slot});return;
      }
      if(card&&card.type!=="minion"){
        // Fix 1: draw spells use savedStartY for vertical distance check
        const vertDist=savedStartY-p.y;
        if(card.effect==="draw"||card.effect==="heal"){
          if(vertDist<80){return;}
          const g2=GAME;
          GAME={...castS(g2,sc,"player","player",-1),selCard:null,selAtk:null,mode:"default"};
          if(card.effect==="heal"){
            setTimeout(()=>{const ph=document.getElementById("ph");if(ph){const r=ph.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,card.val,true);}},60);
          }
          render();
          return;
        }
        // Fix 3: always set selCard+mode:"targeting" before dispatch
        const cl=closestTarget(p.x,p.y);
        if(cl&&cl.dist<READY*1.4){
          const em=cl.el.closest(".em"),isH=cl.el.id==="ah"||cl.el.closest(".hp-bar-row.top");
          if(em){GAME={...GAME,selCard:sc,mode:"targeting"};act({t:"EM",i:+em.dataset.ei});return;}
          if(isH){GAME={...GAME,selCard:sc,mode:"targeting"};act({t:"EH"});return;}
        }
        // Fix 3: own targets for heal/drain/dmg
        const el2=document.elementFromPoint(p.x,p.y);
        if(el2){
          const om=el2.closest(".om"),ph=el2.closest("#ph")||el2.closest(".hp-bar-row.bot");
          if(om&&(card.effect==="heal"||card.effect==="drain"||card.effect==="dmg")){GAME={...GAME,selCard:sc,mode:"targeting"};act({t:"PM",i:+om.dataset.oi});return;}
          if(ph&&(card.effect==="heal"||card.effect==="drain"||card.effect==="dmg")){GAME={...GAME,selCard:sc,mode:"targeting"};act({t:"PH"});return;}
        }
      }
      const el=document.elementFromPoint(p.x,p.y);if(el)handDrop(sc,ss,el);
    }
  }else if(type==="board"){
    if(!wd){act({t:"OM",i:sb});}
    else{
      if(invalid){
        // Show specific reason for invalid board drag
        const m=GAME&&GAME.player.board[sb];
        if(m&&m.sick)toast("此隨從下回合才能攻擊","err");
        else if(m&&m.attacked)toast("此隨從本回合已行動","warn");
        return;
      }
      const cl=closestTarget(p.x,p.y);if(cl&&cl.dist<READY*1.4){const em=cl.el.closest(".em"),isH=cl.el.id==="ah"||cl.el.classList.contains("hp-bar-row");if(em){act({t:"BOARD_ATK",bi:sb,tw:"ai",ti:+em.dataset.ei});return;}if(isH){act({t:"BOARD_ATK",bi:sb,tw:"ai",ti:-1});return;}}
      const el=document.elementFromPoint(p.x,p.y);if(el){const em=el.closest(".em"),ah=el.closest("#ah");if(em)act({t:"BOARD_ATK",bi:sb,tw:"ai",ti:+em.dataset.ei});else if(ah)act({t:"BOARD_ATK",bi:sb,tw:"ai",ti:-1});}
    }
  }
}
function clearDropHi(){document.querySelectorAll(".drop-hi,.drop-ready").forEach(e=>e.classList.remove("drop-hi","drop-ready"));}
function getSlot(cx){
  const pb=document.getElementById("pb");if(!pb||!GAME)return 0;
  const oms=Array.from(pb.querySelectorAll(".om"));
  if(!oms.length)return 0; // empty board: slot 0
  let slot=oms.length;
  for(let i=0;i<oms.length;i++){const r=oms[i].getBoundingClientRect();if(cx<r.left+r.width/2){slot=i;break;}}
  return slot;
}
function updateSlots(ins){
  const pb=document.getElementById("pb");if(!pb||!GAME)return;const pl=GAME.player;let h="";
  if(!pl.board.length){h=ins!=null?`<div class="board-slot-ghost"></div>`:`<div style="color:#d4cf4a;font-size:10px;letter-spacing:3px;font-family:monospace">— 我方戰場 —</div>`;}
  else{for(let i=0;i<=pl.board.length;i++){if(ins===i)h+=`<div class="board-slot-ghost"></div>`;if(i<pl.board.length){const m=pl.board[i];h+=`<div class="om" data-oi="${i}">${hMinion(m,GAME.selAtk===i,false,m.uid===newSummonUid)}</div>`;}}}
  pb.innerHTML=h;
}

// ── PROXIMITY ARROW ───────────────────
const PROX=160,READY=78;
function updateProxArrow(fx,fy){
  const ts=[];
  if(drag.type==="hand"){const card=GAME&&GAME.player.hand[drag.cardIdx];if(!card||card.type==="minion")return;}
  // Fix 1: arrow tip near bottom edge of minion card
  document.querySelectorAll(".em").forEach(em=>{
    const r=em.getBoundingClientRect();
    const idx=+em.dataset.ei;
    const mName=GAME&&GAME.ai.board[idx]?GAME.ai.board[idx].name:"";
    ts.push({el:em,x:r.left+r.width/2,y:r.top+r.height*0.88,label:mName});
  });
  // HP bar: trigger near bottom edge; Fix 2: circle aligned to bar center
  const hpTop=document.querySelector(".hp-bar-row.top");
  if(hpTop){
    const r=hpTop.getBoundingClientRect();
    ts.push({el:hpTop,x:r.left+r.width/2,y:r.bottom,
      yMin:r.bottom-10,yMax:r.bottom+70,
      circleY:r.top+r.height/2,circleR:r.height/2+2, // Fix 2: circle matches bar height
      label:"敵方本體"});
  }
  document.querySelectorAll(".drop-ready").forEach(e=>e.classList.remove("drop-ready"));
  ts.forEach(t=>{
    if(t.yMin!=null&&fy>=t.yMin&&fy<=t.yMax){
      t.dist=Math.abs(t.x-fx)*0.5;
    }else{
      t.dist=Math.sqrt((t.x-fx)**2+(t.y-fy)**2);
    }
  });
  const best=ts.filter(t=>t.dist<PROX).sort((a,b)=>a.dist-b.dist)[0];
  if(!best){hideArrow();return;}
  if(!arrowEl){arrowEl=document.createElement("div");arrowEl.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:997";document.body.appendChild(arrowEl);}
  const{x:tx,y:ty,dist}=best,rdy=dist<READY;
  if(rdy){
    best.el.classList.add("drop-ready");
    if(best.el.classList.contains("hp-bar-row")){
      best.el.style.filter="drop-shadow(0 0 18px rgba(255,148,42,.95)) drop-shadow(0 0 8px rgba(255,148,42,.6))";
      best.el.style.animation="rdyPulse .48s ease-in-out infinite";
    }
  }
  const col=rdy?"rgba(255,168,48,1)":"rgba(195,78,14,.92)";
  const colFade=rdy?"rgba(255,148,38,.28)":"rgba(145,55,8,.2)";
  const bcx=(fx+tx)/2-((ty-fy)*.14),bcy=(fy+ty)/2+((tx-fx)*.14);
  const gid="garw";
  // Fix 2: circle uses circleY/circleR if defined (HP bar), else default
  const circY=best.circleY??ty,circR=best.circleR??22;
  // Fix 3: target label near arrow tip when ready
  const lbl=rdy&&best.label?`<text x="${tx}" y="${circY-(circR+8)}" text-anchor="middle" fill="${col}" font-size="11" font-family="monospace" font-weight="bold" style="text-shadow:0 1px 3px rgba(0,0,0,.9)">${best.label}</text>`:""
  arrowEl.innerHTML=`<svg width="100%" height="100%" overflow="visible" style="position:absolute;inset:0">
    <defs>
      <linearGradient id="${gid}" x1="${fx}" y1="${fy}" x2="${tx}" y2="${ty}" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="${colFade}"/>
        <stop offset="100%" stop-color="${col}"/>
      </linearGradient>
      <marker id="arh-bg" markerWidth="4.5" markerHeight="3.6" refX="0" refY="1.8" orient="auto">
        <polygon points="0 0,4.5 1.8,0 3.6" fill="rgba(0,0,0,.85)"/>
      </marker>
      <marker id="arh" markerWidth="4.5" markerHeight="3.6" refX="0" refY="1.8" orient="auto">
        <polygon points="0 0,4.5 1.8,0 3.6" fill="${col}"/>
      </marker>
    </defs>
    <path d="M${fx},${fy} Q${bcx},${bcy} ${tx},${ty}"
      stroke="rgba(0,0,0,.75)" stroke-width="6.5" fill="none" stroke-linecap="round" marker-end="url(#arh-bg)"/>
    <path class="arrow-march" d="M${fx},${fy} Q${bcx},${bcy} ${tx},${ty}"
      stroke="url(#${gid})" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#arh)"/>
    ${rdy?`<rect x="${tx-circR}" y="${circY-circR}" width="${circR*2}" height="${circR*2}" rx="${circR}" fill="rgba(255,148,38,.08)" stroke="${col}" stroke-width="1.6"/>${lbl}`:""}
  </svg>`;
}
function hideArrow(){
  document.querySelectorAll(".drop-ready").forEach(e=>{e.classList.remove("drop-ready");});
  // Clear inline glow from hp-bar-row
  const hpTop=document.querySelector(".hp-bar-row.top");
  if(hpTop){hpTop.style.filter="";hpTop.style.animation="";}
  if(arrowEl){arrowEl.remove();arrowEl=null;}
}
function closestTarget(fx,fy){
  const ts=[];
  document.querySelectorAll(".em").forEach(em=>{const r=em.getBoundingClientRect();ts.push({el:em,x:r.left+r.width/2,y:r.top+r.height*0.88});});
  const hpTop=document.querySelector(".hp-bar-row.top");
  if(hpTop){const r=hpTop.getBoundingClientRect();ts.push({el:hpTop,x:r.left+r.width/2,y:r.bottom,yMin:r.bottom-10,yMax:r.bottom+70});}
  let best=null,md=Infinity;
  ts.forEach(t=>{
    let d;
    if(t.yMin!=null&&fy>=t.yMin&&fy<=t.yMax) d=Math.abs(t.x-fx)*0.5;
    else d=Math.sqrt((t.x-fx)**2+(t.y-fy)**2);
    if(d<md){md=d;best={...t,dist:d};}
  });
  return best;
}
function handDrop(ci,ins,el){if(!GAME||GAME.turn!=="player")return;const card=GAME.player.hand[ci];if(!card||card.cost>GAME.player.mana)return;if(card.type==="minion"){if(el.closest("#pb")||el.closest(".board-slot-ghost"))act({t:"HC_AT",i:ci,slot:ins!=null?ins:GAME.player.board.length});}else if(card.effect==="heal"||card.effect==="draw"){act({t:"HC",i:ci});}else{const em=el.closest(".em"),ah=el.closest("#ah");if(em){GAME={...GAME,selCard:ci,mode:"targeting"};act({t:"EM",i:+em.dataset.ei});}else if(ah){GAME={...GAME,selCard:ci,mode:"targeting"};act({t:"EH"});}}}

// ── PLAYER ATTACK ANIMATION ───────────
function doPlayerAtk(bi,tw,ti){
  if(!GAME||animLock)return;const g=GAME,atk=g.player.board[bi];if(!atk)return;
  const ns={...atkF(g,"player",bi,tw,ti),selAtk:null,mode:"default"};
  const def=ti!==-1?g.ai.board[ti]:null,defDmg=atk.atk,atkDmg=def?def.atk:0;
  const defDies=ti!==-1?!ns.ai.board.find(m=>m.uid===(def&&def.uid)):false,atkDies=!ns.player.board.find(m=>m.uid===atk.uid);
  const atkEl=document.querySelector(`.om[data-oi="${bi}"] .minion`);
  const defEl=ti===-1?document.getElementById("ah"):(document.querySelector(`.em[data-ei="${ti}"] .minion`)||document.querySelector(`.em[data-ei="${ti}"]`));
  animLock=true;
  lungeAtk(atkEl,defEl,()=>{
    if(defEl){const r=defEl.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,defDmg);}
    if(atkEl&&atkDmg>0){const r=atkEl.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,atkDmg);}
    if(defDies&&defEl)playDeathAnim(defEl);
    if(atkDies&&atkEl)playDeathAnim(atkEl);
  },()=>{
    animLock=false;
    // Don't restore atkEl opacity — playDeathAnim already hid it
    const anyDies=defDies||atkDies;
    setTimeout(()=>{
      if(anyDies){
        // FLIP: capture current positions before render
        const oms=Array.from(document.querySelectorAll('.om'));
        const ems=Array.from(document.querySelectorAll('.em'));
        const prevPos={};
        [...oms,...ems].forEach(el=>{const r=el.getBoundingClientRect();prevPos[el.dataset.oi??'e'+el.dataset.ei]={x:r.left,y:r.top};});
        GAME=ns;render();
        // Animate from old positions to new
        requestAnimationFrame(()=>{
          const allMinions=[...document.querySelectorAll('.om'),...document.querySelectorAll('.em')];
          allMinions.forEach(el=>{
            const key=el.dataset.oi??'e'+el.dataset.ei;
            const prev=prevPos[key];if(!prev)return;
            const nr=el.getBoundingClientRect();
            const dx=prev.x-nr.left,dy=prev.y-nr.top;
            if(Math.abs(dx)<2&&Math.abs(dy)<2)return;
            el.style.transition='none';el.style.transform=`translate(${dx}px,${dy}px)`;
            void el.offsetLeft;
            el.style.transition='transform .4s cubic-bezier(.25,1,.4,1)';
            el.style.transform='translate(0,0)';
            setTimeout(()=>el.style.transform='',420);
          });
        });
      }else{GAME=ns;render();}
    }, anyDies?2100:0);
  });
}

// ── DISPATCH ──────────────────────────
function act(a){
  if(!GAME||GAME.over||GAME.turn!=="player"||animLock)return;const g=GAME;
  if(a.t==="EA"){
    // Fix 8: all-target damage
    if(g.mode==="targeting"&&g.selCard!=null){
      const card=g.player.hand[g.selCard];
      if(card&&card.effect==="dmg"){
        setTimeout(()=>{document.querySelectorAll(".em .minion,#ah").forEach(el=>{if(el){const r=el.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,card.val);}});},60);
      }
      const ns2={...castS(g,g.selCard,"player","ai",-2),selCard:null,selAtk:null,mode:"default"};
      const died2=spellDeathAnims(g,ns2);
      GAME=ns2;
      if(died2)setTimeout(()=>render(),1800);else render();
    }
  }else if(a.t==="HC"){
    const c=g.player.hand[a.i];if(!c)return;if(c.cost>g.player.mana){toast("魔力不足！","err");return;}
    if(c.type==="minion"){if(g.player.board.length>=7){toast("戰場已滿！","err");return;}const mn={...c,uid:uid(),curHp:c.hp,sick:true,attacked:false};const nb=[...g.player.board,mn];GAME={...alog({...g,player:{...g.player,mana:g.player.mana-c.cost,hand:g.player.hand.filter((_,i)=>i!==a.i),board:nb}},`⚔️你召：${c.name}`),selCard:null,selAtk:null,mode:"default"};newSummonUid=mn.uid;setTimeout(()=>{newSummonUid=null;},500);}
    else if(c.effect==="draw"||c.effect==="heal"){
      // Self-cast spells — no target, cast immediately
      GAME={...castS(g,a.i,"player","player",-1),selCard:null,selAtk:null,mode:"default"};
      if(c.effect==="heal"){
        setTimeout(()=>{const ph=document.getElementById("ph");if(ph){const r=ph.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,c.val,true);}},60);
      }
      render();
    }else{
      // All other spells (dmg/heal/drain): drag-only, clicking shows hint
      toast("請拖曳法術卡到目標","warn");return;
    }
  }else if(a.t==="OM"){
    if(g.mode==="targeting"){
      const card=g.player.hand[g.selCard];
      if(card&&(card.effect==="dmg"||card.effect==="heal"||card.effect==="drain")){
        act({t:"PM",i:a.i});return;
      }
      GAME={...g,selCard:null,mode:"default"};
    }
    else{const m=g.player.board[a.i];if(!m)return;if(m.sick){toast("召喚後本回合不能攻擊","warn");return;}if(m.attacked){toast("此隨從本回合已行動","warn");return;}GAME=g.selAtk===a.i?{...g,selAtk:null,mode:"default"}:{...g,selAtk:a.i,mode:"attacking",selCard:null};}
  }else if(a.t==="EM"){
    if(g.mode==="targeting"&&g.selCard!=null){
      const card=g.player.hand[g.selCard];
      const ns={...castS(g,g.selCard,"player","ai",a.i),selCard:null,selAtk:null,mode:"default"};
      const died=spellDeathAnims(g,ns);
      if(card){
        if(card.effect==="dmg")Audio.sfxSpellDmg();else Audio.sfxSpellCast();
        const t=document.querySelector(`.em[data-ei="${a.i}"] .minion`)||document.querySelector(`.em[data-ei="${a.i}"]`);if(t){const r=t.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,card.val,card.effect==="heal");}
      }
      GAME=ns;if(died)setTimeout(()=>render(),1800);
    }else if(g.mode==="attacking"&&g.selAtk!=null){doPlayerAtk(g.selAtk,"ai",a.i);return;}
  }else if(a.t==="EH"){
    if(g.mode==="targeting"&&g.selCard!=null){
      const card=g.player.hand[g.selCard];
      const ns={...castS(g,g.selCard,"player","ai",-1),selCard:null,selAtk:null,mode:"default"};
      if(card){
        if(card.effect==="dmg")Audio.sfxSpellDmg();else if(card.effect==="heal")Audio.sfxSpellHeal();else Audio.sfxSpellCast();
        const ah=document.getElementById("ah");
        if(ah){const r=ah.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,card.val,card.effect==="heal");}
      }
      GAME=ns;
    }else if(g.mode==="attacking"&&g.selAtk!=null){doPlayerAtk(g.selAtk,"ai",-1);return;}
  }else if(a.t==="PH"){
    if(g.mode==="targeting"&&g.selCard!=null){
      const card=g.player.hand[g.selCard];
      const isHeal=card&&card.effect==="heal";
      if(isHeal)Audio.sfxSpellHeal();else Audio.sfxSpellCast();
      const ns={...castS(g,g.selCard,"player","player",-1),selCard:null,selAtk:null,mode:"default"};
      if(card){const ph=document.getElementById("ph");if(ph){const r=ph.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,card.val,isHeal);}}
      GAME=ns;
    }
  }else if(a.t==="PM"){
    if(g.mode==="targeting"&&g.selCard!=null){
      const card=g.player.hand[g.selCard];
      if(card)Audio.sfxSpellCast();
      const ns={...castS(g,g.selCard,"player","player",a.i),selCard:null,selAtk:null,mode:"default"};
      const died=spellDeathAnims(g,ns);
      if(card){const t=document.querySelector(`.om[data-oi="${a.i}"] .minion`);if(t){const r=t.getBoundingClientRect();floatDmg(r.left+r.width/2,r.top,card.val,true);}}
      GAME=ns;if(died)setTimeout(()=>render(),1800);
    }
  }else if(a.t==="HC_AT"){
    const c=g.player.hand[a.i];if(!c)return;if(c.cost>g.player.mana){toast("魔力不足！","err");return;}if(c.type!=="minion")return;if(g.player.board.length>=7){toast("戰場已滿！","err");return;}
    const slot=Math.min(Math.max(0,a.slot??g.player.board.length),g.player.board.length);const mn={...c,uid:uid(),curHp:c.hp,sick:true,attacked:false};const board=[...g.player.board];board.splice(slot,0,mn);
    GAME={...alog({...g,player:{...g.player,mana:g.player.mana-c.cost,hand:g.player.hand.filter((_,i)=>i!==a.i),board}},`⚔️你召：${c.name}`),selCard:null,selAtk:null,mode:"default"};
    Audio.sfxMinionSummon();
    newSummonUid=mn.uid;setTimeout(()=>{newSummonUid=null;},500);
  }else if(a.t==="BOARD_ATK"){
    const m=g.player.board[a.bi];if(m&&m.sick){toast("召喚後本回合不能攻擊","warn");return;}if(m&&m.attacked){toast("此隨從本回合已行動","warn");return;}doPlayerAtk(a.bi,a.tw,a.ti);return;
  }else if(a.t==="CL"){GAME={...g,selCard:null,selAtk:null,mode:"default"};
  }else if(a.t==="ET"){toast("對方回合","ai");Audio.sfxTurnStartAI();GAME=startT({...g,selCard:null,selAtk:null,mode:"default"},"ai");}
  render();
}

// ── ROUTER ────────────────────────────
const R=()=>document.getElementById("root");
let _lastTurn=null;
function render(){
  if(SCR==="menu")showMenu();
  else if(SCR==="deck")showDeck();
  else if(SCR==="battle"&&GAME){showBattle();requestAnimationFrame(()=>updateLagBars());}
  if(GAME&&!GAME.over&&GAME.turn==="player"&&_lastTurn!=="player"){setTimeout(()=>toast("你的回合！","ok"),90);}
  _lastTurn=GAME?.turn??null;
  if(GAME&&(GAME.lastDraws?.length||GAME.aiNewCard)){
    const draws=[...(GAME.lastDraws||[])];
    if(draws.length){
      requestAnimationFrame(()=>{
        // ── FLIP: slide existing cards from old positions to new positions ──
        const allHs=Array.from(document.querySelectorAll('.hs'));
        const pendingHs=allHs.filter(el=>el.classList.contains('draw-pending'));
        const existingHs=allHs.filter(el=>!el.classList.contains('draw-pending'));
        const nNew=allHs.length;
        const nOld=nNew-pendingHs.length;
        const cw=82;
        const ovOld=nOld>7?18:nOld>5?26:36;
        const ovNew=nNew>7?18:nNew>5?26:36;

        // Step 1: snap existing cards to OLD positions (no transition)
        existingHs.forEach((el,i)=>{
          el.style.transition='none';
          el.style.left=(i*ovOld)+'px';
        });

        // Force reflow — browser MUST commit old positions before we start transition
        // Reading offsetLeft causes synchronous layout, preventing frame batching
        existingHs.forEach(el=>void el.offsetLeft);

        // Step 2: now animate to NEW positions with smooth easing
        existingHs.forEach((el)=>{
          const hi=+el.dataset.hi;
          el.style.transition='left .5s cubic-bezier(0.34,1.15,0.64,1),transform .15s';
          el.style.left=(hi*ovNew)+'px';
        });

        // Step 3: after slide settles (~320ms), fly in new cards one by one
        draws.forEach((uid,i)=>{setTimeout(()=>Audio.sfxCardDraw(),320+i*650);animFlyIntoSlot(uid, 320+i*650);});
      });
    }
    const clearDelay=draws.length?320+draws.length*650+750:700;
    setTimeout(()=>{if(GAME)GAME={...GAME,lastDraws:[],aiNewCard:false};},clearDelay);
  }
}
try{render();}catch(e){R().innerHTML=`<div style="color:#f66;padding:30px;font-family:monospace;background:#111;min-height:100vh"><b>ERROR:</b><br><br>${e.stack.replace(/\n/g,"<br>")}</div>`;}
</script>
