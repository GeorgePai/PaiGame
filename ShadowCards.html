<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shadow Cards</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#f0ece0;font-family:Georgia,serif;overflow:hidden;height:100vh;touch-action:none}
#root{width:100vw;height:100vh;display:flex;flex-direction:column}
button{font-family:Georgia,serif;cursor:pointer}

/* ── CARD ── */
.card{width:82px;height:112px;background:#f4f0e8;border:1px solid #1a1a1a;border-radius:6px;position:relative;overflow:hidden;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:box-shadow .15s,opacity .15s}
.card.sm{width:68px;height:94px}
.card.sel{border:2px solid #ffd700;box-shadow:0 0 14px rgba(255,215,0,.6)}
.card.faded{opacity:.38;pointer-events:none}
.card .cost{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#162a7a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:monospace;font-weight:bold;z-index:1}
.card .cname{position:absolute;top:20px;left:2px;right:2px;text-align:center;font-size:8px;color:#111;font-weight:bold;line-height:1.1}
.card.sm .cname{top:17px;font-size:7px}
.card .csym{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:26px;color:#1a1a1a}
.card.sm .csym{font-size:20px}
.card .cdesc{position:absolute;bottom:4px;left:2px;right:2px;text-align:center;font-size:6px;color:#555;line-height:1.3}
.card .catk,.card .chp{position:absolute;bottom:3px;width:15px;height:15px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-family:monospace;font-weight:bold}
.card .catk{left:3px;background:#8a1e1e}
.card .chp{right:3px;background:#1e3c8a}

/* ── CARD BACK ── */
.cardback{width:68px;height:94px;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* ── BOARD MINION ── */
.minion{width:68px;height:88px;background:#f4f0e8;border:1px solid #444;border-radius:6px;position:relative;cursor:pointer;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:all .15s;font-family:Georgia,serif}
.minion.can{border:2px solid rgba(85,140,255,0.7);box-shadow:0 0 10px rgba(85,136,255,0.4);animation:pulseBlue 2s ease-in-out infinite}
.minion.atk-sel{background:#1a1a1a;border:2px solid #ffd700;box-shadow:0 0 12px rgba(255,215,0,.5)}
.minion.glow{border:2px dashed #cc3333;box-shadow:0 0 10px rgba(200,50,50,.4)}
.minion.sick{opacity:.65}
.minion .mn{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:7px;font-weight:bold;color:#111;padding:0 3px;line-height:1.2}
.minion.atk-sel .mn{color:#ccc}
.minion .ms{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:20px;color:#222}
.minion.atk-sel .ms{color:#aaa}
.minion .mz{position:absolute;top:52%;left:0;right:0;text-align:center;font-size:9px;color:#777}
.minion .ma,.minion .mh{position:absolute;bottom:3px;width:15px;height:15px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;font-family:monospace;font-weight:bold}
.minion .ma{left:3px;background:#8a1e1e}
.minion .mh{right:3px;background:#1e3c8a}
.minion .mh.lo{background:#6e1414}

/* ── LAYOUT ── */
.bar{flex-shrink:0;padding:8px 16px;display:flex;align-items:center;gap:14px;background:#0e0e0e}
.hero{width:58px;height:58px;border-radius:50%;background:#111;border:2px solid #2a2a2a;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.hero.tgt{border:2px dashed #cc3333;box-shadow:0 0 12px rgba(200,50,50,.5);cursor:pointer}
.boards{flex:1;display:flex;flex-direction:column;position:relative;min-height:0}
.brow{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#0e0e0e;padding:6px 8px;min-height:100px;transition:background .2s}
.brow.drag-over{background:#151515}
.divider{height:1px;background:#181818;position:relative;flex-shrink:0}
.hand-wrap{flex-shrink:0;height:128px;background:#090909;border-top:1px solid #111;overflow:visible;display:flex;justify-content:center;align-items:flex-end;padding-bottom:6px}
.ai-hand-wrap{flex-shrink:0;height:84px;display:flex;justify-content:center;align-items:center;background:#0a0a0a;border-bottom:1px solid #111}

/* ── HAND SLOT + FLOAT ANIMATION ── */
.hs{position:absolute;bottom:0;cursor:grab;user-select:none;-webkit-user-select:none}
.hs:active{cursor:grabbing}
.card-fw{animation:floatCard 2.2s ease-in-out infinite;animation-delay:var(--fd,0s)}
@keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ── DRAW ANIMATION (chain flyIn → floatCard, no forwards to fix stuck bug) ── */
.card-fw.new-card{animation:flyIn .45s cubic-bezier(.2,1.3,.6,1), floatCard 2.2s .45s ease-in-out infinite}
@keyframes flyIn{
  0%{transform:translateX(220px) scale(0.25) rotate(12deg);opacity:0}
  60%{transform:translateX(-6px) scale(1.06) rotate(-1deg);opacity:1}
  100%{transform:translateX(0) scale(1) rotate(0deg);opacity:1}
}

/* ── DRAG GHOST ── */
#drag-ghost{position:fixed;pointer-events:none;z-index:999;transform:translate(-50%,-65%) rotate(-6deg);opacity:.88;transition:none}

/* ── PLAYABLE GLOW (replaces faded/opacity approach) ── */
.card.playable{border:1px solid rgba(85,140,255,0.75)!important;box-shadow:0 0 14px rgba(85,136,255,.55),0 2px 8px rgba(0,0,0,.5);animation:pulseBlue 2s ease-in-out infinite}
@keyframes pulseBlue{0%,100%{box-shadow:0 0 8px rgba(85,136,255,.35),0 2px 6px rgba(0,0,0,.4)}50%{box-shadow:0 0 18px rgba(85,136,255,.7),0 2px 6px rgba(0,0,0,.4)}}
.card.faded{opacity:.32;pointer-events:none;filter:grayscale(40%)}

/* ── DROP HIGHLIGHT ── */
.em.drop-hi .minion{outline:3px solid rgba(85,136,255,.6);outline-offset:2px}
.hero.drop-hi{border-color:rgba(85,136,255,.6)!important;box-shadow:0 0 14px rgba(85,136,255,.5)!important}
/* READY TO DROP state */
.em.drop-ready .minion{outline:3px solid rgba(255,170,60,.9)!important;outline-offset:3px;animation:readyPulse .5s ease-in-out infinite}
.hero.drop-ready{border-color:rgba(255,170,60,.9)!important;box-shadow:0 0 20px rgba(255,160,50,.7)!important;animation:readyPulse .5s ease-in-out infinite}
@keyframes readyPulse{0%,100%{opacity:.85}50%{opacity:1}}

/* ── BOARD SLOT GHOST ── */
.board-slot-ghost{width:68px;height:88px;border:2px dashed rgba(85,136,255,0.35);border-radius:6px;flex-shrink:0;background:rgba(85,136,255,0.05);animation:slotIn .18s ease-out}
@keyframes slotIn{0%{width:0;opacity:0;margin:0;min-width:0}100%{width:68px;opacity:1}}

/* ── ZOOM OVERLAY ── */
#zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:800;cursor:pointer}
#zoom-overlay .card{transform:scale(2.4);transform-origin:center center;pointer-events:none}
#zoom-overlay .card .cname{font-size:9px}
#zoom-overlay .card .cdesc{font-size:7px}

/* ── TOAST ── */
#sc-toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(8,8,8,0.92);border:1px solid rgba(255,255,255,.1);padding:9px 22px;border-radius:2px;font-family:Georgia,serif;font-size:13px;z-index:1000;pointer-events:none;letter-spacing:1px;white-space:nowrap;animation:toastAnim 2s ease-out forwards}
#sc-toast.ok{color:#88dd88;border-color:rgba(100,200,100,.3)}
#sc-toast.warn{color:#f0ece0}
#sc-toast.err{color:#ff8888;border-color:rgba(255,80,80,.3)}
@keyframes toastAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(.9)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}

/* ── END TURN BUTTON HINT ── */
.end-btn-hint{animation:endHint 1.6s ease-in-out infinite}
@keyframes endHint{0%,100%{box-shadow:none}50%{box-shadow:0 0 20px rgba(240,236,224,.55)}}

/* ── LOG PANEL ── */
.gamelog-wrap{position:absolute;right:8px;top:8px;bottom:8px;width:162px;z-index:10}
.log-toggle-btn{width:100%;padding:5px 0;background:#0a0a0a;border:1px solid #1a1a1a;color:#444;font-size:9px;letter-spacing:2px;cursor:pointer;margin-bottom:4px}
.log-toggle-btn:hover{color:#777;border-color:#333}
.gamelog{height:calc(100% - 28px);background:rgba(0,0,0,.75);border:1px solid #0f0f0f;padding:8px;overflow-y:auto;border-radius:0 0 2px 2px;font-family:monospace;font-size:9px;display:flex;flex-direction:column;gap:3px}
.gamelog-line{border-bottom:1px solid #0a0a0a;padding-bottom:3px;color:#2a2a2a}
.gamelog-line.latest{color:#555}

/* ── MENU ── */
.mbg{min-height:100vh;background:#070707;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.deco{position:absolute;inset:0;opacity:.04;pointer-events:none}

/* ── DECK ── */
.dscreen{min-height:100vh;background:#070707;display:flex;flex-direction:column}
.dhead{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid #111;background:#0a0a0a;gap:14px}
.dbody{display:flex;flex:1;overflow:hidden}
.pool{flex:1;overflow-y:auto;padding:16px;background:#080808}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px}
.dlist{width:195px;border-left:1px solid #111;padding:14px;overflow-y:auto;background:#090909}

/* ── GAME OVER ── */
.go{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
</style>
</head>
<body><div id="root"></div>
<script>
// ── DATA ──────────────────────────────
const CARDS=[
  {id:"m01",name:"暗影精靈",cost:1,type:"minion",atk:1,hp:2,sym:"◈"},
  {id:"m02",name:"黑暗斥候",cost:2,type:"minion",atk:2,hp:2,sym:"◉"},
  {id:"m03",name:"虛空幻影",cost:2,type:"minion",atk:3,hp:1,sym:"◐"},
  {id:"m04",name:"骨弓射手",cost:3,type:"minion",atk:2,hp:3,sym:"◎"},
  {id:"m05",name:"符文劍客",cost:3,type:"minion",atk:3,hp:2,sym:"⬡"},
  {id:"m06",name:"虛空行者",cost:3,type:"minion",atk:2,hp:4,sym:"◆"},
  {id:"m07",name:"虛空騎士",cost:4,type:"minion",atk:3,hp:4,sym:"◇"},
  {id:"m08",name:"死亡守衛",cost:4,type:"minion",atk:2,hp:6,sym:"⬟"},
  {id:"m09",name:"石甲魔像",cost:5,type:"minion",atk:4,hp:5,sym:"⬠"},
  {id:"m10",name:"暗影法師",cost:5,type:"minion",atk:4,hp:4,sym:"◑"},
  {id:"m11",name:"死神使者",cost:6,type:"minion",atk:5,hp:4,sym:"◓"},
  {id:"m12",name:"黑暗元素",cost:6,type:"minion",atk:5,hp:6,sym:"◒"},
  {id:"m13",name:"暗影巨龍",cost:7,type:"minion",atk:6,hp:5,sym:"◭"},
  {id:"m14",name:"古代巨神",cost:8,type:"minion",atk:7,hp:8,sym:"◬"},
  {id:"s01",name:"暗影箭",  cost:1,type:"spell",effect:"dmg",  val:2,sym:"✦",desc:"造成2點傷害"},
  {id:"s02",name:"黑暗儀式",cost:2,type:"spell",effect:"draw", val:2,sym:"✧",desc:"抽2張牌"},
  {id:"s03",name:"黑暗護盾",cost:2,type:"spell",effect:"heal", val:8,sym:"✩",desc:"恢復8點生命"},
  {id:"s04",name:"虛空爆破",cost:3,type:"spell",effect:"dmg",  val:4,sym:"✪",desc:"造成4點傷害"},
  {id:"s05",name:"吸魂術",  cost:4,type:"spell",effect:"drain",val:5,sym:"✫",desc:"吸取5點生命"},
  {id:"s06",name:"混沌衝擊",cost:5,type:"spell",effect:"dmg",  val:7,sym:"✬",desc:"造成7點傷害"},
];
const getDef=id=>CARDS.find(c=>c.id===id);
const DEF_DECK=["m01","m01","s01","s01","m02","m02","m03","m03","s02","s03","m04","m04","s04","m05","m05","m07","m07","m08","s05","m06","m06","m09","m09","m10","m11","m12","s06","m13","m14","m14"];

// ── LOGIC ─────────────────────────────
let _u=0; const uid=()=>++_u;
const shuf=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
const mk=def=>({...def,uid:uid(),curHp:def.hp||0,sick:true,attacked:false});
const alog=(s,m)=>({...s,log:[m,...s.log.slice(0,29)]});
const chk=s=>{
  if(s.player.hp<=0&&s.ai.hp<=0)return{...s,over:"draw"};
  if(s.player.hp<=0)return{...s,over:"lose"};
  if(s.ai.hp<=0)return{...s,over:"win"};
  return s;
};
const draw1=(s,who)=>{
  const p=s[who];
  if(!p.deck.length){const ns={...s,[who]:{...p,hp:p.hp-5}};return chk(alog(ns,"💀 "+(who==="player"?"你":"電腦")+"牌庫空！貪婪詛咒-5HP"));}
  const[drawn,...rest]=p.deck;
  if(p.hand.length>=10)return alog({...s,[who]:{...p,deck:rest}},drawn.name+"被燒毀");
  const ns={...s,[who]:{...p,deck:rest,hand:[...p.hand,drawn]},lastDrawnUid:who==="player"?drawn.uid:null,aiNewCard:who==="ai"};
  return who==="player"?alog(ns,"🃏 抽："+drawn.name):ns;
};
const startT=(s0,who)=>{
  const p=s0[who],nm=Math.min(10,p.maxMana+1);
  let s={...s0,[who]:{...p,maxMana:nm,mana:nm,board:p.board.map(m=>({...m,sick:false,attacked:false}))},turn:who,mode:"default",selCard:null,selAtk:null,lastDrawnUid:null,aiNewCard:false};
  s=draw1(s,who);
  if(!s.over)s=alog(s,"━━ "+(who==="player"?"你的回合":"電腦回合")+" ━━");
  return s;
};
const playM=(s0,hi,who)=>{
  const p=s0[who],c=p.hand[hi];
  if(!c||c.type!=="minion"||p.mana<c.cost||p.board.length>=7)return s0;
  const mn={...c,uid:uid(),curHp:c.hp,sick:true,attacked:false};
  return alog({...s0,[who]:{...p,mana:p.mana-c.cost,hand:p.hand.filter((_,i)=>i!==hi),board:[...p.board,mn]}},"⚔️ "+(who==="player"?"你":"電腦")+"召："+c.name);
};
const castS=(s0,hi,who,tw,ti)=>{
  const p=s0[who],c=p.hand[hi];
  if(!c||c.type!=="spell"||p.mana<c.cost)return s0;
  let s={...s0,[who]:{...p,mana:p.mana-c.cost,hand:p.hand.filter((_,i)=>i!==hi)}};
  const{effect:ef,val:v}=c;
  if(ef==="dmg"){
    if(ti===-1){s={...s,[tw]:{...s[tw],hp:s[tw].hp-v}};s=alog(s,"✨"+c.name+"→英雄-"+v);}
    else{const h=s[tw].board[ti];s={...s,[tw]:{...s[tw],board:s[tw].board.map((m,i)=>i===ti?{...m,curHp:m.curHp-v}:m).filter(m=>m.curHp>0)}};s=alog(s,"✨"+c.name+"→"+h.name+"-"+v);}
  }else if(ef==="heal"){
    s={...s,[who]:{...s[who],hp:Math.min(100,s[who].hp+v)}};s=alog(s,"💚"+c.name+"+"+v);
  }else if(ef==="draw"){
    s=alog(s,"📚"+c.name+"抽"+v);for(let i=0;i<v;i++){s=draw1(s,who);if(s.over)break;}
  }else if(ef==="drain"){
    let d=v;
    if(ti===-1){s={...s,[tw]:{...s[tw],hp:s[tw].hp-v}};}
    else{d=Math.min(v,s[tw].board[ti].curHp);s={...s,[tw]:{...s[tw],board:s[tw].board.map((m,i)=>i===ti?{...m,curHp:m.curHp-v}:m).filter(m=>m.curHp>0)}};}
    s={...s,[who]:{...s[who],hp:Math.min(100,s[who].hp+d)}};s=alog(s,"🔮"+c.name+"吸"+d);
  }
  return chk(s);
};
const atkF=(s0,who,ai,tw,ti)=>{
  const a=s0[who].board[ai];
  if(!a||a.sick||a.attacked)return s0;
  if(ti===-1){
    let s={...s0,[who]:{...s0[who],board:s0[who].board.map((m,i)=>i===ai?{...m,attacked:true}:m)},[tw]:{...s0[tw],hp:s0[tw].hp-a.atk}};
    return chk(alog(s,"⚔️"+a.name+"→英雄-"+a.atk));
  }
  const d=s0[tw].board[ti];
  let s={...s0,[who]:{...s0[who],board:s0[who].board.map((m,i)=>i===ai?{...m,attacked:true,curHp:a.curHp-d.atk}:m).filter(m=>m.curHp>0)},[tw]:{...s0[tw],board:s0[tw].board.map((m,i)=>i===ti?{...m,curHp:d.curHp-a.atk}:m).filter(m=>m.curHp>0)}};
  return chk(alog(s,"⚔️"+a.name+"("+a.atk+")vs"+d.name+"("+d.atk+")"));
};
const aiTurn=s0=>{
  let s=s0,played=true;
  while(played&&!s.over){
    played=false;
    const ai=s.ai,opts=ai.hand.map((c,i)=>({c,i})).filter(({c})=>c.cost<=ai.mana);
    if(!opts.length)break;
    const mo=opts.filter(({c})=>c.type==="minion"&&ai.board.length<7).sort((a,b)=>b.c.cost-a.c.cost);
    const so=opts.filter(({c})=>c.type==="spell").sort((a,b)=>b.c.cost-a.c.cost);
    const pk=mo[0]||so[0];if(!pk)break;
    if(pk.c.type==="minion"){s=playM(s,pk.i,"ai");}
    else{
      const{c,i}=pk;let tw="player",ti=-1;
      if(c.effect==="dmg"||c.effect==="drain"){const pb=s.player.board;if(pb.length){ti=pb.findIndex(m=>m.curHp<=c.val);if(ti<0)ti=0;}}
      else if(c.effect==="heal"){tw="ai";}
      s=castS(s,i,"ai",tw,ti);
    }
    if(!s.over)played=true;
  }
  if(!s.over){
    const us=s.ai.board.filter(m=>!m.sick&&!m.attacked).map(m=>m.uid);
    for(const u of us){
      if(s.over)break;
      const idx=s.ai.board.findIndex(m=>m.uid===u);if(idx<0)continue;
      const pb=s.player.board;
      if(pb.length){const ti=pb.reduce((mi,m,i)=>m.curHp<pb[mi].curHp?i:mi,0);s=atkF(s,"ai",idx,"player",ti);}
      else s=atkF(s,"ai",idx,"player",-1);
    }
  }
  return s;
};
const newGame=pdeck=>{
  const pd=shuf(pdeck).map(id=>mk(getDef(id))),ad=shuf(DEF_DECK).map(id=>mk(getDef(id)));
  const ph=pd.splice(0,2),ah=ad.splice(0,2);
  let s={player:{hp:100,mana:0,maxMana:0,deck:pd,hand:ph,board:[]},ai:{hp:100,mana:0,maxMana:0,deck:ad,hand:ah,board:[]},turn:"player",mode:"default",selCard:null,selAtk:null,log:["遊戲開始！你先手。"],over:null,lastDrawnUid:null};
  return startT(s,"player");
};

// ── APP STATE ──────────────────────────
let SCR="menu",DECK=[...DEF_DECK],GAME=null,aiRunning=false,logOpen=false;
let deckEdit=[...DEF_DECK];

// ── DRAG STATE ─────────────────────────
let drag={active:false,type:"none",cardIdx:-1,boardIdx:-1,startX:0,startY:0,dragging:false,ghost:null,wasLongPress:false,insertSlot:null};
let lpTimer=null;
let listenersAdded=false;

// ── HTML HELPERS ──────────────────────
const hCard=(c,sel,faded,sm,glow=false)=>`<div class="card${sm?" sm":""}${sel?" sel":""}${faded?" faded":""}${glow?" playable":""}">
  <div class="cost">${c.cost}</div><div class="csym">${c.sym}</div><div class="cname">${c.name}</div>
  ${c.type==="minion"?`<div class="catk">${c.atk}</div><div class="chp">${c.hp}</div>`:`<div class="cdesc">${c.desc||""}</div>`}
</div>`;
const hBack=()=>`<div class="cardback"><div style="width:56px;height:82px;border:1px solid #1e1e1e;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#1e1e1e;font-size:22px">◈</div></div>`;
const hMinion=(m,sel,glow)=>{const can=!m.sick&&!m.attacked,lo=m.curHp/m.hp<0.35;
  return`<div class="minion${sel?" atk-sel":""}${glow?" glow":""}${can&&!sel?" can":""}${m.sick?" sick":""}">
  <div class="mn">${m.name}</div><div class="ms">${m.sym}</div>${m.sick?`<div class="mz">zzz</div>`:""}
  <div class="ma">${m.atk}</div><div class="mh${lo?" lo":""}">${m.curHp}</div></div>`;};
const hMana=(cur,max)=>{let g="";for(let i=0;i<10;i++)g+=`<div style="width:11px;height:11px;border-radius:50%;background:${i<cur?"#4477ff":"transparent"};border:1px solid ${i<max?(i<cur?"#5588ff":"#334"):"#1a1a1a"}"></div>`;
  return`<div style="display:flex;gap:3px;align-items:center">${g}<span style="margin-left:4px;font-size:10px;color:#555;font-family:monospace">${cur}/${max}</span></div>`;};
const hpCol=hp=>hp>50?"#5a5":hp>25?"#aa5":"#a44";
const hHero=(hp,isAI,tgt,id)=>`<div class="hero${tgt?" tgt":""}"${id?` id="${id}"`:""}><span style="font-size:16px">${isAI?"💀":"🛡️"}</span><span style="font-size:13px;font-family:monospace;font-weight:bold;color:${hpCol(hp)}">${hp}</span></div>`;

const hFan=(hand,selIdx,mana,lastDrawnUid)=>{
  if(!hand.length)return`<div style="height:110px;display:flex;align-items:center;justify-content:center;color:#333;font-size:12px">手牌為空</div>`;
  const n=hand.length,ds=Math.min(n*4.5,36),step=n>1?ds/(n-1):0;
  const cw=82,ov=n>7?18:n>5?26:36,tw=cw+(n-1)*ov;
  let sl="";
  hand.forEach((c,i)=>{
    const ang=n>1?(i-(n-1)/2)*step:0,isSel=selIdx===i,cp=c.cost<=mana,isNew=c.uid===lastDrawnUid;
    const delay=(i*0.18).toFixed(2);
    // Use blue glow for playable, no fading for unplayable
    sl+=`<div class="hs" data-hi="${i}" style="left:${i*ov}px;transform-origin:bottom center;transform:rotate(${ang}deg) translateY(${isSel?-24:0}px);z-index:${isSel?60:i};transition:transform .15s">
      <div class="card-fw${isNew?" new-card":""}" style="--fd:-${delay}s">${hCard(c,isSel,false,false,cp&&!isSel)}</div>
    </div>`;
  });
  return`<div style="position:relative;width:${tw}px;height:120px">${sl}</div>`;
};

const hAIFan=(n,aiNew)=>{if(!n)return"";
  const ds=Math.min(n*4.5,36),step=n>1?ds/(n-1):0,ov=n>7?18:n>5?22:30,tw=68+(n-1)*ov;
  const pad=44; // extra horizontal room so rotated corners don't clip
  let sl="";for(let i=0;i<n;i++){const ang=n>1?(i-(n-1)/2)*step:0,isNew=aiNew&&i===n-1,delay=(i*0.22).toFixed(2);
    sl+=`<div style="position:absolute;left:${i*ov+pad}px;top:0;transform-origin:top center;transform:rotate(${ang}deg);z-index:${i}"><div class="card-fw${isNew?" new-card":""}" style="--fd:-${delay}s">${hBack()}</div></div>`;}
  return`<div style="position:relative;width:${tw+pad*2}px;height:78px">${sl}</div>`;};;

  document.getElementById("dbk").onclick=()=>{SCR="menu";render();};

// ── DRAG & INTERACTION SYSTEM ─────────
function pt(e,changed){
  const src=(changed&&e.changedTouches)?e.changedTouches:e.touches;
  if(src&&src.length)return{x:src[0].clientX,y:src[0].clientY};
  return{x:e.clientX,y:e.clientY};
}
function clearLP(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}}

function addDragListeners(){
  if(listenersAdded)return;
  listenersAdded=true;
  document.addEventListener("mousemove",onDocMove,{passive:false});
  document.addEventListener("mouseup",onDocUp);
  document.addEventListener("touchmove",onDocMove,{passive:false});
  document.addEventListener("touchend",onDocUp);
  document.addEventListener("mousedown",onDocDown);
  document.addEventListener("touchstart",onDocDown,{passive:false});
}

function onDocDown(e){
  if(SCR!=="battle"||!GAME||GAME.over||GAME.turn!=="player")return;
  const hs=e.target.closest(".hs"), om=e.target.closest(".om");
  if(!hs&&!om)return;
  e.preventDefault();
  const p=pt(e);
  if(hs){
    const idx=+hs.dataset.hi;
    drag={active:true,type:"hand",cardIdx:idx,boardIdx:-1,startX:p.x,startY:p.y,dragging:false,ghost:null,wasLongPress:false,insertSlot:null};
    lpTimer=setTimeout(()=>{lpTimer=null;if(!drag.dragging){drag.wasLongPress=true;showZoom(idx);}},480);
  } else {
    drag={active:true,type:"board",cardIdx:-1,boardIdx:+om.dataset.oi,startX:p.x,startY:p.y,dragging:false,ghost:null,wasLongPress:false,insertSlot:null};
  }
}

function onDocMove(e){
  if(!drag.active)return;
  e.preventDefault();
  const p=pt(e);
  const ddx=p.x-drag.startX,ddy=p.y-drag.startY;
  if(!drag.dragging&&Math.sqrt(ddx*ddx+ddy*ddy)>12){
    clearLP();
    const g=GAME;if(!g)return;
    if(drag.type==="hand"){
      const card=g.player.hand[drag.cardIdx];if(!card)return;
      drag.dragging=true;
      const ghost=document.createElement("div");
      ghost.id="drag-ghost";ghost.innerHTML=hCard(card,false,false,false);
      document.body.appendChild(ghost);drag.ghost=ghost;
      if(card.type!=="minion"){
        document.querySelectorAll(".em").forEach(el=>el.classList.add("drop-hi"));
        const eh=document.getElementById("eh");if(eh)eh.classList.add("drop-hi");
      }
    } else if(drag.type==="board"){
      const m=g.player.board[drag.boardIdx];
      if(!m||m.sick||m.attacked){drag.active=false;return;}
      drag.dragging=true;
      const ghost=document.createElement("div");
      ghost.id="drag-ghost";
      ghost.style.cssText="position:fixed;pointer-events:none;z-index:999;transform:translate(-50%,-60%) rotate(-4deg);opacity:.88;transition:none";
      ghost.innerHTML=hMinion(m,false,false);
      document.body.appendChild(ghost);drag.ghost=ghost;
      document.querySelectorAll(".em").forEach(el=>el.classList.add("drop-hi"));
      const eh=document.getElementById("eh");if(eh)eh.classList.add("drop-hi");
    }
  }
  if(!drag.dragging)return;
  if(drag.ghost){drag.ghost.style.left=p.x+"px";drag.ghost.style.top=p.y+"px";}
  const card=drag.type==="hand"?(GAME&&GAME.player.hand[drag.cardIdx]):null;
  if(drag.type==="hand"&&card&&card.type==="minion"){
    const slot=getInsertSlot(p.x);
    if(slot!==drag.insertSlot){drag.insertSlot=slot;updateBoardSlots(slot);}
  } else {
    updateProximityArrow(p.x,p.y);
  }
}

function onDocUp(e){
  if(!drag.active)return;
  clearLP();
  const{type,dragging:wasDragging,cardIdx:savedCard,boardIdx:savedBoard,insertSlot:savedSlot}=drag;
  const zoomOpen=!!document.getElementById("zoom-overlay");
  if(drag.ghost){drag.ghost.remove();drag.ghost=null;}
  clearDropHi();
  hideArrow();
  updateBoardSlots(null);
  hideZoom();
  const p=pt(e,true);
  drag={active:false,type:"none",cardIdx:-1,boardIdx:-1,startX:0,startY:0,dragging:false,ghost:null,wasLongPress:false,insertSlot:null};
  if(type==="hand"){
    if(!wasDragging&&!zoomOpen){act({t:"HC",i:savedCard});}
    else if(wasDragging){
      const p2=p; // reuse p
      // For spells, try proximity-first then elementFromPoint
      const card=GAME&&GAME.player.hand[savedCard];
      if(card&&card.type!=="minion"&&(card.effect==="dmg"||card.effect==="drain")){
        const closest=findClosestTarget(p2.x,p2.y);
        if(closest&&closest.dist<READY*1.4){
          const em=closest.el.closest(".em"),eh=closest.el.id==="eh"?closest.el:null;
          if(em){GAME={...GAME,selCard:savedCard,mode:"targeting"};act({t:"EM",i:+em.dataset.ei});return;}
          if(eh){GAME={...GAME,selCard:savedCard,mode:"targeting"};act({t:"EH"});return;}
        }
      }
      const el=document.elementFromPoint(p.x,p.y);
      if(el)handleHandDrop(savedCard,savedSlot,el);
    }
  } else if(type==="board"){
    if(!wasDragging){act({t:"OM",i:savedBoard});}
    else{
      // Proximity-first for board attacks
      const closest=findClosestTarget(p.x,p.y);
      if(closest&&closest.dist<READY*1.4){
        const em=closest.el.closest(".em"),eh=closest.el.id==="eh"?closest.el:null;
        if(em){act({t:"BOARD_ATK",bi:savedBoard,tw:"ai",ti:+em.dataset.ei});return;}
        if(eh){act({t:"BOARD_ATK",bi:savedBoard,tw:"ai",ti:-1});return;}
      }
      const el=document.elementFromPoint(p.x,p.y);
      if(el){
        const em=el.closest(".em"),eh=el.closest("#eh");
        if(em)act({t:"BOARD_ATK",bi:savedBoard,tw:"ai",ti:+em.dataset.ei});
        else if(eh)act({t:"BOARD_ATK",bi:savedBoard,tw:"ai",ti:-1});
      }
    }
  }
}

function clearDropHi(){document.querySelectorAll(".drop-hi").forEach(e=>e.classList.remove("drop-hi"));}

function getInsertSlot(cx){
  const pb=document.getElementById("pb");if(!pb||!GAME)return 0;
  const oms=Array.from(pb.querySelectorAll(".om"));
  let slot=oms.length;
  for(let i=0;i<oms.length;i++){const r=oms[i].getBoundingClientRect();if(cx<r.left+r.width/2){slot=i;break;}}
  return slot;
}

function updateBoardSlots(insertSlot){
  const pb=document.getElementById("pb");if(!pb||!GAME)return;
  const pl=GAME.player;let h="";
  if(!pl.board.length){
    h=insertSlot!=null?`<div class="board-slot-ghost"></div>`:`<div style="color:#1a1a1a;font-size:11px;letter-spacing:3px">你的戰場</div>`;
  } else {
    for(let i=0;i<=pl.board.length;i++){
      if(insertSlot===i)h+=`<div class="board-slot-ghost"></div>`;
      if(i<pl.board.length){const m=pl.board[i];h+=`<div class="om" data-oi="${i}">${hMinion(m,GAME.selAtk===i,false)}</div>`;}
    }
  }
  pb.innerHTML=h;
}

// ── PROXIMITY ARROW ───────────────────
let arrowEl=null;
const PROX=130, READY=72;
function updateProximityArrow(fx,fy){
  const targets=[];
  if(drag.type==="hand"){
    const card=GAME&&GAME.player.hand[drag.cardIdx];
    if(!card||card.type==="minion"||(card.effect!=="dmg"&&card.effect!=="drain"))return;
    document.querySelectorAll(".em").forEach(em=>{const r=em.getBoundingClientRect();targets.push({el:em,x:r.left+r.width/2,y:r.top+r.height/2});});
    const eh=document.getElementById("eh");if(eh){const r=eh.getBoundingClientRect();targets.push({el:eh,x:r.left+r.width/2,y:r.top+r.height/2});}
  } else if(drag.type==="board"){
    document.querySelectorAll(".em").forEach(em=>{const r=em.getBoundingClientRect();targets.push({el:em,x:r.left+r.width/2,y:r.top+r.height/2});});
    const eh=document.getElementById("eh");if(eh){const r=eh.getBoundingClientRect();targets.push({el:eh,x:r.left+r.width/2,y:r.top+r.height/2});}
  }
  // Clear old ready states
  document.querySelectorAll(".drop-ready").forEach(e=>e.classList.remove("drop-ready"));
  const near=targets.filter(t=>{t.dist=Math.sqrt((t.x-fx)**2+(t.y-fy)**2);return t.dist<PROX;});
  if(!near.length){hideArrow();return;}
  if(!arrowEl){arrowEl=document.createElement("div");arrowEl.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:997";document.body.appendChild(arrowEl);}
  let paths="";
  near.forEach(to=>{
    const{x:tx,y:ty,dist}=to;
    const isReady=dist<READY;
    if(isReady) to.el.classList.add("drop-ready");
    const gradId=`g${Math.round(tx)}${Math.round(ty)}`;
    const c1=isReady?"rgba(255,165,50,0.4)":"rgba(160,65,15,0.35)";
    const c2=isReady?"rgba(255,175,60,1)":"rgba(210,90,25,0.92)";
    const cx=(fx+tx)/2-((ty-fy)*0.18),cy=(fy+ty)/2+((tx-fx)*0.18);
    paths+=`<defs><linearGradient id="${gradId}" x1="${fx}" y1="${fy}" x2="${tx}" y2="${ty}" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="${c1}"/>
      <stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>`;
    paths+=`<path d="M${fx},${fy} Q${cx},${cy} ${tx},${ty}" stroke="url(#${gradId})" stroke-width="${isReady?4.5:3.5}" fill="none" stroke-linecap="round" marker-end="url(#ah)"/>`;
    if(isReady) paths+=`<circle cx="${tx}" cy="${ty}" r="26" fill="rgba(255,165,50,.12)" stroke="rgba(255,165,50,.6)" stroke-width="2"/>`;
  });
  arrowEl.innerHTML=`<svg width="100%" height="100%" overflow="visible" style="position:absolute;inset:0"><defs><marker id="ah" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="${near.some(t=>t.dist<READY)?"rgba(255,175,60,1)":"rgba(200,85,20,.95)"}"/></marker></defs>${paths}</svg>`;
}
function hideArrow(){
  document.querySelectorAll(".drop-ready").forEach(e=>e.classList.remove("drop-ready"));
  if(arrowEl){arrowEl.remove();arrowEl=null;}
}

function findClosestTarget(fx,fy){
  const targets=[];
  document.querySelectorAll(".em").forEach(em=>{const r=em.getBoundingClientRect();targets.push({el:em,x:r.left+r.width/2,y:r.top+r.height/2});});
  const eh=document.getElementById("eh");if(eh){const r=eh.getBoundingClientRect();targets.push({el:eh,x:r.left+r.width/2,y:r.top+r.height/2});}
  let best=null,minD=Infinity;
  targets.forEach(t=>{const d=Math.sqrt((t.x-fx)**2+(t.y-fy)**2);if(d<minD){minD=d;best={...t,dist:d};}});
  return best;
}

function handleHandDrop(cardIdx,insertSlot,el){
  if(!GAME||GAME.turn!=="player")return;
  const card=GAME.player.hand[cardIdx];if(!card||card.cost>GAME.player.mana)return;
  if(card.type==="minion"){
    if(el.closest("#pb")||el.closest(".board-slot-ghost"))
      act({t:"HC_AT",i:cardIdx,slot:insertSlot!=null?insertSlot:GAME.player.board.length});
  } else if(card.effect==="heal"||card.effect==="draw"){act({t:"HC",i:cardIdx});}
  else{
    const em=el.closest(".em"),eh=el.closest("#eh");
    if(em){GAME={...GAME,selCard:cardIdx,mode:"targeting"};act({t:"EM",i:+em.dataset.ei});}
    else if(eh){GAME={...GAME,selCard:cardIdx,mode:"targeting"};act({t:"EH"});}
  }
}

// ── ZOOM OVERLAY ──────────────────────
function showZoom(cardIdx){
  if(!GAME)return;
  const card=GAME.player.hand[cardIdx];
  if(!card)return;
  hideZoom();
  const ov=document.createElement("div");
  ov.id="zoom-overlay";
  ov.innerHTML=hCard(card,false,false,false);
  ov.onclick=()=>hideZoom();
  document.body.appendChild(ov);
}
function hideZoom(){const z=document.getElementById("zoom-overlay");if(z)z.remove();}

// ── TOAST SYSTEM ──────────────────────
function toast(msg, type='warn'){
  const old=document.getElementById('sc-toast');if(old)old.remove();
  const el=document.createElement('div');
  el.id='sc-toast';el.className=type;el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{if(document.getElementById('sc-toast')===el)el.remove();},2000);
}

// ── DISPATCH ──────────────────────────
function act(a){
  if(!GAME||GAME.over||GAME.turn!=="player")return;
  const g=GAME;
  if(a.t==="HC"){
    const card=g.player.hand[a.i];
    if(!card){return;}
    if(card.cost>g.player.mana){toast("魔力不足！","err");return;}
    if(card.type==="minion"){
      if(g.player.board.length>=7){toast("戰場已滿！","err");return;}
      GAME={...playM(g,a.i,"player"),selCard:null,selAtk:null,mode:"default"};
    } else if(card.effect==="heal"||card.effect==="draw"){
      GAME={...castS(g,a.i,"player","player",-1),selCard:null,selAtk:null,mode:"default"};
    } else{
      GAME=g.selCard===a.i?{...g,selCard:null,mode:"default"}:{...g,selCard:a.i,mode:"targeting",selAtk:null};
    }
  }else if(a.t==="OM"){
    if(g.mode==="targeting"){GAME={...g,selCard:null,mode:"default"};}
    else{
      const m=g.player.board[a.i];
      if(!m)return;
      if(m.sick){toast("召喚後不能立即攻擊","warn");return;}
      if(m.attacked){toast("此隨從本回合已行動","warn");return;}
      GAME=g.selAtk===a.i?{...g,selAtk:null,mode:"default"}:{...g,selAtk:a.i,mode:"attacking",selCard:null};
    }
  }else if(a.t==="EM"){
    if(g.mode==="targeting"&&g.selCard!=null){GAME={...castS(g,g.selCard,"player","ai",a.i),selCard:null,selAtk:null,mode:"default"};}
    else if(g.mode==="attacking"&&g.selAtk!=null){GAME={...atkF(g,"player",g.selAtk,"ai",a.i),selAtk:null,mode:"default"};}
  }else if(a.t==="EH"){
    if(g.mode==="targeting"&&g.selCard!=null){GAME={...castS(g,g.selCard,"player","ai",-1),selCard:null,selAtk:null,mode:"default"};}
    else if(g.mode==="attacking"&&g.selAtk!=null){GAME={...atkF(g,"player",g.selAtk,"ai",-1),selAtk:null,mode:"default"};}
  }else if(a.t==="HC_AT"){
    const card=g.player.hand[a.i];if(!card){return;}
    if(card.cost>g.player.mana){toast("魔力不足！","err");return;}
    if(card.type!=="minion")return;
    if(g.player.board.length>=7){toast("戰場已滿！","err");return;}
    const slot=Math.min(Math.max(0,a.slot??g.player.board.length),g.player.board.length);
    const minion={...card,uid:uid(),curHp:card.hp,sick:true,attacked:false};
    const board=[...g.player.board];board.splice(slot,0,minion);
    GAME={...alog({...g,player:{...g.player,mana:g.player.mana-card.cost,hand:g.player.hand.filter((_,i)=>i!==a.i),board}},`⚔️ 你召：${card.name}`),selCard:null,selAtk:null,mode:"default"};
  }else if(a.t==="BOARD_ATK"){
    const m=g.player.board[a.bi];
    if(m&&m.sick){toast("召喚後不能立即攻擊","warn");return;}
    if(m&&m.attacked){toast("此隨從本回合已行動","warn");return;}
    GAME={...atkF(g,"player",a.bi,a.tw,a.ti),selAtk:null,mode:"default"};
  }else if(a.t==="CL"){GAME={...g,selCard:null,selAtk:null,mode:"default"};
  }else if(a.t==="ET"){GAME=startT({...g,selCard:null,selAtk:null,mode:"default"},"ai");}
  render();
}

// ── ROUTER ────────────────────────────
const R=()=>document.getElementById("root");
let _lastTurn=null;
function render(){
  if(SCR==="menu")showMenu();
  else if(SCR==="deck")showDeck();
  else if(SCR==="battle"&&GAME)showBattle();
  // Turn-start toast
  if(GAME&&!GAME.over&&GAME.turn==="player"&&_lastTurn!=="player"){
    setTimeout(()=>toast("你的回合！","ok"),120);
  }
  _lastTurn=GAME?.turn??null;
  // Clear draw-anim flags after animation plays
  if(GAME&&(GAME.lastDrawnUid||GAME.aiNewCard)){
    setTimeout(()=>{if(GAME)GAME={...GAME,lastDrawnUid:null,aiNewCard:false};},520);
  }
}
try{render();}catch(e){R().innerHTML=`<div style="color:#f66;padding:30px;font-family:monospace;background:#111;min-height:100vh"><b>ERROR:</b><br><br>${e.stack.replace(/\n/g,"<br>")}</div>`;}
</script>
