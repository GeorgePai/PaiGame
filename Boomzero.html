<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>彈彈堂 · ZERO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#030303;--border:#1a1a1a;--dim:#555;--hi:#fff;--faint:#111;
  --btn-bg:#0d0d0d;--btn-border:#2a2a2a;--btn-active:#222;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'Share Tech Mono','Courier New',monospace;}
#wrap{
  display:flex;flex-direction:column;
  width:100%;height:100%;
  max-width:900px;margin:0 auto;
  background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border);
}

/* ── HUD ─────────────────────────────────────────── */
#hud{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px;border-bottom:1px solid var(--border);
  min-height:46px;gap:4px;
}
.fighter{display:flex;align-items:center;gap:6px;min-width:0;flex:1;}
.fighter.right{flex-direction:row-reverse;}
.fname{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(11px,2.5vw,16px);letter-spacing:3px;color:var(--hi);
  white-space:nowrap;
}
.bars{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;max-width:160px;}
.bar-row{display:flex;align-items:center;gap:4px;width:100%;}
.bar-track{flex:1;height:5px;background:var(--faint);min-width:50px;max-width:120px;}
.bar-fill{height:100%;background:var(--hi);transition:width .25s ease;}
.bar-fill.sta{background:var(--dim);}
.bar-num{font-size:clamp(8px,1.8vw,10px);color:var(--dim);letter-spacing:1px;white-space:nowrap;}
#turn-box{
  text-align:center;flex:0 0 auto;
  font-family:'Bebas Neue',sans-serif;
}
#turn-who{font-size:clamp(9px,2vw,13px);letter-spacing:3px;color:var(--dim);}
#round-num{font-size:clamp(14px,3vw,20px);letter-spacing:2px;color:var(--hi);line-height:1;}

/* ── VIEWPORT ─────────────────────────────────────── */
#vp{
  flex:1 1 0;position:relative;overflow:hidden;
  cursor:crosshair;background:#000;
  touch-action:none;
  display:flex;align-items:center;justify-content:center;
}
/* Canvas keeps 900:380 ratio - never distorts */
#gc{
  display:block;width:100%;height:auto;
  aspect-ratio:900/380;max-height:100%;
}
#overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:auto;
  font-family:'Bebas Neue',sans-serif;font-size:clamp(16px,4vw,26px);
  letter-spacing:6px;color:var(--hi);text-align:center;line-height:1.6;
  text-shadow:0 0 20px rgba(255,255,255,.5);
  cursor:pointer;background:rgba(0,0,0,.4);
}
#plane-hint{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:3px;color:var(--dim);
  background:rgba(0,0,0,.7);padding:4px 10px;
  pointer-events:none;
}

/* ── CONTROLS ─────────────────────────────────────── */
#ctrl{
  flex:0 0 auto;
  display:flex;flex-direction:column;
  border-top:1px solid var(--border);
  padding:6px 8px;gap:5px;
}
#ctrl-top{display:flex;align-items:center;gap:5px;}
#ctrl-bot{display:flex;align-items:center;gap:6px;}

.btn{
  background:var(--btn-bg);border:1px solid var(--btn-border);
  color:var(--hi);cursor:pointer;
  font-family:'Share Tech Mono',monospace;
  font-size:clamp(9px,2vw,12px);
  letter-spacing:1px;
  border-radius:2px;
  touch-action:none;user-select:none;
  -webkit-user-select:none;-webkit-touch-callout:none;
  box-shadow:0 3px 0 #000, 0 1px 0 rgba(255,255,255,0.08) inset;
  border-bottom-width:2px;
  transform:translateY(0);
  transition:background .08s, transform .06s, box-shadow .06s;
  transition:background .08s;
  display:flex;align-items:center;justify-content:center;
}
.btn:active,.btn.held{background:var(--btn-active);transform:translateY(2px);box-shadow:0 1px 0 #000;}

.bsm{width:clamp(44px,10vw,60px);height:clamp(38px,7vh,48px);}
.blg{
  width:clamp(82px,20vw,112px);height:clamp(56px,10vh,68px);
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(14px,3.2vw,20px);letter-spacing:4px;
  border-color:var(--dim);
}
.blg:active,.blg.held{
  background:#111;
  box-shadow:0 0 10px rgba(255,255,255,.15);
}

/* ang-ctrl handled in controls section */
#ang-disp{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(16px,3.5vw,22px);
  color:var(--hi);letter-spacing:2px;
  min-width:48px;text-align:center;
}

/* power bar */
#pwr-track{
  flex:1;position:relative;
  height:clamp(26px,5vh,34px);
  background:#060606;
  border:1px solid #252525;
  overflow:hidden;
}
#pwr-ghost{
  position:absolute;left:0;top:0;height:100%;width:0%;
  background:rgba(255,255,255,.13);
  border-right:2px solid rgba(255,255,255,.35);
  transition:none;z-index:1;
}
#pwr-fill{
  position:absolute;left:0;top:0;height:100%;width:0%;
  background:var(--hi);transition:none;z-index:2;
}
/* SVG tick overlay injected by JS */
#pwr-ticks{
  position:absolute;inset:0;z-index:3;pointer-events:none;
}
#pwr-pct{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(11px,2.5vw,15px);
  color:rgba(255,255,255,.75);
  mix-blend-mode:difference;
  z-index:4;pointer-events:none;
  letter-spacing:1px;
}
/* controls centering */
#ctrl-top{display:flex;align-items:center;gap:5px;justify-content:center;}
#ctrl-bot{display:flex;align-items:center;gap:8px;justify-content:center;}
#ang-ctrl{display:flex;align-items:center;gap:5px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="fighter" id="hud-p">
      <div class="fname">P1</div>
      <div class="bars">
        <div class="bar-row">
          <div class="bar-track"><div class="bar-fill" id="php"></div></div>
          <span class="bar-num" id="php-n">100</span>
        </div>
        <div class="bar-row">
          <div class="bar-track"><div class="bar-fill sta" id="pst"></div></div>
        </div>
      </div>
    </div>
    <div id="turn-box">
      <div id="turn-who">P1 TURN</div>
      <div id="round-num">R·1</div>
    </div>
    <div class="fighter right" id="hud-e">
      <div class="fname">CPU</div>
      <div class="bars">
        <div class="bar-row">
          <span class="bar-num" id="ehp-n">100</span>
          <div class="bar-track"><div class="bar-fill" id="ehp"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-track"><div class="bar-fill sta" id="est"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="vp">
    <canvas id="gc"></canvas>
    <div id="overlay">CLICK OR TAP TO START</div>
  </div>

  <div id="ctrl">
    <div id="ctrl-top">
      <button class="btn bsm" id="btn-ml">◀◀</button>
      <div id="ang-ctrl">
        <button class="btn bsm" id="btn-am">−°</button>
        <span id="ang-disp">45°</span>
        <button class="btn bsm" id="btn-ap">+°</button>
      </div>
      <button class="btn bsm" id="btn-mr">▶▶</button>
      <button class="btn bsm" id="btn-wpn" title="Switch Weapon" style="min-width:52px">⬡ WPN</button>
    </div>
    <div id="ctrl-bot">
      <div id="pwr-track">
        <div id="pwr-ghost"></div>
        <div id="pwr-fill"></div>
        <svg id="pwr-ticks" preserveAspectRatio="none"></svg>
        <span id="pwr-pct">0%</span>
      </div>
      <button class="btn blg" id="btn-fire">FIRE</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ════════════════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════════════════
const WW = 2000;          // world pixel width
const WH = 380;           // world pixel height (logical)
const VW = 900;           // canvas logical width
const CR = 15;            // character radius
const GROUND_Y = 305;     // flat ground top
const MAX_V = 14;         // max projectile speed
const GRAV = 0.11;        // gravity per frame

// ════════════════════════════════════════════════════
// AUDIO
// ════════════════════════════════════════════════════
let AC = null, audioReady = false;
let chargeOsc = null, chargeGain = null;

function initAudio() {
  if (audioReady) return;
  audioReady = true;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  startBGM();
}

// --- BGM: lookahead scheduler, no stutter ---
const BGM = {
  nextStart: 0,
  loopDur: 0,
  masterGain: null,

  init() {
    const ac = AC;
    this.masterGain = ac.createGain();
    this.masterGain.gain.value = 0.10;
    this.masterGain.connect(ac.destination);
    const BPM = 72, beat = 60 / BPM;
    const N = {
      C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,
      C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,
      C3:130.81,F3:174.61,G3:196,A3:220,E3:164.81,D3:146.83
    };
    // Slow, atmospheric melody
    const mel = [
      [N.C5,2],[N.E5,1],[N.G5,1],
      [N.A5,2],[N.G5,2],
      [N.F5,2],[N.E5,1],[N.D5,1],
      [N.C5,4],
      [N.G4,2],[N.B4,1],[N.D5,1],
      [N.E5,2],[N.D5,2],
      [N.C5,1],[N.E5,1],[N.G5,1],[N.C5,1],
      [N.G4,4],
    ];
    const bass = [
      [N.C3,2],[N.C3,2],
      [N.A3,2],[N.A3,2],
      [N.F3,2],[N.F3,2],
      [N.G3,2],[N.G3,2],
      [N.C3,2],[N.C3,2],
      [N.E3,2],[N.G3,2],
      [N.F3,2],[N.C3,2],
      [N.G3,2],[N.G3,2],
    ];
    this.melNotes = mel.map(([f,d])=>({f,d:d*beat}));
    this.bassNotes = bass.map(([f,d])=>({f,d:d*beat}));
    this.loopDur = mel.reduce((s,[,d])=>s+d*beat,0);
    this.nextStart = ac.currentTime + 0.05;
  },

  playNotes(notes, type, gain, t0) {
    const ac = AC, mg = this.masterGain;
    let t = t0;
    for (const n of notes) {
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = type; osc.frequency.value = n.f;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + n.d * 0.82);
      osc.connect(g); g.connect(mg);
      osc.start(t); osc.stop(t + n.d);
      t += n.d;
    }
  },

  playDrums(t0) {
    const ac = AC, mg = this.masterGain;
    const beats = this.melNotes.reduce((s,n)=>s+n.d,0);
    const beatLen = beats / this.melNotes.reduce((s,n)=>s+1,0) *
      (this.melNotes.reduce((s,n)=>s+1,0)/this.loopDur*60/72); // approx beat dur
    const bd = 60/72;
    const totalBeats = Math.round(this.loopDur / bd);
    for (let b = 0; b < totalBeats; b++) {
      const t = t0 + b * bd;
      // Kick on 1,3
      if (b % 4 === 0 || b % 4 === 2) {
        const buf = ac.createBuffer(1, Math.floor(ac.sampleRate*0.18), ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*.04));
        const s=ac.createBufferSource(); s.buffer=buf;
        const g=ac.createGain(); g.gain.value=0.45;
        const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
        s.connect(f); f.connect(g); g.connect(mg);
        s.start(t); s.stop(t+0.18);
      }
      // Hihat every half beat
      const hh = (offset) => {
        const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*.05),ac.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*.015));
        const s=ac.createBufferSource(); s.buffer=buf;
        const g=ac.createGain(); g.gain.value=0.12;
        const ff=ac.createBiquadFilter(); ff.type='highpass'; ff.frequency.value=7000;
        s.connect(ff); ff.connect(g); g.connect(mg);
        s.start(t+offset); s.stop(t+offset+.05);
      };
      hh(0); hh(bd*0.5);
    }
  },

  tick() {
    if (!AC) return;
    const now = AC.currentTime;
    while (this.nextStart < now + 0.25) {
      if (this.nextStart < now) this.nextStart = now + 0.01;
      this.playNotes(this.melNotes, 'square', 0.32, this.nextStart);
      this.playNotes(this.bassNotes, 'triangle', 0.22, this.nextStart);
      this.playDrums(this.nextStart);
      this.nextStart += this.loopDur;
    }
  }
};

function startBGM() { BGM.init(); }

// SFX
function sfx(type) {
  if (!AC) return;
  try {
    const ac = AC;
    const dst = ac.destination;
    switch(type) {
      case 'shoot': {
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='sawtooth';
        o.frequency.setValueAtTime(600,ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(90,ac.currentTime+.15);
        g.gain.setValueAtTime(.35,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.15);
        o.connect(g);g.connect(dst);o.start();o.stop(ac.currentTime+.15);
        break;
      }
      case 'explode': {
        const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*.5),ac.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*.07));
        const s=ac.createBufferSource();s.buffer=buf;
        const g=ac.createGain();g.gain.value=.65;
        const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
        s.connect(f);f.connect(g);g.connect(dst);s.start();s.stop(ac.currentTime+.5);
        break;
      }
      case 'hit': {
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='square';
        o.frequency.setValueAtTime(280,ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(50,ac.currentTime+.18);
        g.gain.setValueAtTime(.38,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);
        o.connect(g);g.connect(dst);o.start();o.stop(ac.currentTime+.18);
        break;
      }
      case 'crit': {
        [0,.07,.14].forEach((del,i)=>{
          const o=ac.createOscillator(),g=ac.createGain();
          o.type='square';o.frequency.value=523.25*Math.pow(1.26,i);
          const t=ac.currentTime+del;
          g.gain.setValueAtTime(.28,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
          o.connect(g);g.connect(dst);o.start(t);o.stop(t+.16);
        });
        break;
      }
      case 'death': {
        [480,380,280,180,100].forEach((f,i)=>{
          const o=ac.createOscillator(),g=ac.createGain();
          o.type='sawtooth';o.frequency.value=f;
          const t=ac.currentTime+i*.09;
          g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
          o.connect(g);g.connect(dst);o.start(t);o.stop(t+.18);
        });
        break;
      }
      case 'land': {
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='triangle';o.frequency.value=110;
        g.gain.setValueAtTime(.28,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.1);
        o.connect(g);g.connect(dst);o.start();o.stop(ac.currentTime+.1);
        break;
      }
      case 'plane': {
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(280,ac.currentTime);
        o.frequency.linearRampToValueAtTime(850,ac.currentTime+.4);
        g.gain.setValueAtTime(.18,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.45);
        o.connect(g);g.connect(dst);o.start();o.stop(ac.currentTime+.45);
        break;
      }
      case 'tick': {
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='sine';o.frequency.value=1200;
        g.gain.setValueAtTime(.05,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.03);
        o.connect(g);g.connect(dst);o.start();o.stop(ac.currentTime+.03);
        break;
      }
      case 'move': {
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='sine';o.frequency.value=600;
        g.gain.setValueAtTime(.04,ac.currentTime);
        g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.06);
        o.connect(g);g.connect(dst);o.start();o.stop(ac.currentTime+.06);
        break;
      }
    }
  } catch(e) {}
}

// ════════════════════════════════════════════════════
// TERRAIN
// ════════════════════════════════════════════════════
let tCanvas, tCtx, tData;

function initTerrain() {
  tCanvas = document.createElement('canvas');
  tCanvas.width = WW; tCanvas.height = WH;
  tCtx = tCanvas.getContext('2d');
  buildFlatTerrain();
}

function buildFlatTerrain() {
  tCtx.clearRect(0,0,WW,WH);
  // Flat ground fill
  // Green ground with darker border
  tCtx.fillStyle = '#3a7d3a';
  tCtx.fillRect(0, GROUND_Y, WW, WH - GROUND_Y);
  tCtx.fillStyle = '#2d5e2d';
  tCtx.fillRect(0, GROUND_Y, WW, 8);
  syncTerrain();
}

function syncTerrain() {
  tData = tCtx.getImageData(0,0,WW,WH).data;
}

function isSolid(x, y) {
  const xi = Math.round(x), yi = Math.round(y);
  if (xi < 0 || xi >= WW || yi < 0 || yi >= WH) return false;
  return tData[(yi * WW + xi) * 4 + 3] > 64;
}

// Check if character circle at (x,y) with radius r is fully clear
function isCharClear(x, y, r) {
  r = r || CR - 2;
  const pts = [
    [x, y],
    [x-r, y],[x+r, y],[x, y-r],[x, y+r],
    [x-r*.7, y-r*.7],[x+r*.7, y-r*.7],
    [x-r*.7, y+r*.7],[x+r*.7, y+r*.7],
  ];
  for (const [px,py] of pts) if (isSolid(px,py)) return false;
  return true;
}

function destroyTerrain(cx, cy, radius) {
  tCtx.save();
  tCtx.globalCompositeOperation = 'destination-out';
  const grad = tCtx.createRadialGradient(cx,cy,radius*.35,cx,cy,radius);
  grad.addColorStop(0,'rgba(0,0,0,1)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  tCtx.fillStyle = grad;
  tCtx.beginPath();
  tCtx.arc(cx,cy,radius,0,Math.PI*2);
  tCtx.fill();
  tCtx.restore();
  syncTerrain();
}

function surfaceY(wx) {
  const x=Math.max(0,Math.min(WW-1,Math.round(wx)));
  // Start near ground to avoid scanning 300+ empty rows
  for (let y=Math.max(0,GROUND_Y-15);y<WH;y++) {
    if (tData[(y*WW+x)*4+3]>64) return y;
  }
  return WH;
}

// ════════════════════════════════════════════════════
// WEAPONS
// ════════════════════════════════════════════════════
const WEAPONS = [
  {name:'CANNON', sym:'●', atk:60, def:22, agi:40, dex:45, critRate:.10, critDmg:1.5, projR:5, explR:55},
  {name:'SNIPER', sym:'▲', atk:95, def:0,  agi:80, dex:18, critRate:.28, critDmg:2.2, projR:3, explR:25},
  {name:'BOMBER', sym:'◆', atk:45, def:0,  agi:18, dex:95, critRate:.06, critDmg:1.3, projR:8, explR:95},
];

// ════════════════════════════════════════════════════
// GAME STATE
// ════════════════════════════════════════════════════
const G = {
  phase: 'start', // start|player|ai_think|ai_fire|projectile|post|plane|over
  turn: 0,
  camX: 0,
  player: null, enemy: null, proj: null,
  particles: [], texts: [],
  screenShake: 0,
  charging: false, chargeT: 0, power: 0,
  aiTimer: 0, aiShot: null,
  postTimer: 0,
  whoFired: null,
  // camera drag
  dragStart: null, dragCamX: 0, dragMoved: false,
};

// ════════════════════════════════════════════════════
// CHARACTER
// ════════════════════════════════════════════════════
function mkChar(x, y, isPlayer) {
  return {
    x, y, vy: 0,
    hp:100, mhp:100,
    sta:100, msta:100,
    angle: isPlayer ? 45 : 135,
    facing: isPlayer ? 1 : -1,
    wpnIdx:0,
    weapon:{...WEAPONS[0]},
    alive:true, isPlayer,
    flashTimer:0,
  };
}

// ════════════════════════════════════════════════════
// MOVEMENT & PHYSICS
// ════════════════════════════════════════════════════
function tryMoveChar(c, dir) {
  const step = 1.2;
  const newX = Math.max(CR+1, Math.min(WW-CR-1, c.x + dir*step));

  // Try at current height, then step up (to climb crater walls)
  for (let up = 0; up <= 14; up++) {
    if (isCharClear(newX, c.y - up)) {
      c.x = newX;
      c.y -= up;
      c.facing = dir;
      // Snap down (to descend into craters / follow slope)
      for (let dn = 1; dn <= 12; dn++) {
        if (!isCharClear(c.x, c.y + dn)) {
          c.y += dn - 1;
          break;
        }
        if (dn === 12) {
          // Floating - will fall via gravity, leave as is
        }
      }
      return true;
    }
  }
  return false;
}

function charGravity(c) {
  if (!c.alive) return false;
  // Grounded check
  let grounded = false;
  for (let dx = -CR*.5; dx <= CR*.5; dx += 4) {
    if (isSolid(c.x+dx, c.y+CR+1)) { grounded=true; break; }
  }
  if (grounded) {
    c.vy = 0;
    // Push up if inside terrain
    let safety = 0;
    while (isSolid(c.x, c.y+CR) && safety++ < 20) c.y--;
    return false;
  }
  c.vy = Math.min(c.vy + GRAV, 12);
  c.y += c.vy;
  // Landing check
  for (let dx=-CR*.5; dx<=CR*.5; dx+=4) {
    if (isSolid(c.x+dx, c.y+CR)) {
      while (isSolid(c.x, c.y+CR) && c.y > 20) c.y--;
      c.vy = 0;
      sfx('land');
      return false;
    }
  }
  // Fell off world
  if (c.y > WH + 60) {
    c.alive = false;
    sfx('death');
    spawnText(c.x, 180, 'FALLEN', '#fff', 20);
  }
  return true;
}

// ════════════════════════════════════════════════════
// DAMAGE
// ════════════════════════════════════════════════════
function calcDmg(att, def, falloff) {
  const w = att.weapon;
  let dmg = w.atk * falloff;
  const defRed = def.weapon.def / (def.weapon.def + 130);
  dmg *= (1 - defRed * .55);
  const isCrit = Math.random() < w.critRate;
  if (isCrit) dmg *= w.critDmg;
  return {dmg: Math.max(1, Math.round(dmg)), isCrit};
}

// ════════════════════════════════════════════════════
// PROJECTILE
// ════════════════════════════════════════════════════
function mkProj(c, power) {
  const rad = c.angle * Math.PI / 180;
  const spd = power * MAX_V;
  return {
    x: c.x + Math.cos(rad)*(CR+5),
    y: c.y - Math.sin(rad)*(CR+5),
    vx: Math.cos(rad)*spd,
    vy: -Math.sin(rad)*spd,
    weapon: {...c.weapon},
    owner: c,
    trail: [],
  };
}

function stepProj(p) {
  p.trail.push({x:p.x, y:p.y});
  if (p.trail.length > 22) p.trail.shift();
  p.vy += GRAV;
  p.x += p.vx;
  p.y += p.vy;

  if (p.x < -80 || p.x > WW+80 || p.y > WH+80) return 'oob';
  if (p.y >= 0 && isSolid(p.x, p.y)) return 'terrain';

  const targets = [G.player, G.enemy].filter(c => c?.alive && c !== p.owner);
  for (const t of targets) {
    if (Math.hypot(t.x-p.x, t.y-p.y) < CR + p.weapon.projR) return {hit:t};
  }
  return null;
}

// ════════════════════════════════════════════════════
// EXPLOSION
// ════════════════════════════════════════════════════
function doExplosion(px, py, proj) {
  sfx('explode');
  const w = proj.weapon;
  const dexR = w.explR * (.5 + w.dex/200);
  destroyTerrain(px, py, dexR);
  spawnParticles(px, py, w.explR);
  G.screenShake = 14;

  const targets = [G.player, G.enemy].filter(c => c?.alive && c !== proj.owner);
  for (const t of targets) {
    const dist = Math.hypot(t.x-px, t.y-py);
    if (dist < w.explR + CR) {
      const falloff = Math.max(0, 1-(dist-CR)/w.explR);
      const {dmg, isCrit} = calcDmg(proj.owner, t, falloff);
      t.hp = Math.max(0, t.hp-dmg);
      t.flashTimer = 20;
      const kdir = Math.atan2(t.y-py, t.x-px);
      t.x = Math.max(CR+1, Math.min(WW-CR-1, t.x+Math.cos(kdir)*5));
      sfx(isCrit?'crit':'hit');
      spawnText(t.x, t.y-CR-16, isCrit?`!! ${dmg}`:`-${dmg}`, '#fff', isCrit?22:15);
      if (t.hp <= 0) { t.alive=false; sfx('death'); spawnText(t.x, t.y-45,'K . O .','#fff',24); }
    }
  }
  updateHUD();
}

// ════════════════════════════════════════════════════
// PARTICLES
// ════════════════════════════════════════════════════
function spawnParticles(cx, cy, r) {
  const n = Math.floor(r*.7);
  for (let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, s=Math.random()*4+1;
    G.particles.push({type:'dot',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.2,
      life:1,decay:.022+Math.random()*.025,sz:Math.random()*3+1.5});
  }
  G.particles.push({type:'ring',x:cx,y:cy,r:5,maxR:r*1.5,life:1,decay:.05});
  for (let i=0;i<8;i++) {
    const a=Math.random()*Math.PI*2, s=Math.random()*5+2;
    G.particles.push({type:'line',x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,
      life:1,decay:.038+Math.random()*.025,len:Math.random()*10+4});
  }
}

function spawnText(x, y, txt, col, sz) {
  G.texts.push({x,y,txt,col,sz,vy:-1.5,life:1,decay:.02});
}

function tickParticles() {
  G.particles = G.particles.filter(p => {
    p.life -= p.decay;
    if (p.type==='dot'){p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.vx*=.97;}
    if (p.type==='ring'){p.r+=(p.maxR-p.r)*.15;}
    if (p.type==='line'){p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.vx*=.96;}
    return p.life>0;
  });
  G.texts=G.texts.filter(t=>{t.life-=t.decay;t.y+=t.vy;t.vy*=.93;return t.life>0;});
}

// ════════════════════════════════════════════════════
// CAMERA
// ════════════════════════════════════════════════════
function canvasDispW() { return canvas.getBoundingClientRect().width || VW; }
function camFollow(x) {
  const dw = canvasDispW();
  const scale = dw / VW;
  const visW = VW; // logical viewport width
  G.camX = Math.max(0, Math.min(WW-visW, x-visW/2));
}

// ════════════════════════════════════════════════════
// AI
// ════════════════════════════════════════════════════
function computeAI() {
  const ai=G.enemy, pl=G.player;
  const dx=pl.x-ai.x, dy=ai.y-pl.y;
  let best=null;
  for (let pow=.35;pow<=1.0;pow+=.05) {
    const v=pow*MAX_V;
    const disc=Math.pow(v,4)-GRAV*(GRAV*dx*dx+2*dy*v*v);
    if (disc<0) continue;
    for (const sign of [1,-1]) {
      const a=Math.atan2(v*v+sign*Math.sqrt(disc), GRAV*dx);
      const deg=a*180/Math.PI;
      if (deg>=5&&deg<=175) { best={angle:deg,power:pow}; break; }
    }
    if (best) break;
  }
  if (!best) best={angle:dx<0?125+Math.random()*30:50+Math.random()*25, power:.5+Math.random()*.4};
  best.angle += (Math.random()-.5)*16;
  best.power = Math.max(.2, Math.min(1, best.power+(Math.random()-.5)*.1));
  return best;
}

// ════════════════════════════════════════════════════
// TURN LOGIC
// ════════════════════════════════════════════════════
function startPlayerTurn() {
  G.phase='player';
  G.player.sta=Math.min(G.player.msta, G.player.sta+32);
  document.getElementById('turn-who').textContent='P1 TURN';
  camFollow(G.player.x);
  updateHUD();
}

function startAITurn() {
  G.phase='ai_think';
  G.enemy.sta=Math.min(G.enemy.msta, G.enemy.sta+32);
  G.aiTimer=75;
  G.aiShot=computeAI();
  document.getElementById('turn-who').textContent='CPU TURN';
  document.getElementById('round-num').textContent='R·'+(G.turn+1);
  camFollow(G.enemy.x);
  updateHUD();
}

function checkOver() {
  if (!G.player.alive) { endGame('defeat'); return true; }
  if (!G.enemy.alive)  { endGame('victory'); return true; }
  return false;
}

function endGame(res) {
  G.phase='over';
  const el=document.getElementById('overlay');
  el.style.display='flex';
  if (res==='victory') el.innerHTML='★ VICTORY ★<br><span style="font-size:clamp(9px,2vw,12px);letter-spacing:3px;color:#555">TAP TO RESTART</span>';
  else el.innerHTML='✕ DEFEAT ✕<br><span style="font-size:clamp(9px,2vw,12px);letter-spacing:3px;color:#555">TAP TO RESTART</span>';
}

function updateHUD() {

function updatePowerUI(pow) {

  document.getElementById('pwr-pct').textContent=pct+'%';

let lastTickedAngle=-999;
function setAngle(a) {
  if (!G.player) return;
  G.player.angle=Math.max(1,Math.min(179,a));
  const deg=Math.round(G.player.angle);
  if (deg!==lastTickedAngle) { lastTickedAngle=deg; sfx('tick'); }

function showOverlay(txt, dur) {

// ════════════════════════════════════════════════════
// BUTTON CONTROL STATE
// ════════════════════════════════════════════════════
const BTN={ml:false,mr:false,am:false,ap:false};

function bindHold(id, key) {
  const el=document.getElementById(id);
  const on=(e)=>{e.preventDefault();initAudio();BTN[key]=true;el.classList.add('held');};
  const off=()=>{BTN[key]=false;el.classList.remove('held');};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('pointercancel',off);
}

function bindTap(id, fn) {
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();});
  el.addEventListener('pointerup',e=>{e.preventDefault();fn();});
}

function buildPowerTicks() {
  const svg=document.getElementById('pwr-ticks');
  const NS='http://www.w3.org/2000/svg';
  svg.setAttribute('viewBox','0 0 100 1');
  // Fine ticks every 1%; medium every 5%; major every 10%
  for (let i=1;i<100;i++) {
    const line=document.createElementNS(NS,'line');
    line.setAttribute('x1',i); line.setAttribute('x2',i);
    if (i%10===0) {
      line.setAttribute('y1','0'); line.setAttribute('y2','1');
      line.setAttribute('stroke','rgba(255,255,255,0.7)');
      line.setAttribute('stroke-width','0.55');
    } else if (i%5===0) {
      line.setAttribute('y1','0.35'); line.setAttribute('y2','1');
      line.setAttribute('stroke','rgba(255,255,255,0.5)');
      line.setAttribute('stroke-width','0.4');
    } else {
      line.setAttribute('y1','0.65'); line.setAttribute('y2','1');
      line.setAttribute('stroke','rgba(255,255,255,0.25)');
      line.setAttribute('stroke-width','0.28');
    }
    svg.appendChild(line);
  }
  // Labels at 25 50 75
  [25,50,75].forEach(p=>{
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',p); t.setAttribute('y','0.38');
    t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','0.33');
    t.setAttribute('fill','rgba(255,255,255,0.5)');
    t.setAttribute('font-family','Share Tech Mono,monospace');
    t.textContent=p;
    svg.appendChild(t);
  });
}

function startChargeSound() {
  if (!AC || chargeOsc) return;
  chargeOsc = AC.createOscillator();
  chargeGain = AC.createGain();
  chargeOsc.type = 'sine';
  chargeOsc.frequency.value = 220;
  chargeGain.gain.value = 0;
  chargeOsc.connect(chargeGain);
  chargeGain.connect(AC.destination);
  chargeOsc.start();
}

function updateChargeSound(pow) {
  if (!chargeOsc) return;
  const now = AC.currentTime;
  // pitch: 220Hz (0%) → 880Hz (100%), gain: 0 → 0.18
  chargeOsc.frequency.setTargetAtTime(220 + pow * 660, now, 0.05);
  chargeGain.gain.setTargetAtTime(pow * 0.18, now, 0.04);
}

function stopChargeSound() {
  if (!chargeOsc) return;
  chargeGain.gain.setTargetAtTime(0, AC.currentTime, 0.04);
  chargeOsc.stop(AC.currentTime + 0.1);
  chargeOsc = null; chargeGain = null;
}

function setupControls() {
  buildPowerTicks();
  // Kill long-press context menu on all buttons
  document.querySelectorAll('.btn').forEach(b=>b.addEventListener('contextmenu',e=>e.preventDefault()));

  // Hold buttons
  bindHold('btn-ml','ml');
  bindHold('btn-mr','mr');
  bindHold('btn-am','am');
  bindHold('btn-ap','ap');

  // Fire button
  const btnFire=document.getElementById('btn-fire');
  btnFire.addEventListener('pointerdown',e=>{
    e.preventDefault(); initAudio();
    if (G.phase!=='player') return;
    G.charging=true; G.chargeT=performance.now();
    startChargeSound();
    btnFire.classList.add('held');
  });
  const doFire=()=>{
    if (!G.charging) return;
    G.charging=false;
    stopChargeSound();
    btnFire.classList.remove('held');
    if (G.power>0.04 && G.phase==='player') firePlayer();
    updatePowerUI(0);
  };
  btnFire.addEventListener('pointerup',doFire);
  btnFire.addEventListener('pointercancel',doFire);
  btnFire.addEventListener('pointerleave',doFire);

  // Weapon switch
  bindTap('btn-wpn',()=>{
    if (G.phase!=='player'||!G.player) return;
    const i=(G.player.wpnIdx+1)%WEAPONS.length;
    G.player.wpnIdx=i;
    G.player.weapon={...WEAPONS[i]};
    showOverlay(WEAPONS[i].name,900);
  });


  // Restart on overlay tap (game over)
  document.getElementById('overlay').addEventListener('pointerup',()=>{
    initAudio();
    if (G.phase==='over') { document.getElementById('overlay').style.display='none'; restart(); }
    else if (G.phase==='start') { document.getElementById('overlay').style.display='none'; startPlayerTurn(); }
  });
}

// ════════════════════════════════════════════════════
// CANVAS POINTER (camera drag + plane tap)
// ════════════════════════════════════════════════════
function setupCanvasPointer() {
  const cv=canvas;
  cv.addEventListener('pointerdown',e=>{
    e.preventDefault(); initAudio();
    G.dragStart={x:e.clientX,y:e.clientY};
    G.dragCamX=G.camX;
    G.dragMoved=false;
  });
  cv.addEventListener('pointermove',e=>{
    if (!G.dragStart) return;
    const dx=e.clientX-G.dragStart.x;
    if (Math.abs(dx)>4) G.dragMoved=true;
    if (G.dragMoved) {
      const rect=cv.getBoundingClientRect();
      const scale=VW/rect.width;
      G.camX=Math.max(0,Math.min(WW-VW, G.dragCamX-dx*scale));
    }
  });
  cv.addEventListener('pointerup',e=>{
    G.dragStart=null;
  });
  cv.addEventListener('pointercancel',()=>{G.dragStart=null;});
}

function firePlayer() {
  sfx('shoot');
  // Save ghost reference for next turn
  document.getElementById('pwr-ghost').style.width=(G.power*100)+'%';

// ════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
canvas.width=VW; canvas.height=WH;

function render() {
  ctx.clearRect(0,0,VW,WH);
  const shk=G.screenShake>0?(Math.random()-.5)*G.screenShake*.55:0;
  const cx=Math.round(G.camX);

  ctx.save();
  ctx.translate(-cx+shk, shk*.3);

  // Background
  // Sky gradient
  const skyGrad=ctx.createLinearGradient(0,0,0,WH);
  skyGrad.addColorStop(0,'#1a2a3a');
  skyGrad.addColorStop(0.7,'#2d4a6e');
  skyGrad.addColorStop(1,'#1e3550');
  ctx.fillStyle=skyGrad;
  ctx.fillRect(cx,0,VW,WH);

  // Grid
  ctx.strokeStyle='rgba(255,255,255,.03)';
  ctx.lineWidth=1;
  const gs=50;
  for (let x=Math.floor(cx/gs)*gs;x<cx+VW;x+=gs){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WH);ctx.stroke();
  }
  for (let y=0;y<WH;y+=gs){
    ctx.beginPath();ctx.moveTo(cx,y);ctx.lineTo(cx+VW,y);ctx.stroke();
  }

  // Terrain
  ctx.drawImage(tCanvas,0,0);

  // Terrain top edge glow
  ctx.save();
  ctx.strokeStyle='rgba(120,220,80,.7)';
  ctx.lineWidth=1.5;
  ctx.shadowColor='#7dc850';ctx.shadowBlur=4;
  ctx.beginPath();
  let inLine=false;
  for (let x=cx;x<cx+VW;x+=2) {
    const sy=surfaceY(x);
    if (sy<WH-2) {
      if (!inLine){ctx.moveTo(x,sy);inLine=true;}
      else ctx.lineTo(x,sy);
    } else inLine=false;
  }
  ctx.stroke();
  ctx.restore();




  // Projectile
  if (G.proj && G.phase==='projectile') renderProj();

  // Particles
  renderParticles();

  // Characters
  [G.enemy, G.player].filter(Boolean).forEach(renderChar);

  // Floating texts
  renderTexts();

  ctx.restore();

  // Screen-space elements
  renderMinimap();
}

function renderChar(c) {
  if (!c.alive && c.hp <= 0) return;
  ctx.save();
  ctx.globalAlpha = c.alive ? 1 : 0.18;
  const flash = c.flashTimer > 0 && (c.flashTimer%4 < 2);
  c.flashTimer = Math.max(0, c.flashTimer-1);
  const isActive=(c.isPlayer&&G.phase==='player')||(!c.isPlayer&&(G.phase==='ai_think'||G.phase==='ai_fire'));
  if (isActive){ctx.shadowColor='#fff';ctx.shadowBlur=16;}

  // Body
  ctx.strokeStyle=flash?'#000':'#fff';
  ctx.fillStyle=flash?'#fff':'#0a0a0a';
  ctx.lineWidth=flash?3:1.8;
  ctx.beginPath();ctx.arc(c.x,c.y,CR,0,Math.PI*2);
  ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;

  // Eye
  ctx.fillStyle=flash?'#000':'#fff';
  ctx.beginPath();ctx.arc(c.x+c.facing*4.5,c.y-4,3.5,0,Math.PI*2);ctx.fill();

  // Snout
  ctx.fillStyle=flash?'#000':'#fff';
  ctx.beginPath();
  ctx.moveTo(c.x+c.facing*(CR-1),c.y);
  ctx.lineTo(c.x+c.facing*(CR+7),c.y-3);
  ctx.lineTo(c.x+c.facing*(CR+7),c.y+3);
  ctx.closePath();ctx.fill();

  // Weapon badge
  ctx.globalAlpha=(c.alive?1:0.18)*.45;
  ctx.font=`9px "Share Tech Mono"`;
  ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.fillText(WEAPONS[c.wpnIdx].sym,c.x,c.y+CR+12);
  ctx.globalAlpha=c.alive?1:0.18;

  // Aim indicator (player only, short straight line)
  if (c.isPlayer && G.phase==='player') renderAimLine(c);
  // AI thinking indicator
  if (!c.isPlayer && G.phase==='ai_think') {
    const t=Date.now()/280;
    ctx.globalAlpha=(0.3+Math.sin(t)*.25);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(c.x,c.y-CR-10,3.5,0,Math.PI*2);ctx.fill();
  }

  ctx.restore();
}

function renderAimLine(c) {
  const rad=c.angle*Math.PI/180;
  const dx=Math.cos(rad), dy=-Math.sin(rad);
  const len=36;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.85)';
  ctx.lineWidth=1.8;
  ctx.beginPath();
  ctx.moveTo(c.x+dx*(CR+2), c.y+dy*(CR+2));
  ctx.lineTo(c.x+dx*(CR+2+len), c.y+dy*(CR+2+len));
  ctx.stroke();
  // Tip dot
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.arc(c.x+dx*(CR+2+len+3), c.y+dy*(CR+2+len+3), 2.5, 0, Math.PI*2);
  ctx.fill();
  // Angle arc hint
  ctx.strokeStyle='rgba(255,255,255,.1)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.arc(c.x,c.y,24,-Math.PI,0);
  ctx.stroke();
  // Angle dot on arc
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath();
  ctx.arc(c.x+dx*24,c.y+dy*24,2,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function renderProj() {
  const p=G.proj;
  for (let i=0;i<p.trail.length;i++) {
    const t=p.trail[i];
    const a=(i/p.trail.length)*.5;
    const r=p.weapon.projR*(i/p.trail.length)*.75;
    ctx.globalAlpha=a;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(t.x,t.y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.shadowColor='#fff';ctx.shadowBlur=12;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(p.x,p.y,p.weapon.projR,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
}

function renderParticles() {
  for (const p of G.particles) {
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    if (p.type==='dot'){
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz*p.life,0,Math.PI*2);ctx.fill();
    } else if (p.type==='ring'){
      ctx.strokeStyle='#fff';
      ctx.lineWidth=Math.max(.5,1.8*p.life);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
    } else if (p.type==='line'){
      const vn=Math.hypot(p.vx,p.vy)||1;
      ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(.5,1.3*p.life);
      ctx.beginPath();ctx.moveTo(p.x,p.y);
      ctx.lineTo(p.x-(p.vx/vn)*p.len,p.y-(p.vy/vn)*p.len);ctx.stroke();
    }
    ctx.restore();
  }
}

function renderTexts() {
  for (const t of G.texts) {
    ctx.save();ctx.globalAlpha=Math.max(0,t.life);
    ctx.font=`bold ${t.sz}px "Bebas Neue",monospace`;ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,.9)';ctx.lineWidth=4;ctx.strokeText(t.txt,t.x,t.y);
    ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);
    ctx.restore();
  }
}


function renderMinimap() {
  const mw=clamp(Math.round(VW*.2),130,180), mh=18;
  const mx=Math.round(VW/2-mw/2), my=WH-mh-5;
  const sc=mw/WW;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.75)';
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
  ctx.fillRect(mx,my,mw,mh);ctx.strokeRect(mx,my,mw,mh);
  // Viewport indicator
  ctx.strokeStyle='rgba(255,255,255,.22)';
  ctx.strokeRect(mx+G.camX*sc, my, VW*sc, mh);
  // Player dot
  if (G.player?.alive){
    ctx.fillStyle='#fff';ctx.beginPath();
    ctx.arc(mx+G.player.x*sc,my+mh/2,2.2,0,Math.PI*2);ctx.fill();
  }
  if (G.enemy?.alive){
    ctx.fillStyle='#555';ctx.beginPath();
    ctx.arc(mx+G.enemy.x*sc,my+mh/2,2.2,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

// ════════════════════════════════════════════════════
// MAIN LOOP
// ════════════════════════════════════════════════════
let lastTS=0;
function loop(ts) {
  const _dt=Math.min((ts-lastTS)/16.67,3);
  lastTS=ts;
  G.screenShake=Math.max(0,G.screenShake-.85);

  // BGM tick (lookahead scheduling)
  BGM.tick();

  switch(G.phase) {
    case 'player': {
      // Hold controls
      if (BTN.ml && G.player.sta>0) {
        if (tryMoveChar(G.player,-1)) {
          G.player.sta=Math.max(0,G.player.sta-.45);
          camFollow(G.player.x);
          if (Math.floor(ts/100)!==Math.floor((ts-16)/100)) sfx('move');
          updateHUD();
        }
      }
      if (BTN.mr && G.player.sta>0) {
        if (tryMoveChar(G.player,1)) {
          G.player.sta=Math.max(0,G.player.sta-.45);
          camFollow(G.player.x);
          if (Math.floor(ts/100)!==Math.floor((ts-16)/100)) sfx('move');
          updateHUD();
        }
      }
      if (BTN.am) setAngle(G.player.angle-0.6);
      if (BTN.ap) setAngle(G.player.angle+0.6);

      // Charge power
      if (G.charging) {
        const elapsed=(performance.now()-G.chargeT)/1000;
        const cyc=elapsed%6.0;
        const pow=cyc<3.0?cyc/3.0:1-(cyc-3.0)/3.0;
        updatePowerUI(pow);
        updateChargeSound(pow);
      }

      charGravity(G.player);
      break;
    }

    case 'ai_think': {
      G.aiTimer--;
      if (G.aiTimer<=0) {
        G.phase='ai_fire'; G.aiTimer=45;
        G.enemy.angle=G.aiShot.angle;
      }
      break;
    }

    case 'ai_fire': {
      G.aiTimer--;
      if (G.aiTimer<=0) {
        sfx('shoot');
        G.proj=mkProj(G.enemy,G.aiShot.power);
        G.whoFired='enemy';
        G.phase='projectile';
      }
      break;
    }

    case 'projectile': {
      if (G.proj) {
        const res=stepProj(G.proj);
        if (res==='terrain'||res==='oob'||(res&&res.hit)) {
          if (res!=='oob') doExplosion(G.proj.x,G.proj.y,G.proj);
          G.proj=null;
          if (!checkOver()) {
            G.phase='post'; G.postTimer=75;
          }
        } else {
          camFollow(G.proj.x);
        }
      }
      break;
    }

    case 'post': {
      charGravity(G.player);
      charGravity(G.enemy);
      if (checkOver()) break;
      G.postTimer--;
      if (G.postTimer<=0) {
        G.turn++;
        if (G.whoFired==='player') startAITurn();
        else startPlayerTurn();
      }
      break;
    }
  }

  tickParticles();
  render();
  requestAnimationFrame(loop);
}


// ════════════════════════════════════════════════════
// INIT / RESTART
// ════════════════════════════════════════════════════
function restart() {
  G.particles=[]; G.texts=[];
  G.proj=null; G.charging=false;
  G.screenShake=0; G.turn=0;
  G.dragStart=null; G.dragMoved=false;
  updatePowerUI(0);

  initTerrain();

  const p1x=200, p2x=WW-200;
  G.player=mkChar(p1x, GROUND_Y-CR-1, true);
  G.enemy =mkChar(p2x, GROUND_Y-CR-1, false);

  camFollow(G.player.x);
  lastTickedAngle=-999;
  setAngle(45);
  document.getElementById('round-num').textContent='R·1';
  updateHUD();
  startPlayerTurn();
}

function init() {
  initTerrain();
  setupControls();
  setupCanvasPointer();

  const p1x=200, p2x=WW-200;
  G.player=mkChar(p1x, GROUND_Y-CR-1, true);
  G.enemy =mkChar(p2x, GROUND_Y-CR-1, false);

  camFollow(G.player.x);
  setAngle(45);
  updateHUD();
  G.phase='start';

  document.getElementById('overlay').style.display='flex';

  requestAnimationFrame(loop);
}

init();
</script>
